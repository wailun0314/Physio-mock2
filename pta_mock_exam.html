function mcQuizHTML(s,it){
  var q=MCBY[it.id],practice=s.mode==='practice',answered=it.picked!==null;
  var h='<div class="card"><div class="tags"><span class="tag">'+esc(UL[q.u])+'</span>'+tierTag(q.t)+(q.sc?'<span class="tag alt">情境題</span>':'')+(it.flagged?'<span class="tag warn">已標記</span>':'')+'</div>';
  h+='<div class="qno"><span class="num">'+(s.idx+1)+'.</span><h2 class="qtext serif">'+esc(q.q)+'</h2></div>';
  var o=optsOf(q);
  it.order.forEach(function(oi,i){
    var cls='opt';
    if(practice&&answered){
      if(i===it.a)cls+=' correct';else if(i===it.picked)cls+=' wrong';else cls+=' dim';
    }else if(!practice&&it.picked===i)cls+=' sel';
    h+='<button class="'+cls+'" data-act="pick" data-i="'+i+'"'+((practice&&answered)?' aria-disabled="true"':'')+'><span class="k">'+LET[i]+'</span><span class="t">'+esc(o[oi])+'</span></button>';
  });
  if(practice&&answered){
    var ok=it.picked===it.a;
    h+='<div class="exp '+(ok?'ok':'bad')+'" role="status"><b>'+(ok?'答對了':'答錯了，正確答案是 '+LET[it.a])+'</b><p>'+esc(q.e)+'</p>'+locHTML(q)+'</div>';
  }
  return h+'</div>';
}
function sqQuizHTML(s,it){
  var q=SQBY[it.id];
  var h='<div class="card"><div class="tags"><span class="tag">'+esc(UL[q.u])+'</span>'+tierTag(q.t)+'<span class="tag alt">SQ，不計分</span>'+(it.flagged?'<span class="tag warn">已標記</span>':'')+'</div>';
  h+='<div class="qno"><span class="num">'+(s.idx+1)+'.</span><h2 class="qtext serif">'+esc(q.q)+'</h2></div>';

}
function quizHTML(){

  if(S.navOpen){
    h+='<div class="card tight"><div class="grid">';
    s.items.forEach(function(x,i){
      var c='cell'+(x.k==='sq'?' sq':'');
      if(i===s.idx)c+=' cur';
      if(x.k==='mc'&&x.picked!==null){c+=practice?(x.picked===x.a?' ok':' bad'):' ans';}
      else if(x.k==='sq'&&isDone(x))c+=' ans';
      if(x.flagged)c+=' flag';
      h+='<button class="'+c+'" data-act="goto" data-n="'+i+'" aria-label="第 '+(i+1)+' 題（'+(x.k==='mc'?'MC':'SQ')+'）">'+(i+1)+'</button>';
    });
    h+='</div><div class="legend">'+(practice?'<span>綠：MC 答對</span><span>紅：MC 答錯</span>':'<span>藍：已作答</span>')+'<span>方形：SQ</span><span>黃點：已標記</span><span>黑框：目前題目</span></div></div>';
  }
  var last=s.idx===s.items.length-1;
  var act='<div class="actions"><div class="in">'
    +'<button class="btn flex" data-act="prev"'+(s.idx===0?' disabled':'')+'>上一題</button>'
    +'<button class="btn mark flex" data-act="flag" aria-pressed="'+it.flagged+'">標記</button>'
    +'<button class="btn flex" data-act="nav" aria-pressed="'+S.navOpen+'">題號</button>'
    +(last?'<button class="btn pri wide" data-act="submit">'+(practice?'完成':'交卷')+'</button>':'<button class="btn pri wide" data-act="next">下一題</button>')
    +'</div></div>';
  return h+act;
}

function resultHTML(){
  var s=S.session,t=tally(s),sqs=s.items.filter(function(x){return x.k==='sq';});
  var sec=Math.round((s.end-s.start)/1000);
  var h='';
  if(t.n){
    var pass=t.c>=t.n*PASS;
    h+='<div class="card"><div class="score"><div class="big">'+t.c+' <small>/ '+t.n+'</small></div>'
      +(s.paper?'<span class="verdict '+(pass?'pass':'fail')+'">'+(pass?'達到參考線':'未達參考線')+'</span>':'')
      +'<p class="muted small" style="margin-top:10px">MC 答對率 '+Math.round(t.c/t.n*100)+'%，答錯 '+t.w+' 題'+(t.u?'，未作答 '+t.u+' 題':'')+'，用時 '+fmt(sec)+'。'+(s.paper?'參考線為 50%（實際及格分以課程公佈為準）；SQ 不計分。':'')+'</p></div></div>';
    var per={};
    s.items.forEach(function(it){if(it.k!=='mc')return;var u=MCBY[it.id].u;per[u]=per[u]||{c:0,n:0};per[u].n++;if(it.picked===it.a)per[u].c++;});
    h+='<h2 class="h-sec">各單元表現（MC）</h2><div class="card"><div class="bars">';
    UORDER.forEach(function(u){
      if(!per[u])return;
      var r=Math.round(per[u].c/per[u].n*100);
      h+='<div><div class="bar-h"><span>'+esc(UL[u])+'</span><span>'+per[u].c+' / '+per[u].n+'（'+r+'%）</span></div><div class="bar-t"><i class="'+(r<50?'low':(r>=80?'hi':''))+'" style="width:'+r+'%"></i></div></div>';
    });
    h+='</div></div>';
    var weak=UORDER.filter(function(u){return per[u]&&per[u].n>=2&&per[u].c/per[u].n<0.6;});
    if(weak.length)h+='<p class="muted small" style="margin:-4px 2px 14px">建議優先重溫：'+weak.map(function(u){return esc(UL[u]);}).join('、')+'。</p>';
  }else{
    h+='<div class="card"><div class="score"><div class="big">'+sqs.length+' <small>題 SQ</small></div><p class="muted small" style="margin-top:10px">SQ 不計分，用時 '+fmt(sec)+'。下方是你的自我評估。</p></div></div>';
  }
  if(sqs.length){
    var cnt={2:0,1:0,0:0,n:0};
    sqs.forEach(function(x){if(x.rate===null)cnt.n++;else cnt[x.rate]++;});
    h+='<h2 class="h-sec">SQ 自我評估（不計分）</h2><div class="card"><p>答得好 '+cnt[2]+' 題，答到一部分 '+cnt[1]+' 題，要重溫 '+cnt[0]+' 題，未評估 '+cnt.n+' 題。</p>';
    var need=sqs.filter(function(x){return x.rate!==2;});
    if(need.length){
      h+='<p class="hint">建議重溫：</p><ul class="sqlist">';
      need.forEach(function(x){h+='<li>'+esc(SQBY[x.id].q)+'</li>';});
      h+='</ul>';
    }
    h+='</div>';
  }
  var wrongCount=t.w+t.u;
  h+='<button class="btn pri block" data-act="rv" data-f="all">逐題檢視題解'+(sqs.length?'及 SQ 參考答案':'')+'</button>';
  if(t.w)h+='<button class="btn block" data-act="rv" data-f="wrong">只看答錯的 MC（'+t.w+'）</button>';
  if(wrongCount)h+='<button class="btn block" data-act="retry">重做答錯及未答的 MC（'+wrongCount+'）</button>';
  var sqNeedHere=sqs.filter(function(x){return x.rate!==2;}).length;
  if(sqNeedHere)h+='<button class="btn block" data-act="retrySQ">重做未評為「答得好」的 SQ（'+sqNeedHere+'）</button>';
  h+='<button class="btn block" data-act="again">再做一次</button><button class="btn block" data-act="home">返回主頁</button>';
  return h;
}

function reviewHTML(){
  var s=S.session,f=S.rfilter;
  var fl=[['all','全部'],['wrong','MC 答錯'],['na','MC 未作答'],['flag','已標記'],['sq','SQ']];
  var h='<div class="chips" style="margin-bottom:14px">';
  fl.forEach(function(x){
    if(x[0]==='sq'&&!s.items.some(function(i){return i.k==='sq';}))return;
    if((x[0]==='wrong'||x[0]==='na')&&!hasMC(s))return;
    h+='<button class="chip" data-act="rv" data-f="'+x[0]+'" aria-pressed="'+(f===x[0])+'">'+x[1]+'</button>';
  });
  h+='</div>';
  var shown=0;
  s.items.forEach(function(it,i){
    if(it.k==='mc'){
      var q=MCBY[it.id];
      var st=it.picked===null?'na':(it.picked===it.a?'ok':'bad');
      if(f==='wrong'&&st!=='bad')return;
      if(f==='na'&&st!=='na')return;
      if(f==='flag'&&!it.flagged)return;
      if(f==='sq')return;
      shown++;
      h+='<div class="card"><div class="rv-head"><span class="st '+st+'">第 '+(i+1)+' 題（MC）　'+(st==='ok'?'答對':(st==='bad'?'答錯':'未作答'))+'</span><span class="tags" style="margin:0"><span class="tag">'+esc(UL[q.u])+'</span>'+tierTag(q.t)+(it.flagged?'<span class="tag warn">已標記</span>':'')+'</span></div>';
      h+='<h3 class="qtext serif" style="font-size:1.05rem">'+esc(q.q)+'</h3>';
      var o=optsOf(q);
      it.order.forEach(function(oi,k){
        var cls='opt dim';
        if(k===it.a)cls='opt correct';
        else if(k===it.picked)cls='opt wrong';
        var note=(k===it.a?'　（正確答案）':'')+(k===it.picked?(k===it.a?'':'　（你的答案）'):'');
        h+='<div class="'+cls+'" style="cursor:default"><span class="k">'+LET[k]+'</span><span class="t">'+esc(o[oi])+note+'</span></div>';
      });
      h+='<div class="exp"><b>題解</b><p>'+esc(q.e)+'</p>'+locHTML(q)+'</div></div>';
    }else{
      var sq=SQBY[it.id];
      if(f==='wrong'||f==='na')return;
      if(f==='flag'&&!it.flagged)return;
      shown++;
      h+='<div class="card"><div class="rv-head"><span class="st na">第 '+(i+1)+' 題（SQ，不計分）</span><span class="tags" style="margin:0"><span class="tag">'+esc(UL[sq.u])+'</span>'+tierTag(sq.t)+(it.flagged?'<span class="tag warn">已標記</span>':'')+'</span></div>';
      h+='<h3 class="qtext serif" style="font-size:1.05rem">'+esc(sq.q)+'</h3>'+sqAnsHTML(sq,it,i,true)+'</div>';
    }
  });
  if(!shown)h+='<div class="empty">這個篩選下沒有題目。</div>';
  h+='<button class="btn block" data-act="result">返回結果</button>';
  return h;
}

function modalHTML(){
  if(!S.modal)return '';
  var m=S.modal;
  var h='<div class="ov" role="dialog" aria-modal="true"><div class="box"><h3>'+esc(m.title)+'</h3><p class="muted">'+esc(m.body)+'</p><div class="row">';
  m.actions.forEach(function(a){h+='<button class="btn flex'+(a.pri?' pri':'')+'" data-act="'+a.act+'">'+esc(a.label)+'</button>';});
  return h+'</div></div></div>';
}

function render(keep){
  var y=window.scrollY;
  renderHeader();
  var html;
  if(S.view==='home')html=homeHTML();
  else if(S.view==='quiz')html=quizHTML();
  else if(S.view==='result')html=resultHTML();
  else html=reviewHTML();
  $app.className='wrap'+(S.view==='quiz'?' inquiz':'');
  $app.innerHTML=html;
  $modal.innerHTML=modalHTML();
  if(keep)window.scrollTo(0,y);
}

/* ---------- events ---------- */
function startFromSet(name){
  var cfg=null,F=function(arr,fn){return ids(arr.filter(fn));};
  if(name==='paperA'||name==='paperB'||name==='paperC'){
    var P=paperSet(name.slice(5));
    cfg={title:'模擬卷 '+name.slice(5),mc:P.mc,sq:P.sq,paper:true,tag:'paper'};
  }else if(name==='paperR'){
    var P2=makePaper(Date.now(),{},{});
    cfg={title:'隨機組卷',mc:P2.mc,sq:P2.sq,paper:true,tag:'paper'};
  }else if(name==='mcHL')cfg={title:'MC 綠色及橙色重點',mc:F(BANK_MC,function(q){return q.t==='g'||q.t==='o';}),sq:[]};
  else if(name==='mcAll')cfg={title:'全部 MC',mc:ids(BANK_MC),sq:[]};
  else if(name==='mcOther')cfg={title:'SQ 範圍及補充題（MC）',mc:F(BANK_MC,function(q){return q.t==='r'||q.t==='n';}),sq:[]};
  else if(name==='mcWrong')cfg={title:'MC 錯題本',mc:wrongIds().sort(),sq:[],tag:'wrong'};
  else if(name==='sq3'){
    var r=rng(Date.now());
    var gs=UORDER.filter(function(g){return BANK_SQ.some(function(s){return s.u===g;});});
    var pick3=[];
    for(var n=0;n<3&&gs.length;n++){
      var g=wsample(gs,function(x){return SQW[x];},1,r)[0];
      gs=gs.filter(function(x){return x!==g;});
      var sp=BANK_SQ.filter(function(s){return s.u===g;});
      pick3.push(wsample(sp,function(s){return(s.t==='r'||s.t==='o')?3:1;},1,r)[0]);
    }
    cfg={title:'SQ 隨機 3 題',mc:[],sq:ids(pick3)};
  }
  else if(name==='sqHL')cfg={title:'SQ 紅色及橙色重點',mc:[],sq:F(BANK_SQ,function(q){return q.t==='r'||q.t==='o';})};
  else if(name==='sqAll')cfg={title:'全部 SQ',mc:[],sq:ids(BANK_SQ)};
  else if(name==='sqWk')cfg={title:'SQ 工作紙原題',mc:[],sq:F(BANK_SQ,function(q){return !!q.k;})};
  else if(name==='sqNeed')cfg={title:'SQ 待重溫',mc:[],sq:sqNeed().sort()};
  else if(name.indexOf('mc:')===0){var u=name.slice(3);cfg={title:UL[u]+'（MC）',mc:F(BANK_MC,function(q){return q.u===u;}),sq:[]};}
  else if(name.indexOf('sq:')===0){var u2=name.slice(3);cfg={title:UL[u2]+'（SQ）',mc:[],sq:F(BANK_SQ,function(q){return q.u===u2;})};}
  if(!cfg||(!cfg.mc.length&&!cfg.sq.length))return;
  startSet(cfg);
}
function act(a,d){
  switch(a){
    case 'theme':mem.theme=mem.theme==='auto'?'dark':(mem.theme==='dark'?'light':'auto');applyTheme();save();render();break;
    case 'pref':
      if(d.k==='mode')mem.prefs.mode=d.v;else mem.prefs[d.k]=d.v==='1';
      save();render();break;
    case 'start':startFromSet(d.set);break;
    case 'pick':pick(+d.i);break;
    case 'prev':go(S.session.idx-1);break;
    case 'next':go(S.session.idx+1);break;
    case 'goto':go(+d.n);break;
    case 'flag':flag();break;
    case 'nav':S.navOpen=!S.navOpen;render();break;
    case 'reveal':{var it=cur();if(it&&it.k==='sq'&&canReveal(S.session)){it.shown=true;render(true);}break;}
    case 'rate':{
      var item=S.session.items[+d.n];
      if(item&&item.k==='sq'){item.rate=+d.r;mem.sq[item.id]=+d.r;save();render(true);}
      break;}
    case 'submit':openSubmit();break;
    case 'finish':finish();break;
    case 'closeModal':S.modal=null;render();break;
    case 'quit':
      S.modal={title:'退出作答？',body:'目前這份測驗的進度不會保留。已答錯的 MC 已記入錯題本，已作的 SQ 自評已儲存。',actions:[{label:'繼續作答',act:'closeModal'},{label:'退出',act:'quitYes',pri:1}]};render();break;
    case 'quitYes':stopTimer();S.modal=null;S.view='home';S.session=null;render();window.scrollTo(0,0);break;
    case 'home':stopTimer();S.view='home';S.session=null;render();window.scrollTo(0,0);break;
    case 'rv':S.view='review';S.rfilter=d.f||'all';render();window.scrollTo(0,0);break;
    case 'result':S.view='result';render();window.scrollTo(0,0);break;
    case 'again':startSet(Object.assign({},S.session.cfg,{mode:S.session.mode}));break;
    case 'retry':{
      var mi=S.session.items.filter(function(x){return x.k==='mc'&&x.picked!==x.a;}).map(function(x){return x.id;});
      if(mi.length)startSet({title:'重做：'+S.session.title,mc:mi,sq:[],tag:S.session.tag==='wrong'?'wrong':'',mode:S.session.mode});
      break;}
    case 'retrySQ':{
      var si=S.session.items.filter(function(x){return x.k==='sq'&&x.rate!==2;}).map(function(x){return x.id;});
      if(si.length)startSet({title:'重做 SQ：'+S.session.title,mc:[],sq:si,mode:S.session.mode});
      break;}
    case 'clear':
      S.modal={title:'清除所有紀錄？',body:'成績紀錄、MC 錯題本及 SQ 自評會被清除，不能復原。',actions:[{label:'取消',act:'closeModal'},{label:'清除',act:'clearYes',pri:1}]};render();break;
    case 'clearYes':mem.history=[];mem.wrong={};mem.sq={};save();S.modal=null;render();break;
  }
}
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-act]'):null;
  if(!t||t.disabled)return;
  act(t.dataset.act,t.dataset);
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t&&t.id==='sqText'&&S.session&&S.view==='quiz'){var it=cur();if(it&&it.k==='sq')it.text=t.value;}
});
document.addEventListener('keydown',function(e){
  if(S.modal){if(e.key==='Escape'){S.modal=null;render();}return;}
  if(S.view!=='quiz'||e.ctrlKey||e.metaKey||e.altKey)return;
  var tg=e.target&&e.target.tagName;
  if(tg==='TEXTAREA'||tg==='INPUT')return;
  var k=(e.key||'').toLowerCase();
  if(k.length===1&&'abcd'.indexOf(k)>-1)pick('abcd'.indexOf(k));
  else if(k.length===1&&'1234'.indexOf(k)>-1)pick(+k-1);
  else if(k==='arrowright')go(S.session.idx+1);
  else if(k==='arrowleft')go(S.session.idx-1);
  else if(k==='f')flag();
});

load();applyTheme();render();
})();
</script>
