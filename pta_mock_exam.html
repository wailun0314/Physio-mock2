輪轆，亦毋須通知使用者作準備"],"a":3,"e":"「之」字路線雖然會增加行走距離，但可減低斜度；萬一發生意外，輪椅亦只會溜向斜坡兩邊，不至於直衝斜坡底，減低嚴重性。","s":"5.4.3.4.3 上斜坡","p":117,"v":"採用「之」或「Z」字路線上落坡度大的斜坡"},{"i":"md30f8a","u":"u54","t":"g","q":"助理員協助輪椅使用者落斜坡時，應如何站位及行走？","c":"背向斜坡，站在受助者後，慢慢將輪椅導後而下","w":["面向斜坡，站在受助者後，向前推輪椅而下","站在輪椅前方，拉著輪椅向斜坡下方行走","側身站立，並加快速度令輪椅直衝而下"],"a":2,"e":"落斜坡：背向斜坡，站在受助者後，手握推柄，雙腳前後站立，前膝微屈，重心於前腳；保持腰部挺直，慢慢將輪椅導後。助理員協助受助者落斜坡時應背向而下。","s":"5.4.3.4.4 落斜坡","p":117,"v":"助理員協助受助者落斜坡時應背向而下"},{"i":"m1pv4agp","u":"u54","t":"n","q":"助理員協助輪椅使用者上斜坡時，應：","c":"站在受助者後，腰部挺直，以下肢發力推前，並提醒重心向前","w":["站在輪椅前方，向上拉動輪椅，提醒使用者後仰","彎腰以背部發力推輪椅，並提醒使用者重心向後","站在輪椅旁邊，單手推動，並提醒使用者站起"],"a":0,"e":"上斜坡時提醒輪椅使用者重心向前，以免輪椅向後翻。","s":"5.4.3.4.3 上斜坡","p":117,"v":"保持腰部挺直，利用下肢發力把輪椅推前"},{"i":"m3w7feo","u":"u54","t":"n","q":"兼備氣呔及實心呔好處的輪椅輪胎是：","c":"原子呔","w":["實心呔","氣呔","前輪細輪"],"a":1,"e":"輪胎主要分 3 種：實心呔（不會爆胎）；氣呔（吸震力強，適合室外使用，但會漏氣，須定期保養）；原子呔（兼備氣呔及實心呔的好處）。","s":"5.4.1.1 輪椅的結構（c 車輪）","p":112,"v":"原子呔：兼備氣呔及實心呔的好處"},{"i":"mittpk5","u":"u54","t":"n","q":"吸震力強、適合室外使用，但會漏氣、須定期保養的輪椅輪胎是：","c":"氣呔","w":["實心呔","原子呔","細後輪"],"a":3,"e":"實心呔不會爆胎；氣呔吸震力強但會漏氣；原子呔兼備兩者的好處。","s":"5.4.1.1 輪椅的結構（c 車輪）","p":112,"v":"氣呔：吸震力強，適合室外使用，但會漏氣，須定期保養"},{"i":"mpnkf5o","u":"u54","t":"n","q":"為何不應在輪椅背後掛上大量雜物？","c":"令輪椅重心後移，增加後翻的風險","w":["令輪椅輪胎更易漏氣，需要更頻密保養","令輪椅剎掣失靈，不能鎖緊後輪","令輪椅安全帶鬆脫，使用者容易滑前"],"a":1,"e":"輪椅背後的防反桿作用是防止輪椅往後翻；掛上雜物會使重心後移，增加後翻風險。","s":"5.4.3.2 使用輪椅時的注意事項","p":115,"v":"此舉會使輪椅的重心後移，增加後翻的風險"},{"i":"mfnhos1","u":"u54","t":"n","q":"使用者上落輪椅前，下列做法何者正確？","c":"先將兩邊鎖車手掣鎖緊，並將腳踏板摺起及移開","w":["先鬆開剎掣，使輪椅易於移動及貼近病床","保留腳踏板在原位，以承托使用者的雙腳","毋須鎖車，只要有一位助理在旁扶著輪椅即可"],"a":0,"e":"上落輪椅前：確保輪椅及剎掣運作正常；必先將兩邊鎖車手掣鎖緊，避免輪椅滑走；將腳踏板摺起及移開，以免絆倒使用者；使用者雙手放在扶手上，扣上安全帶；留意行走路線。","s":"5.4.3.2.3 上落輪椅前","p":116,"v":"必先將兩邊鎖車手掣鎖緊，避免輪椅滑走，令使用者跌倒"},{"i":"m1l5joxw","u":"u54","t":"n","q":"檢查輪椅的「輪胎」時，檢查事項包括：","c":"有否損壞或漏氣，前後輪軸螺絲有否鬆脫、失掉或纏上毛髮","w":["剎掣是否操作正常，螺絲有否鬆脫或其他損壞","腳踏板翹起後是否穩定，能否穩固地裝回","有否裂痕或生銹，摺合時活動是否順暢或過緊"],"a":2,"e":"輪椅檢查：剎掣（操作、螺絲、損壞）；骨架（裂痕、生銹、螺絲、摺合是否順暢）；輪胎；活動式腳踏；腳踏板；扶手；可裝拆除的扶手；坐墊；靠背；其他（直線行駛、旋轉、雜聲、安全帶）。","s":"5.4.3.6 檢查及維修輪椅","p":118,"v":"輪胎有否損壞或漏氣？前後輪軸之螺絲有否鬆脫","k":"工作紙五 第 3 項"},{"i":"m10cjeub","u":"u54","t":"n","q":"檢查輪椅的「骨架」時，應留意：","c":"有否裂痕或生銹，螺絲有否鬆脫，摺合是否順暢","w":["輪胎有否損壞或漏氣，輪軸螺絲有否鬆脫","剎掣是否操作正常，螺絲有否鬆脫或損壞","靠背及坐墊有否破損，安全帶是否損壞"],"a":3,"e":"剎掣：是否操作正常、螺絲有否鬆脫；骨架：裂痕、生銹、螺絲、摺合時活動是否順暢或過緊；坐墊、靠背：有否破損。","s":"5.4.3.6 檢查及維修輪椅","p":118,"v":"骨架有否裂痕或生銹","k":"工作紙五 第 2 項"},{"i":"m1i8acuo","u":"u54","t":"n","q":"左腳需要協助時，手杖（士的）一般應用於：","c":"右手","w":["左手","雙手同時使用","任何一手皆可"],"a":2,"e":"手杖一般於對邊使用，不建議雙手同時使用；適用於體弱人士或一側下肢不可正常負荷體重者。","s":"5.4.4.1.1 拐杖／士的（Stick）","p":119,"v":"一般於對邊使用（即左腳需協助時，拐杖用於右手）"},{"i":"m1h5g2p7","u":"u54","t":"n","q":"長時間使用可能擠壓臂神經叢，因此現時已極少使用的助行器是：","c":"腋窩拐杖","w":["手肘拐杖","四腳叉","有轆助行架"],"a":1,"e":"腋窩拐杖長時間使用可能擠壓臂神經叢（Brachial Plexus）；手肘拐杖適合平衡較佳及具足夠體力的人士，需要較好的手力。","s":"5.4.4.1.4 腋窩拐杖","p":120,"v":"長時間使用可能擠壓臂神經叢"},{"i":"mqap8cs","u":"u54","t":"n","q":"哪種助行器適合平衡力欠佳和中風患者，使用時需四隻腳平穩著地並有較大的支撐面？","c":"四腳叉（Quadripod）","w":["腋窩拐杖","手肘拐杖","手杖（士的）"],"a":0,"e":"四腳叉：使用時需四隻平穩著地、較大的支撐面、適合平衡力欠佳和中風患者、大部份有左右手握之分。","s":"5.4.4.1.2 四腳叉（Quadripod）","p":119,"v":"適合平衡力欠佳和中風患者"},{"i":"m17xgvz","u":"u54","t":"g","q":"協助使用者步行時，助理必須站於使用者的哪一側，以防弱肢乏力或跌倒？","c":"弱側","w":["健側","正前方","正後方"],"a":3,"e":"助行器使用原則：由物理治療師按使用者身體情況指導使用某類輔助器材；助行器高度要與使用者配合；檢查高度鈕掣是否安全穩妥；協助步行時站於弱側；轉彎時盡量用好腳做重心。","s":"5.4.4.2 助行器的使用原則","p":122,"v":"協助使用者步行時，必須站於使用者弱側，以防弱肢乏力或跌倒"},{"i":"m1a06ijb","u":"u54","t":"g","q":"應由誰按使用者的身體情況，指導他使用某一類輔助器材？","c":"物理治療師","w":["物理治療助理","護士","使用者的家屬"],"a":0,"e":"助行器的使用原則第一項：由物理治療師按使用者身體情況指導他使用某一類輔助器材；助理須按治療師指示選擇合適的助行器（包括高度及類型）。","s":"5.4.4.2 助行器的使用原則","p":122,"v":"由物理治療師按使用者身體情況指導他使用某一類輔助器材"},{"i":"mbif8vv","u":"u54","t":"g","q":"使用助行器轉彎時，應盡量以哪隻腳作重心？","c":"好腳（健側）","w":["壞腳（患側）","兩腳平均","後腳"],"a":2,"e":"轉彎時盡量用好腳做重心，以減低跌倒風險。","s":"5.4.4.2 助行器的使用原則","p":122,"v":"轉彎時盡量用好腳做重心"},{"i":"mpgkx4p","u":"u54","t":"g","q":"量度助行器高度時，最好發力的角度是手肘微曲約：","c":"20-30 度","w":["0 度（完全伸直）","45-60 度","90 度"],"a":1,"e":"量度助行器高度：最好發力的角度為手肘微曲 20-30 度，並可參考股骨大轉子的位置；第一次調校以病人主觀的感覺為依歸。","s":"5.4.4.2.1 量度助行器高度方法","p":122,"v":"最好發力的角度：手肘微曲20-30度"},{"i":"mwjcskm","u":"u54","t":"n","q":"使用手杖步行的正確次序是：","c":"手杖 → 弱腳 → 好腳","w":["弱腳 → 手杖 → 好腳","好腳 → 手杖 → 弱腳","手杖 → 好腳 → 弱腳"],"a":1,"e":"手杖：手杖放前約一步 → 弱腳行前 → 好腳跟上 → 重複。使用助行架時助行器 → 壞腳 → 好腳；上梯級：好腳先上；落梯級：壞腳先落。","s":"5.4.4.3.1 手杖的使用步驟","p":122,"v":"重複﹕手杖→弱→好"},{"i":"m1hfhau1","u":"u54","t":"g","q":"協助病人落沒有扶手的樓梯，下列做法何者正確？","c":"壞腳先下一級，然後好腳踏下同一級；助理員站於病人弱肢前方","w":["好腳先下一級，然後壞腳踏下同一級；助理員站於病人弱肢後方","壞腳先下一級，然後好腳踏下同一級；助理員站於病人弱肢後方","好腳先下一級，然後壞腳踏下同一級；助理員站於病人健肢後方"],"a":3,"e":"口訣：好腳上，壞腳落。落樓梯時病人站在梯邊、健手握樓梯扶手；助理員站於病人弱肢前方加以協助。","s":"5.4.4.3.5.2 落樓梯（壞腳落）","p":124,"v":"壞腳先下一級，然後好腳踏下同一級"},{"i":"m1qch0ju","u":"u54","t":"n","q":"協助病人上沒有扶手的樓梯，下列做法何者正確？","c":"好腳先上一級，然後把弱腳踏在同一級上；助理員站於病人弱肢後方","w":["壞腳先上一級，然後好腳踏上同一級","好腳先上一級，然後再上第二級，弱腳留在原處","助理員站於病人弱肢前方"],"a":0,"e":"上樓梯（好腳上）：病人站在梯邊，健肢一側手握樓梯扶手；好腳先上一級，再把弱腳踏在同一級；然後好腳再上第二級；助理員站於病人弱肢後方協助。","s":"5.4.4.3.5.1 上樓梯（好腳上）","p":123,"v":"好腳先上一級，然後把弱腳踏在同一級上"},{"i":"mz244ry","u":"u54","t":"g","q":"體位性（姿態性）低血壓的定義是：由躺卧轉為直立時，血壓顯著下降，即：","c":"收縮壓下降大於 20 或舒張壓下降大於 10 毫米汞柱","w":["收縮壓下降大於 10 或舒張壓下降大於 20 毫米汞柱","收縮壓下降大於 40 或舒張壓下降大於 20 毫米汞柱","收縮壓上升大於 20 毫米汞柱"],"a":2,"e":"症狀包括頭昏、頭疼、視力模糊或暫時性視覺消失、虛弱、嗜睡甚至昏厥；主要成因是腦部供血不足；常見原因：藥物（如利尿劑、血管擴張劑）及自主神經系統問題（常見於長者）。","s":"5.5.2.1 引致跌倒的內在因素（體位性低血壓）","p":125,"v":"定義為收縮壓下降大於20或舒張壓下降大於10毫米汞柱"},{"i":"mpmyvo7","u":"u54","t":"g","q":"體位性低血壓的主要成因是：","c":"腦部供血不足","w":["血糖過高","骨質疏鬆","肺部換氣不足"],"a":3,"e":"引致體位性低血壓的原因有多種，但其主要成因是腦部供血不足。降血壓藥可能引致體位性低血壓，故須將轉移動作減慢。","s":"5.5.2.1 引致跌倒的內在因素（體位性低血壓）","p":125,"v":"但其主要成因是腦部供血不足"},{"i":"myno4ly","u":"u54","t":"n","q":"下列何者屬引致跌倒的「外在因素」？","c":"濕滑凹凸的地面，室內光線不足，通道有障礙物","w":["肌肉力量及平衡力下降，視力及聽力衰退","服用降血壓藥，引致體位性低血壓","曾經跌倒而對步行缺乏信心，甚至恐懼"],"a":1,"e":"內在因素：身體機能衰退、情緒心理因素、過份自信、酒精藥物影響、疾病影響；外在因素：環境因素、缺乏扶手或不當使用輔助物品、不良生活習慣（不合適的助行器具、過長褲子、站在不穩的椅子拿高物）。","s":"5.5.2.2 外在因素","p":126,"v":"濕滑、凹凸的地面"},{"i":"m1x8o1d3","u":"u54","t":"g","q":"長者家居的室內燈光，下列何者較適合？","c":"燈光充足，光度適中、不反光，黃光燈泡較適合","w":["光線愈強愈好，以白光強光燈泡為主","昏暗柔和的燈光，以免刺眼","使用會反光的地磚配閃爍燈光"],"a":0,"e":"室內光線：燈光要充足，光度適中、不反光，黃光燈泡比較適合長者；晚上可在枕邊放電筒或安裝床頭燈；走廊安裝夜明燈；把電話及救命鐘放近床邊；使用清晰及較大字體的指示牌。","s":"5.5.3.3 家居環境（a 室內光線）","p":126,"v":"燈光要充足，光度適中、不反光，黃光燈泡比較適合長者使用"},{"i":"m1pw7pdd","u":"u54","t":"n","q":"關於長者使用的椅子，下列何者正確？","c":"座椅太高，身體易向前滑出；太低或太深，則較難起身","w":["座椅愈高愈安全，長者較易坐下及站起","座椅愈低愈容易起身，膝部較省力","座位愈深愈穩固，身體不易向前滑出"],"a":2,"e":"睡房及客廳：椅子的高度要適中；梳化不應太軟；避免使用摺椅和有轆的座椅；地板和傢俬顏色要有強烈對比，地毯要固定妥當。","s":"5.5.3.3 家居環境（b 睡房及客廳）","p":127,"v":"坐椅子太低或坐位太深，使用者身體容易向後傾，較難起身"},{"i":"may1a4y","u":"u54","t":"n","q":"扶抱及轉移方法的「優先採納次序」是：","c":"病人自身能力 → 使用機器（助移機）→ 使用輔助物品 → 體力處理操作","w":["體力處理操作 → 使用輔助物品 → 使用機器 → 病人自身能力","使用機器 → 病人自身能力 → 體力處理操作 → 使用輔助物品","使用輔助物品 → 體力處理操作 → 病人自身能力 → 使用機器"],"a":3,"e":"扶抱原則：確保病人安全（病人安全）、確保扶抱者安全（職業安全）、有效率。考慮因素：病人能力、自身能力、環境限制、可用的輔助物品。","s":"5.6.1.4 優先採納的次序","p":129,"v":"優先採納的次序"},{"i":"m12xzgkx","u":"u54","t":"g","q":"扶抱中風病人時，下列做法何者正確？","c":"患側（尤指肩關節）不可作扶抱的支撐點","w":["拉著患側手臂作支撐點，以便省力","托住患側腋窩，用力向上提","提拉患側肩膊協助站起"],"a":0,"e":"平行式雙人扶抱，兩名助理員手肘托住病人腋窩的方法亦「不適合中風病人」，最好使用扶抱帶。","s":"5.6.3 扶抱時的基本技巧（注意事項）","p":133,"v":"中風病人患側(尤指肩關節)不可作扶抱的支撐點"},{"i":"miah7th","u":"u54","t":"o","q":"進行床與輪椅之間的轉移前，下列何者是必須的？","c":"確保床或輪椅的轆已鎖上","w":["把輪椅停在病人患側","讓病人雙手抱住助理員頸部","助理員雙腳並攏，彎腰準備"],"a":2,"e":"轉移前須除去手錶、飾物並清潔雙手、確保床或輪椅的轆已鎖上、核對病人身份、移開障礙物、盡量縮短轉移的距離、告知病人程序並與其合作。","s":"5.6.3 扶抱時的基本技巧（注意事項）","p":133,"v":"確保床或輪椅的轆已鎖上"},{"i":"mqdjxit","u":"u54","t":"r","q":"病人由輪椅轉移回病床後，助理離開前必須：","c":"上好床欄，並給予求助鐘","w":["放下床欄，方便病人下床","收走求助鐘，免被誤按","替病人扣上輪椅安全帶"],"a":1,"e":"過床後：必須上床欄，給予求助鐘。過椅（大班椅、便椅等）後：必須扣安全帶（或上枱面板），給予求助鐘或安置在能讓職員容易看見的位置。","s":"5.6.3 扶抱時的基本技巧（注意事項）","p":133,"v":"過床後：必須上床欄，給予求助鐘"},{"i":"m3p0y67","u":"u54","t":"r","q":"病人過椅（如大班椅、便椅）後，必須：","c":"扣安全帶或上枱面板，並給予求助鐘或安置在易見位置","w":["解開安全帶，方便病人自行起身及活動","拆去枱面板，方便職員隨時觀察病人","鬆開輪轆，方便稍後把病人推回病房"],"a":1,"e":"過椅後必須扣安全帶；過床後必須上床欄、給予求助鐘。送病人回床時，若沒有特別指示，病人應仰臥於病床正中央，頭部貼近床頭。","s":"5.6.3 扶抱時的基本技巧（注意事項）","p":133,"v":"過椅(大班椅、便椅等)後：必須扣安全帶"},{"i":"m12k0gdb","u":"u54","t":"n","q":"助理協助一位右側偏癱病人由床轉移至輪椅，輪椅應停泊在病人的哪一側？","c":"左側（健側），並鎖上輪轆","w":["右側（患側）","床尾","任何一側，只要鎖上輪轆即可"],"a":0,"e":"右側偏癱 → 患側是右、健側是左。單人扶抱的轉移目標位置應在病人健側（Good Side Approach）：輪椅停泊於健側，拆開腳踏，鎖緊輪轆。（工作紙六第 9 項）","s":"5.6.4.2 單人扶抱","p":134,"v":"轉移目標位置應在病人健側（Good Side Approach）","k":"工作紙六 第 9 項","sc":1},{"i":"m14mlgp","u":"u54","t":"n","q":"單人扶抱病人由床邊轉移至輪椅時，助理員應：","c":"雙腳稍張開，曲膝腰直，叫口令並以下肢發力","w":["彎腰以背部發力，把病人由床邊拉起","雙腳並攏，只用手臂的力量托起病人","不作任何口令，直接把病人提起並轉身"],"a":2,"e":"單人扶抱：讓病人安全坐穩及雙腳平放於地上，助理員面向病人、視線望向輪椅，雙腳稍張開、曲膝腰直；將病人頭部承托於自己肩膊；給予清晰指示並叫口令「一、二、三、上」；以下肢發力、重心轉移；放低時保持曲膝腰直。","s":"5.6.4.2.1 由床邊轉移至輪椅","p":134,"v":"叫口令「一、二、三、上」及以下肢發力，重心轉移","k":"工作紙六 第 13、14 項"},{"i":"m12dm4dp","u":"u54","t":"n","q":"病人坐上輪椅後，助理在移動輪椅前必須先：","c":"為病人扣上安全帶，上肢放輪椅內，雙腳放於腳踏上","w":["鬆開輪轆鎖，以便立即推動輪椅","拆去腳踏板，使病人雙腳可平放地上","讓病人自行調整座位，助理先離開"],"a":3,"e":"善後工作：移動輪椅前扣上安全帶，上肢放在輪椅內、雙腳放於腳踏上；詢問病人在輪椅時有否頭暈或異常及特別需要；完成後助理員須洗淨雙手。","s":"5.6.4.2.1 由床邊轉移至輪椅（善後工作）","p":135,"v":"移動輪椅前為病人扣上輪椅安全帶，將病人上肢放在輪椅內及雙腳放於腳踏上","k":"工作紙六 第 15、17 項"},{"i":"mj3xose","u":"u54","t":"n","q":"當病人快將跌倒，助理應：","c":"將病人拉近自己，保護其頭部，兩腳前後站立，順勢坐下","w":["立即放手，退後避開，以免自己受傷","用力拉住病人手臂，使其站直及站穩","推開病人，並大聲呼叫其他同事過來"],"a":3,"e":"快將跌倒的病人：以雙手支撐病人腋下或抓緊褲頭；拉近自己身邊（重物近身）；保護頭部；慢慢順勢坐下；安慰病人、召喚他人幫助；監察、匯報及記錄。","s":"5.6.5.1 快將跌倒的病人","p":136,"v":"將病人拉近自己身邊"},{"i":"mqv9khl","u":"u57","t":"g","q":"下列哪類病人皆需要進行被動式運動？","c":"無法作主動活動的病人，如昏迷或半邊嚴重癱瘓者","w":["能自行完成全部運動的健康成人及運動員","只有輕微肌肉痠痛，但可作主動活動的人","體力良好、能自行做全套伸展運動的青少年"],"a":0,"e":"被動式運動是指外力（他人／儀器）協助進行的伸展、關節活動等運動。種類：被動式伸展運動、被動式關節活動運動、姿勢性運動（協助正坐、轉身、協助式站立）。","s":"5.7.1 被動式運動（Passive Exercise）","p":138,"v":"無法作主動活動，例如昏迷或半邊嚴重癱瘓的病人，皆需要進行被動運動"},{"i":"m8y60v9","u":"u57","t":"n","q":"被動式運動的目的包括：","c":"維持關節及軟組織活動幅度，並維持血液循環、避免深部靜脈栓塞","w":["增加肌肉的力量及耐力，並增加骨密度","提升心肺耐力，並消耗熱量以控制體重","增強背肌力量，改善身體姿勢及平衡力"],"a":1,"e":"被動運動目的：①維持各關節及軟組織的活動幅度，減低肌肉關節攣縮的機會；②維持全身血液循環，避免深部靜脈栓塞。增加肌肉力量及耐力是阻力訓練的目的。","s":"5.7.1.2 被動運動的目的","p":138,"v":"維持全身血液循環，避免深部靜脈栓塞"},{"i":"m1681sxc","u":"u57","t":"n","q":"下列哪種情況「不宜」進行被動運動？","c":"深部靜脈栓塞的肢體","w":["長期卧床的病人","關節僵硬的肢體","半邊嚴重癱瘓的病人"],"a":2,"e":"不宜進行被動運動：患有急性肌肉、肌腱、韌帶損傷；未完全癒合骨折處所牽涉的關節；剛接受手術的肌肉、肌腱、韌帶、關節與皮膚部位；深部靜脈栓塞的肢體。","s":"5.7.1.3 哪些情況不宜進行被動運動","p":138,"v":"深部靜脈栓塞的肢體"},{"i":"m1fgqxwy","u":"u57","t":"n","q":"被動式關節運動一般每一動作做多少次為一組，並重複多少組？","c":"10 次；2-3 組","w":["5 次；1 組","20 次；5 組","10 次；5-6 組"],"a":2,"e":"被動式關節運動以關節部位為運動單位，一般由近端漸至遠端、大關節漸至小關節，包括所有關節活動方向；若關節僵硬，可在運動前熱敷 15-20 分鐘；應盡量協助臥床病人每天進行關節運動。","s":"5.7.1.4.1 被動式關節運動","p":139,"v":"每一動作做10次，如此為一組被動關節運動，重複2-3次"},{"i":"m1qrt0w9","u":"u57","t":"g","q":"俗稱「拉筋」，主要是令肌肉肌腱得以舒展，並減輕肌肉緊張所引致的不適或痛楚的運動是：","c":"伸展運動","w":["阻力訓練","帶氧運動","平衡運動"],"a":1,"e":"伸展運動（Stretching Exercise）又稱「拉筋」；伸展動作的方向與肌肉收縮所帶來的動作方向是相反的。","s":"5.7.2 伸展運動／5.7.2.1 目的","p":139,"v":"俗稱「拉筋」，主要是令身體肌肉肌腱得以舒展和減輕肌肉緊張所引致的不適或痛楚"},{"i":"m5t7tlh","u":"u57","t":"g","q":"「柔軟度」是指：","c":"關節在其正常活動範圍內暢通無阻地作全幅度活動的能力","w":["肌肉在一次收縮時所能產生的最大力量","肌肉能夠持續用力的最長時間或最高反覆次數","心臟及肺部持續供氧的能力"],"a":0,"e":"柔軟度的好壞會直接影響日常活動、工作或運動時的表現；缺乏適當的柔軟度會導致容易出現肌肉拉傷。「肌肉在一次收縮時所能產生的…」是肌肉力量；「肌肉能夠持續用力的最長時間…」是肌肉耐力。","s":"5.7.2.4 伸展運動的好處（改善身體的柔軟度）","p":139,"v":"柔軟度是指關節在其正常活動範圍內暢通無阻地作全幅度活動的能力"},{"i":"m1ts5rgp","u":"u57","t":"n","q":"為一般大眾、長者或未受訓練的人士進行伸展運動時，助理應選用：","c":"靜態的伸展運動（較安全及循序漸進）","w":["動態（動彈式）伸展運動","快速反覆彈震以擴展關節","盡量拉至令病人感到劇痛的幅度"],"a":3,"e":"雖然研究指出動彈式伸展較有效，但只適用於曾受訓練有經驗的人士（較適合運動員）；一般大眾、長者或未受訓練人士應避免進行過大幅度、動彈式的伸展運動。康復中、傷癒後、關節疼痛及懷孕期間的伸展鍛煉，需要專業人士監督。","s":"5.7.2.6 伸展運動 注意事項","p":140,"v":"助理應該選用靜態的伸展運動"},{"i":"my73y7t","u":"u57","t":"n","q":"進行被動式伸展運動時，雙手擺放的位置應在：","c":"被伸展肌肉之上下關節之上","w":["被伸展肌肉的肌腹上並用力按壓","傷口或腫脹的位置","只放在最遠端的關節上"],"a":1,"e":"被動式伸展要點：完全承托患者肢體；了解所伸展的目標肌肉群，伸展位置或力量不應橫跨多個關節；一手為定點（支點），另手為移動點（力點）；以患者可接受程度為宜；盡量與患者保持眼神接觸及對話。","s":"5.7.2.7.2 被動式伸展運動","p":141,"v":"雙手擺放之位置應在被伸展肌肉之上下關節之上"},{"i":"mfo8usq","u":"u57","t":"n","q":"為偏癱病人進行腓腸肌的靜態被動伸展，伸展到最大幅度後，工作紙七要求固定在該位置多久、共做幾次？","c":"15-30 秒；3-5 次","w":["5 秒；10 次","60 秒；1 次","2 分鐘；2 次"],"a":3,"e":"工作紙七（腓腸肌被動伸展）：緩慢地伸展至最大幅度，沒有動彈動作；固定在此位置 15-30 秒，共做 3-5 次。注意筆記 5.7.2.5 寫的是每組動作做 2-3 次、每次維持 20-30 秒；題目若問工作紙操作則以工作紙為準。","s":"5.7.2.5 伸展運動 訓練指引","p":139,"v":"每組動作做2-3次，當肌肉感到輕微拉扯時，每次動作嘗試維持20-30秒","k":"工作紙七 第 13 項"},{"i":"m1khg4g","u":"u57","t":"n","q":"本體感覺神經肌肉促進法（PNF）的指引是：","c":"被動伸展 20-30 秒 → 對抗肌肉主動收縮 → 再被動伸展 20-30 秒","w":["主動收縮 20-30 秒 → 被動伸展 20-30 秒 → 放鬆休息","連續彈震式伸展 10 次 → 休息 → 再作彈震式伸展","被動伸展 5 秒 → 協助者放手 → 病人自行主動伸展"],"a":2,"e":"PNF 屬輔助性伸展運動（Active Assisted Stretching），例子：膕繩肌。助理在加力時須與患者保持溝通，確保力度不會過大；如患者有任何不適，應即時停止及通知治療師。","s":"5.7.2.7.3 輔助性伸展運動（PNF）","p":141,"v":"先作被動伸展20-30秒"},{"i":"m12a1o2f","u":"u57","t":"g","q":"阻力訓練又稱為：","c":"肌力鍛煉／重力訓練","w":["伸展運動／拉筋","帶氧運動／有氧運動","平衡訓練／本體感覺訓練"],"a":0,"e":"阻力訓練是肌肉強化活動（Strengthening Exercise）的一種，目的在於集中改善身體的肌肉力量及肌肉耐力。","s":"5.7.3 阻力訓練（Resistance Exercise）","p":142,"v":"又稱為「肌力鍛煉／重力訓練」"},{"i":"m1k6yku1","u":"u57","t":"o","q":"下列哪項是阻力訓練的好處？","c":"有助血壓和血糖的控制，並減低跌倒及受傷的機會","w":["增加肌肉及關節的慢性痛症，並降低運動能力","令血壓及血糖更難控制，並增加精神壓力","增加跌倒及受傷的機會，並使骨質更易疏鬆"],"a":0,"e":"阻力訓練好處（共 9 項）：有助血壓和血糖控制；減少肌肉及關節慢性痛症；預防骨質疏鬆；減低跌倒及受傷機會；增強運動能力；保持身體正確姿勢及改善體態；促進生理機能及健康；減低精神壓力；增強自信心。","s":"5.7.3.2 阻力訓練的好處","p":142,"v":"有助血壓和血糖的控制"},{"i":"m4fyqfe","u":"u57","t":"o","q":"下列何者是阻力訓練常用的阻力來源？","c":"自身重量、啞鈴／槓鈴等重物及橡根帶","w":["電熱氈、冷敷袋、紅外線燈等熱療用具","超聲波、衝擊波、激光等儀器治療","輪椅、助行架、手杖等輔助器具"],"a":2,"e":"阻力來源：自身重量（Self-body Weight）；重物（Weights）如啞鈴、槓鈴；橡根帶（Theraband）。","s":"5.7.3.3 訓練原則（阻力來源）","p":143,"v":"阻力訓練常用的阻力來源自身重量(Self-body Weight)：使用身體重量"},{"i":"m9g3oej","u":"u57","t":"n","q":"「要令肌肉更強壯發達，必須發揮其日常水準以上的機能」是哪一項訓練原則？","c":"超負荷原則（Overloading）","w":["漸進阻力原則（Progressive）","特異性原則（Specificity）","可逆性原則（Reversibility）"],"a":3,"e":"超負荷原則：在一定期間持續反覆的訓練，肌肉的體積及力量會因而增加。漸進阻力：對初學者阻力或重量應由輕至重，逐漸增加，促使肌肉達到超負荷。","s":"5.7.3.3 訓練原則","p":143,"v":"超負荷原則(Overloading Principle)：要令肌肉更強壯發達，必須發揮其日常水準以上的機能"},{"i":"mdok3dn","u":"u57","t":"g","q":"肱二頭肌的「對抗肌」是：","c":"肱三頭肌","w":["三角肌","胸大肌","腓腸肌"],"a":1,"e":"肱二頭肌作用：屈曲手肘；肱三頭肌作用：伸直手肘。兩者互為主動肌／對抗肌。","s":"5.7.3.4 主動肌／對抗肌（Agonist／Antagonist）","p":143,"v":"主動肌／對抗肌 (Agonist / Antagonist)：例子： 肱二頭肌／肱三頭肌"},{"i":"mrzozk1","u":"u57","t":"n","q":"阻力訓練的訓練頻率為：","c":"每星期針對主要肌群做 2-3 次","w":["每日 3 次","每星期 5 天或以上","每月 1-2 次"],"a":2,"e":"阻力訓練：每星期針對主要肌群做 2-3 次；一般先訓練肌耐力：每組 12-15 下，做 2-4 組。比較：伸展運動每星期針對主要肌群進行 5 天或以上。","s":"5.7.3.5 阻力訓練 訓練指引","p":143,"v":"訓練頻率：每星期針對主要肌群做2-3次"},{"i":"m13ohlfj","u":"u57","t":"g","q":"進行阻力訓練時，正確的呼吸節奏是：","c":"用力時呼氣，放鬆時吸氣","w":["用力時吸氣，放鬆時呼氣","用力時屏息","全程屏息以穩定軀幹"],"a":1,"e":"呼吸節奏：用力時呼氣、放鬆時吸氣，以避免努責現象（用力閉氣會令血壓急升）。","s":"5.7.3.5 阻力訓練 訓練指引（d）","p":143,"v":"呼吸節奏：用力時呼氣、放鬆時吸氣（避免努責現象）"},{"i":"mnoffl1","u":"u57","t":"n","q":"阻力訓練後參加者出現肌肉酸痛，助理應向其說明：","c":"這屬正常反應，可進行熱敷或伸展運動來舒緩","w":["屬嚴重受傷，應立即停止所有活動並冰敷一星期","屬不正常，必須即時送院","應完全卧床休息直至痛楚消失"],"a":0,"e":"阻力訓練注意：穿鬆身衣物；先熱身；採用漸進式鍛煉；速度適中，組與組之間要充分休息；鍛煉完畢後宜作伸展運動作緩和及整理；康復中、傷癒後、關節疼痛及懷孕期間需要專業人士監督。","s":"5.7.3.6 阻力訓練 注意事項","p":144,"v":"提醒參加者進行肌肉訓練後可能會出現肌肉酸痛，並說明此等反應屬正常"},{"i":"mep5dpg","u":"u58","t":"g","q":"各類型關節炎在物理治療的處理原則上大致相近，其復康原則是：","c":"保持或回復關節的功能","w":["完全停止活動以休息關節","盡快以手術置換關節","以止痛藥取代運動"],"a":3,"e":"關節炎治療及護理：冷熱治療（急性期 PRICE，慢性期熱敷）、適量運動、控制體重、保持正確姿勢、均衡飲食增加鈣的吸收、嚴重時佩戴護具、藥物治療（徵狀治療）、手術治療。","s":"5.8.1.1.1 關節炎 復康原則","p":145,"v":"保持或回復關節的功能"},{"i":"m8cud7y","u":"u58","t":"g","q":"骨關節炎／類風濕性關節炎的冷熱治療，急性期使用 PRICE，慢性期則使用：","c":"熱敷","w":["冰敷","按摩","牽引"],"a":1,"e":"急性期：PRICE（保護／固定、休息、冰敷、用彈性帶穩固地輕輕包紮、把受傷部位托高）。冰敷的生理效應是血管收縮，減少組織液，從而減少腫脹；慢性期：熱敷。","s":"5.8.1.1.2.1 骨關節炎／退化性關節炎／類風濕性關節炎（a 冷熱治療）","p":145,"v":"慢性期：熱敷"},{"i":"mae279e","u":"u58","t":"r","q":"急救原則 PRICE 的 P、R、I、C、E 依次代表：","c":"保護、休息、冰敷、加壓、抬高","w":["按摩、休息、冰敷、加壓、抬高","保護、運動、冰敷、加壓、抬高","保護、休息、熱敷、加壓、抬高"],"a":3,"e":"PRICE：保護（Protection）、休息（Rest）、冰敷（Ice）、加壓（Compression）、抬高（Elevation）。急性創傷應冰敷而非熱敷，亦不宜按摩。","s":"5.8.1.13.4 運動創傷 治療及護理方法（a 急救原則）","p":172,"v":"急救原則(General Principles of First Aid)-PRICE"},{"i":"m1n4wmu8","u":"u58","t":"g","q":"骨關節炎／類風濕性關節炎患者適宜進行的運動是：","c":"節奏慢、低負重的運動，如游泳、散步","w":["高衝擊的跳躍運動，如跳繩","劇烈、高負重的運動","完全不運動，以免加劇痛楚"],"a":0,"e":"適量運動可增強肌肉、減輕關節負荷、保持關節活動能力、減輕痛楚；如運動期間或事後出現持續痛楚，應暫停運動休息，下次嘗試減少次數，仍沒有改善可刪除個別運動項目。","s":"5.8.1.1.2.1 骨關節炎／退化性關節炎／類風濕性關節炎（b 適量運動）","p":145,"v":"節奏慢、低負重運動，如游泳、散步"},{"i":"mewfjo2","u":"u58","t":"o","q":"髖關節置換手術後初期（肌肉力量未完全回復前），下列何者「不可」做？","c":"髖關節屈曲多於 90 度","w":["在床上作腳踝屈伸運動","仰臥時雙腿之間放一個枕頭","如廁時使用加高坐墊"],"a":2,"e":"髖關節置換手術後注意事項：不可作髖關節屈曲多於 90 度；不可作髖關節內收超過中線；不可作股骨內轉；如廁給予加高坐墊避免過度屈曲；睡覺時兩腿之間置一個枕頭，直至骨科醫生另行指示。","s":"5.8.1.1.2.1 髖關節置換手術後的注意事項","p":146,"v":"不可作髖關節屈曲多於90度"},{"i":"m16s0yoc","u":"u58","t":"o","q":"下列哪項屬髖關節置換手術後初期「不可」進行的動作？","c":"髖關節內收超過中線，及股骨內轉","w":["髖關節外展","髖關節伸直","踝關節屈伸"],"a":0,"e":"髖關節置換手術後初期不可：屈曲多於 90 度、內收超過中線、股骨內轉。","s":"5.8.1.1.2.1 髖關節置換手術後的注意事項","p":146,"v":"不可作髖關節內收超過中線"},{"i":"m1c3rzzo","u":"u58","t":"r","q":"髖關節置換手術後，晚上睡覺時應：","c":"把一個枕頭置於兩腿之間，直至醫生另行指示","w":["把雙腿交叉擱起，並將髖關節屈曲約 90 度","俯臥睡覺，並把兩腿盡量併攏及向內轉","把兩腿靠緊並抬高過心臟，使髖關節內收"],"a":2,"e":"兩腿間置枕頭可避免髖關節內收超過中線。","s":"5.8.1.1.2.1 髖關節置換手術後的注意事項","p":146,"v":"晚上睡覺時把一個枕頭置於兩腿之間，直至骨科醫生另行指示"},{"i":"m1mt5r4c","u":"u58","t":"r","q":"髖關節置換手術後的病人如廁時，一般會給予加高坐墊，目的是：","c":"避免髖關節過度屈曲","w":["避免膝關節過度伸直","減少便秘","方便病人站立行走"],"a":1,"e":"髖關節不可屈曲多於 90 度；加高坐墊令坐下時髖關節屈曲角度減少。","s":"5.8.1.1.2.1 髖關節置換手術後的注意事項","p":146,"v":"病人如廁時一般會給予加高坐墊，以避免髖關節過度屈曲"},{"i":"mlvm1h4","u":"u58","t":"r","q":"痛風症急性發作時，可以用什麼方法消炎、消腫？","c":"冰敷","w":["熱敷","蠟療","按摩"],"a":3,"e":"痛風的護理：多飲開水（透過排尿幫助排出體內過量尿酸）、冰敷以消炎消腫、控制體重、適量運動（如關節運動）、避免高嘌呤食物、急性發作時遵照醫生指示服用消炎止痛藥。","s":"5.8.1.1.2.2 痛風症","p":146,"v":"冰敷以消炎、消腫"},{"i":"m7crmi1","u":"u58","t":"g","q":"腕管綜合症可使用什麼輔助用具，防止手腕彎曲，以減輕滑膜發炎和腫脹？","c":"支架","w":["彈性襪","頸托","腰封"],"a":1,"e":"腕管綜合症治療及護理：休息患處；使用輔助用具（防止手腕彎曲的支架）；物理治療；藥物治療（消炎藥及局部類固醇注射）；手術治療。","s":"5.8.1.2.2.1 腕骨隧道症候群／腕管綜合症","p":147,"v":"使用輔助用具：防止手腕彎曲的支架可幫助減輕滑膜發炎和腫脹"},{"i":"m6tmkf2","u":"u58","t":"o","q":"網球肘處於發炎期時，可在壓痛部位進行：","c":"冰敷止痛和消炎，患者應避免手腕用力","w":["熱敷以放鬆肌肉","用力按摩壓痛點","蠟療浸泡"],"a":3,"e":"網球肘治療：冰敷（發炎期）；物理治療（超聲波止痛和消炎）；運動治療（肌力加強運動和伸展運動，預防復發）；藥物治療（非類固醇消炎藥或藥膏）。","s":"5.8.1.2.2.4 肱骨外上髁炎（網球肘）","p":148,"v":"當網球肘處於發炎期，可在壓痛的部位以冰敷止痛和消炎"},{"i":"m1i8fvnw","u":"u58","t":"o","q":"網球肘可通過物理治療中的哪種儀器止痛和消炎？","c":"超聲波","w":["牽引","紫外線","偏光燈"],"a":0,"e":"網球肘可通過物理治療，以超聲波止痛和消炎；亦可通過肌力加強運動和伸展運動預防復發。","s":"5.8.1.2.2.4 肱骨外上髁炎（網球肘）","p":148,"v":"可通過物理治療，以超聲波止痛和消炎"},{"i":"m103bv13","u":"u58","t":"o","q":"腰背痛患者每日做多少分鐘輕柔運動，有助減慢退化過程，並使背部肌肉更壯健及柔韌？","c":"30 分鐘","w":["5 分鐘","10 分鐘","120 分鐘"],"a":2,"e":"腰背痛的治療及護理：物理治療、手術治療、藥物治療、適量運動（每日 30 分鐘輕柔運動）、改善生活習慣。","s":"5.8.1.2.2.6 腰背痛","p":148,"v":"適量運動：每日做30分鐘輕柔運動有助減慢退化過程"},{"i":"mm6r46j","u":"u58","t":"r","q":"為預防及改善腰背痛，下列哪項生活習慣正確？","c":"穿著舒適及低跟的鞋，避免穿太高跟的鞋","w":["穿高跟鞋以挺直腰背，改善站立的姿勢","盡量以腰背發力提舉重物，以保護雙腿","增加體重以支撐背部，減輕脊椎的負擔"],"a":0,"e":"改善生活習慣：正確地搬移物件；保持良好站立及坐姿；穿著舒適及低跟的鞋（高跟鞋令身體重量向前傾，增加背部的弧度）；保持適中體重、均衡飲食（過重或肥胖增加背部負擔）。","s":"5.8.1.2.2.6 腰背痛（e 改善生活習慣）","p":148,"v":"穿著舒適及低跟的鞋，避免穿著太高跟的鞋"},{"i":"mb8ndzj","u":"u58","t":"o","q":"治療骨折最重要的因素是：","c":"給予骨骼適當負重（壓力），刺激成骨細胞活動","w":["完全不活動，直至骨折完全癒合為止","避免骨骼承受任何壓力，以免延遲癒合","以止痛藥取代運動，令患者保持靜止"],"a":2,"e":"一般情況下，在骨折還沒完全癒合時已可開始作簡單運動，主要是維持其他沒受影響的關節活動幅度及減少肌肉萎縮；骨折癒合後，患者需接受針對性伸展、關節活動、肌肉力量等訓練。","s":"5.8.1.3 骨折創傷","p":148,"v":"給予骨骼適當的負重(壓力)，從而刺激成骨細胞的活動，是治療骨折最重要的因素"},{"i":"msphk0p","u":"u58","t":"o","q":"骨折痊癒過程的三個階段依次為：","c":"血腫形成期 → 骨痂形成期 → 骨痂改造期","w":["骨痂形成期 → 血腫形成期 → 骨痂改造期","血腫形成期 → 骨痂改造期 → 骨痂形成期","骨痂改造期 → 血腫形成期 → 骨痂形成期"],"a":3,"e":"一）在骨折處血塊的凝結（血腫形成期）；二）纖維組織生長（骨痂形成期）；三）新生骨的形成（骨痂改造期）。","s":"5.8.1.3 骨折創傷","p":148,"v":"骨折的痊癒過程分為三個階段"},{"i":"m14shild","u":"u58","t":"o","q":"骨折治療中的「內固定」是指：","c":"以手術方式將金屬骨釘釘合在骨折部分","w":["從體外以石膏固定骨折部","不作任何固定，等待自然癒合","使用彈性繃帶包紮"],"a":1,"e":"整復骨骼和固定的方法主要分兩類：閉合性復位和外固定（從體外固定骨折部）；開放性復位和內固定（手術將金屬骨釘釘合）。","s":"5.8.1.3.2.1 固定骨折","p":149,"v":"內固定：手術的方式將金屬骨釘釘合在骨折部分"},{"i":"mlcwd0q","u":"u58","t":"n","q":"無移位的骨折，通常可用什麼固定患處？","c":"石膏","w":["手術鋼針","關節置換","牽引"],"a":2,"e":"無移位的骨折通常用石膏固定；移位性骨折須透過手術復位及固定（鑲入鋼針、鋼線或螺絲）；完全粉碎及無法復位的關節則考慮關節置換術。","s":"5.8.1.3.2.1 固定骨折","p":149,"v":"無移位的骨折：通常可用石膏固定患處"},{"i":"m193cfju","u":"u58","t":"n","q":"有研究顯示，曾跌倒的長者再跌倒的機會，比未曾跌倒的高出：","c":"四倍","w":["一倍","兩倍","十倍"],"a":1,"e":"因此物理治療師會加強對骨折患者的平衡力訓練，以減少再次受傷的機會；功能訓練包括關節活動、肌力及功能訓練、控制／平衡力訓練。","s":"5.8.1.3.2.3 骨折 功能訓練（c 控制／平衡力訓練）","p":150,"v":"曾跌倒的長者再跌倒的機會比未曾跌倒的高出四倍"},{"i":"m1wv54kh","u":"u58","t":"g","q":"骨質疏鬆症患者進行負重運動的目的是：","c":"刺激成骨細胞、強化骨骼","w":["刺激破骨細胞活動","減少鈣質吸收","減輕骨骼所承受的壓力"],"a":0,"e":"骨質疏鬆症護理：運動治療（負重運動：對某一骨骼有一定程度的擠壓或壓力）；適量曬太陽（有助合成維他命 D）；減少攝取咖啡因；服用鈣質補充劑；藥物治療（更年期女性可適當補充雌激素）。","s":"5.8.1.4 骨質疏鬆症","p":150,"v":"運動治療：負重運動可刺激成骨細胞、強化骨骼"},{"i":"m1kfitxj","u":"u58","t":"g","q":"關於中風後復康治療的時機，課本指出：","c":"應盡早治療，否則可能出現肌肉張力上升及攣縮等併發問題","w":["應等待三個月後才開始治療，以免加重病情","有黃金復康期，過後便再無進步的空間","只靠針灸便足以康復，毋須配合運動訓練"],"a":3,"e":"文獻指出腦部在中風後會不斷重塑（Neuroplasticity）；中風沒有所謂的黃金復康期，即使中風後一段長時間，透過正確而合適的訓練，仍會有進步空間；針灸只是其中一種方法，要配合運動訓練。","s":"5.8.1.5.1 中風 復康原則","p":151,"v":"中風後應盡早進行適當的治療"},{"i":"mahswx8","u":"u58","t":"n","q":"在運動治療上，缺血性和出血性的中風病人：","c":"基本上沒有分別，運動取決於病人的體能狀況","w":["缺血性病人不可進行運動","出血性病人須完全卧床三個月","兩者的運動必須完全相同並由醫生決定"],"a":3,"e":"運動治療上缺血性和出血性中風沒有分別；但醫生用藥及手術方面，中風的分類卻非常重要，因分類影響著用藥的方向。","s":"5.8.1.5.1 中風 復康原則","p":151,"v":"在運動治療上，缺血性和出血性的中風病人上基本上是沒有分別"},{"i":"mpz5pvc","u":"u58","t":"r","q":"下列哪項屬中風復康訓練項目？","c":"訓練使用助行器及日常生活器具","w":["靜脈注射溶栓劑","以手術接駁新血管","植入金屬支架"],"a":0,"e":"中風復康訓練項目：阻力訓練；伸展運動；訓練肢體控制；平衡、步行、耐力訓練；功能訓練（轉身、站立、轉移、走路、上落樓梯）；訓練使用助行器及日常生活器具；改善認知及溝通能力；起居生活及自我照顧技巧訓練；痛症處理；家居評估。溶栓劑、接駁新血管、金屬支架屬醫療治療。","s":"5.8.1.5.5 中風復康訓練項目","p":153,"v":"訓練使用助行器及日常生活器具"},{"i":"m5x9rz5","u":"u58","t":"g","q":"關於柏金遜症的藥物治療，下列何者正確？","c":"藥物能控制病徵，通常需長期服用，切勿自行中止","w":["藥物可根治原發性柏金遜症，服藥後可痊癒","病徵好轉後，便可自行減藥或停藥","只需在震顫發作時才服藥，其餘時間不用服"],"a":2,"e":"現階段未有任何根治原發性柏金遜症的有效方法，但藥物能幫助控制此病的病徵，減輕震顫的情況和對日常生活的影響；自行中止服用可能令病情反覆。","s":"5.8.1.6.2.1 柏金遜症 藥物治療","p":154,"v":"藥物能幫助控制此病的病徵"},{"i":"m1i776rv","u":"u58","t":"g","q":"柏金遜症患者的康復運動，目的包括：","c":"預防肌肉痙攣、增加身體及關節柔軟性、保持正確姿勢","w":["增加骨密度及肌肉體積，使病人可停止服藥","令病人完全依賴助行器，減少自行步行的機會","減少一切活動，以免跌倒及加速肌肉萎縮"],"a":1,"e":"物理治療：配合藥物進行肌肉、姿勢及關節的訓練可減少症狀、併發症及減低跌倒危機；適當使用助行器及正確運用轉移技巧，能增加活動能力，減少意外發生。","s":"5.8.1.6.2.2 柏金遜症 物理治療","p":154,"v":"預防肌肉痙攣"},{"i":"mh5txxf","u":"u58","t":"g","q":"柏金遜症患者的「語言治療」主要幫助改善：","c":"說話及吞嚥問題","w":["步行及平衡問題","穿衣困難","大小便失禁"],"a":0,"e":"語言治療：幫助改善說話及吞嚥問題。職業治療：手部活動及起居生活功能訓練、改善家居佈置（如用拉鍊或魔術貼代替鈕扣、長柄梳子、扶手、斜路代替樓梯）。","s":"5.8.1.6.2.4 柏金遜症 語言治療","p":154,"v":"幫助改善說話及吞嚥問題"},{"i":"m1x08047","u":"u58","t":"g","q":"慢性阻塞性肺病最常見的是：","c":"慢性支氣管炎及肺氣腫","w":["肺炎及肺結核","哮喘及肺癌","氣胸及胸膜炎"],"a":2,"e":"慢性阻塞性肺病（呼吸道疾病）最常見的是慢性支氣管炎及肺氣腫，患者一般都有長期吸煙或吸二手煙的經驗；預防首要是戒煙。","s":"5.8.1.7 慢性阻塞性肺病","p":156,"v":"最常見的是慢性支氣管炎及肺氣腫"},{"i":"mi8aeu2","u":"u58","t":"g","q":"慢性阻塞性肺病患者出現缺氧情況時，可見：","c":"嘴唇、手、腳呈藍色","w":["皮膚呈鮮紅色","手腳出現大量紅疹","嘴唇呈黃色"],"a":1,"e":"徵狀：咳嗽、痰多、氣促（運動時情況惡化）、呼吸困難（呼吸時有哮喘鳴音）、體力及活動能力下降、缺氧（嘴唇、手、腳呈藍色）。","s":"5.8.1.7.2 慢性阻塞性肺病 徵狀","p":156,"v":"出現缺氧情況，如嘴唇、手、腳呈藍色"},{"i":"m1izwup4","u":"u58","t":"g","q":"慢性阻塞性肺病的復康原則是：","c":"保持肺部衛生防止肺炎，並維持體能","w":["完全卧床休息，避免活動","盡量令痰液滯留以保護氣管","只依靠藥物，毋須運動"],"a":3,"e":"胸肺復康治療：教授控制氣喘的技巧、呼吸鍛鍊（深呼吸運動有助黏液易咳出）、清除痰涎（抽痰、拍痰、姿位排痰）、呼吸與身體動作的協調、體力鍛鍊、節省體力方法、氧氣治療。","s":"5.8.1.7.3 慢性阻塞性肺病 復康原則","p":156,"v":"保持肺部衛生防止肺炎"},{"i":"mtn4ijl","u":"u58","t":"g","q":"心肌梗塞的徵狀包括：","c":"胸前劇痛可擴散至頸、手臂、下顎，並有大量出汗、氣促","w":["小便頻密及尿量增多，容易口渴及疲倦","肢體水腫及沉重，穿衣或戴飾物感到繃緊","咳嗽、痰多、氣促及呼吸時有哮喘鳴音"],"a":1,"e":"「小便頻密及尿量增多，容易口…」是糖尿病的徵狀；「肢體水腫及沉重，穿衣或戴飾…」是淋巴水腫；「咳嗽、痰多、氣促及呼吸時有…」是慢性阻塞性肺病。冠心病成因：高膽固醇、高血壓、糖尿病、肥胖、吸煙、情緒緊張、酗酒。","s":"5.8.1.8.1.2 冠心病 徵狀（心肌栓塞）","p":159,"v":"胸前劇痛可能推展到頸、手臂、下顎"},{"i":"mfqq1ry","u":"u58","t":"g","q":"病人出現心絞痛時，助理應先：","c":"讓病人坐下，並協助服用脷底丸（如備有）","w":["鼓勵病人繼續運動，以促進血液循環","讓病人平躺，並讓其飲用大量清水","立即扶病人行走散步，以舒緩胸口痛楚"],"a":2,"e":"心絞痛發作時患者應立即終止一切活動，坐下或半坐臥休息，口含三硝酸甘油脂（脷底丸）於舌下，使心臟血管擴張而舒緩胸痛；冠心病患者必須隨身攜帶脷底丸及病歷咭。","s":"5.8.1.8.4 冠心病 運動時的注意事項及指引（c）","p":160,"v":"當出現心絞痛時，應先讓病人坐下，若病人備有脷底丸，應盡快協助他服用"},{"i":"m1yyciq7","u":"u58","t":"g","q":"病人含服三片脷底丸（每片相隔 5 分鐘）後，心絞痛仍未消退，則可能是：","c":"心肌梗塞，應盡快聯絡病房醫生","w":["只是肌肉疲勞，可繼續運動","胃痛，只需多喝水","焦慮，毋須處理"],"a":0,"e":"第一片含於舌下後觀察 5 分鐘；未舒緩再含第二片，5 分鐘後仍未好轉再含第三片，再於 5 分鐘後若仍未有消退迹象，則可能是心肌梗塞。","s":"5.8.1.8.4 冠心病 運動時的注意事項及指引（d）","p":160,"v":"如果心絞痛仍未舒緩減退，再把第二片脷底丸含於舌下"},{"i":"mb1iddy","u":"u58","t":"g","q":"下列哪項屬慢性糖尿病併發症？","c":"足部循環及神經病變，嚴重會導致截足","w":["骨質疏鬆引致的脊椎壓迫性骨折","尿酸沉積於關節形成的痛風石","重複用力引致的肘關節肌腱發炎"],"a":3,"e":"慢性併發症：失明、視網膜病變、白內障、青光眼；足部循環及神經系統病變、感染、潰瘍和壞疽（嚴重會導致截足）；中風；心臟病；腎臟感染、腎衰竭。","s":"5.8.1.9.5.2 慢性糖尿病併發症","p":162,"v":"足部循環及神經系統病變、感染、潰瘍和壞疽，嚴重會導致截足"},{"i":"m17fygsm","u":"u58","t":"n","q":"糖尿病患者出現血糖過低時，應：","c":"立刻進食易吸收的糖類食物，如 4 粒方糖，再吃餅乾","w":["立即注射更多胰島素，使血糖盡快回復","喝大量清水並靜坐休息，不必進食任何食物","繼續運動消耗血糖，直至症狀自行消失"],"a":0,"e":"血糖過低徵狀：心跳加速、手震、出汗、頭暈、嚴重飢餓感、軟弱無力、面色蒼白等。注意：病人昏迷時，不要餵病人進食任何食物或飲品，以免發生窒息，並應立即送往醫院救治。","s":"5.8.1.9.5.1 急性糖尿病併發症（b 血糖過低）","p":162,"v":"患者必須立刻服食一些容易吸收的糖類食物"},{"i":"mdqp675","u":"u58","t":"o","q":"腦麻痺症是由於什麼導致的運動功能障礙？","c":"未成熟的腦部受創傷或有缺損","w":["成年人的腦部退化","脊髓神經退化","肌肉本身缺乏某種蛋白質"],"a":2,"e":"腦麻痺可能合併視、聽、觸、動各種感覺，認知、語言、學習能力，智力和行為等方面的多重障礙；香港每 1000 個初生嬰兒中，約有 1 至 1.5 名患有腦麻痺。","s":"5.8.1.11 腦麻痺","p":165,"v":"腦麻痺症是由於未成熟的腦部受創傷或有缺損而導致的運動功能障礙"},{"i":"mdsqsk2","u":"u58","t":"o","q":"根據衞生署資料，香港每 1000 個初生嬰兒當中，約有多少名患有腦麻痺？","c":"1 至 1.5 名","w":["10 至 15 名","0.1 至 0.15 名","5 至 10 名"],"a":1,"e":"每 1000 個初生嬰兒當中，約有 1 至 1.5 名患有腦麻痺；現代因醫學進步，已甚少有腦麻痺的病童。","s":"5.8.1.11 腦麻痺","p":165,"v":"每1000個初生嬰兒當中，約有1至1.5名患有腦麻痺"},{"i":"m1uhy7sb","u":"u58","t":"g","q":"「受傷害的腦部傳出不正常訊息至肌肉，使肌肉呈現高張力、僵硬而緊縮」，屬於哪一種腦麻痺？","c":"痙攣型","w":["徐動型","共濟失調型","低張型"],"a":3,"e":"腦麻痺種類：痙攣型（高張力、僵硬、緊縮，常有畸形或痙攣）；徐動型（肌肉張力不斷改變，不自主顫動或扭動）；共濟失調型（動作搖晃、不穩定）；低張型（頭頸無力、動作緩慢無力、不協調）；混合型。","s":"5.8.1.11.1 腦麻痺 種類（a 痙攣型）","p":165,"v":"病人主要是由於受到傷害的腦部傳出不正常的訊息至肌肉，使肌肉呈現高張力"},{"i":"m1vzhi3","u":"u58","t":"n","q":"「動作搖晃、不穩定」是哪一種腦麻痺的特點？","c":"共濟失調型","w":["痙攣型","徐動型","低張型"],"a":0,"e":"共濟失調的意思是動作搖晃、不穩定；低張型則表現為頭、頸無力，動作緩慢無力、不協調。","s":"5.8.1.11.1 腦麻痺 種類（c 共濟失調型）","p":166,"v":"共濟失調的意思是動作搖晃、不穩定"},{"i":"m1fjejho","u":"u58","t":"r","q":"下列何者是腦麻痺在「出生後」的成因？","c":"腦部感染（如腦炎、腦膜炎）或創傷","w":["孕婦懷孕早期受德國麻疹感染","早產、難產造成腦部傷害","缺氧使腦部得不到充分的氧氣供應"],"a":1,"e":"腦麻痺成因：出生前（孕婦懷孕早期感染如德國麻疹、帶狀皰疹，或服食某些藥物、嚴重營養不良）；生產過程中（早產、難產、缺氧）；出生後（腦炎、腦膜炎或創傷）。","s":"5.8.1.11.2 腦麻痺 成因","p":166,"v":"因腦部感染如腦炎、腦膜炎或創傷","k":"工作紙八 第 2 題"},{"i":"mnf96d5","u":"u58","t":"g","q":"任何能放鬆肌肉的治療都對肌肉痙攣有幫助，而最行之有效的是：","c":"伸展運動","w":["阻力訓練","耐力訓練","平衡訓練"],"a":3,"e":"腦麻痺治療方法：根據兒童的遲緩情況及喜好習性設計不同遊戲作為治療（涉及力量、柔軟度、平衡力及協調訓練）；兒科物理治療以遊戲治療為首選，可提高兒童對治療的參與性。","s":"5.8.1.11.4 腦麻痺 治療方法","p":167,"v":"最行之有效的是伸展運動"},{"i":"m19hu68e","u":"u58","t":"r","q":"為兒童進行運動時，職員要特別注意：","c":"職業安全，如避免因遷就兒童身高而長時間彎腰","w":["讓兒童自行決定運動時間，不作任何指導","只注意兒童的情緒，毋須留意自己的姿勢","兒童體重輕，可隨意以背部發力抱起兒童"],"a":2,"e":"另外，由於兒童不善於表達自己，職員要有更強的觀察力，期望能找出兒童正面對的問題。","s":"5.8.1.11.5 腦麻痺 運動時的注意事項及指引","p":167,"v":"要特別注意職業安全，職員經常因遷就兒童的身高而長時間彎腰"},{"i":"mh8i01x","u":"u58","t":"n","q":"「手眼協調、工具運用及抄寫能力」屬於兒童發展遲緩的哪個範疇？","c":"小肌肉","w":["大肌肉","語言","智能或認知"],"a":0,"e":"發展遲緩範疇：智能或認知（學習、思考、解決問題）；語言（理解、表達、發音）；大肌肉（坐、站立、步行、跑、跳）；小肌肉（手眼協調、工具運用、抄寫）；社交及適應力（溝通、社交、自理及日常生活所需基本技巧）。","s":"5.8.1.10.2 兒童整體發展遲緩 徵狀","p":165,"v":"小肌肉：手眼協調、工具運用及抄寫能力等","k":"工作紙八 第 1 題"},{"i":"mmsd5bz","u":"u58","t":"r","q":"指皮下組織受到鈍力撞擊所造成的創傷，但沒有任何開創性傷口，稱為：","c":"挫傷（Contusion）","w":["扭傷（Sprain）","拉傷（Strain）","骨折（Fracture）"],"a":1,"e":"急性運動創傷包括骨折、挫傷、韌帶拉傷／扭傷、肌肉拉傷／扯傷。挫傷患部常見微血管破裂出血，因而表面血腫（俗稱瘀青）。","s":"5.8.1.13.1.1 急性運動創傷（b 挫傷）","p":169,"v":"指皮下組織受到鈍力撞擊所造成的創傷稱為挫傷"},{"i":"mei0lzu","u":"u58","t":"r","q":"韌帶因關節過度伸展，無法承受猛烈的力量而撕裂甚至發炎腫脹，稱為：","c":"扭傷（Sprain）","w":["拉傷（Strain）","挫傷（Contusion）","脫臼（Dislocation）"],"a":3,"e":"韌帶的功能是將骨頭與關節固定於適當位置，並分散吸收外力的拉扯；扭傷程度一般分為三級：輕度、中度、嚴重。肌肉拉傷（Strain）才是肌纖維受拉扯受傷。","s":"5.8.1.13.1.1 急性運動創傷（c 韌帶拉傷／扭傷）","p":169,"v":"當關節過度伸展下，韌帶無法承受猛烈的力量因而撕裂甚至造成發炎腫脹的情況即稱為扭傷"},{"i":"min22si","u":"u58","t":"r","q":"肌肉拉傷（Strain）較常見於哪些肌群？","c":"下背肌群及股四頭肌","w":["肱二頭肌及三角肌","小腿前方肌肉及足底","手指屈肌及前臂伸肌"],"a":2,"e":"肌肉拉傷成因：柔軟度不足（未充分熱身伸展）、不正常的收縮、協調性不良；程度分輕度、中度、嚴重三級。","s":"5.8.1.13.1.1 急性運動創傷（d 肌肉拉傷／扯傷）","p":170,"v":"較常見的是下背肌群及股四頭肌肌肉拉傷"},{"i":"m9bopwr","u":"u58","t":"n","q":"慢性肌腱炎（如網球肘、跑者膝）的症狀往往是：","c":"一開始運動就不適，運動愈多愈痛，休息會緩解","w":["只在休息時疼痛，運動時完全沒有痛楚","突然出現劇痛，並即時喪失全部活動能力","只在夜間出現疼痛，與運動完全沒有關係"],"a":1,"e":"慢性肌腱炎是肌肉或肌腱在反覆過度使用下，造成肌腱連續性的微小傷害，使肌腱持續保持在慢性發炎的狀態。壓力性（疲勞性）骨折則是骨骼在長期反覆操作下無法承受猛烈壓力。","s":"5.8.1.13.1.2 慢性運動創傷（a 慢性肌腱炎）","p":170,"v":"症狀往往是一開始運動時就感到不適，且隨著運動的增加而越來越痛，休息會緩解"},{"i":"mr6xr7o","u":"u58","t":"n","q":"留置導尿管時，尿袋的高度（尿喉下端）應：","c":"低於膀胱位置（但不可放在地上），以防尿液逆流","w":["高於膀胱位置，以便觀察尿液的顏色","與膀胱位置相同，使尿液不會過快排出","放在地上，以免拉扯尿管及造成出血"],"a":2,"e":"留置導尿管的注意事項：接頭保持密閉，尿袋出口處隨時關閉；尿管不可扭曲或受壓、不可拉扯；觀察尿液顏色及形態；鼓勵多飲水及攝取富含維他命 C 的新鮮果汁；檢查有沒有結痂或不正常引流物。","s":"5.8.2.4.2 導尿管（留置導尿管的注意事項）","p":176,"v":"尿袋高度(尿喉下端)要低於膀胱位置（但不可置放於或接觸到地上），以防尿液逆流"},{"i":"m1f2d2jm","u":"u58","t":"n","q":"經鼻胃喉餵飼病人時，必須讓病人：","c":"坐直或最少坐起 45 度","w":["平卧","向左側卧","俯卧"],"a":3,"e":"鼻胃喉基本原則：使用必須得到註冊醫生批准；必須由註冊或登記護士插入及定期更換；須遵從註冊醫生／營養師意見；定期檢討使用情況；餵飼時病人須坐直或最少坐起 45 度。治療助理仍需時刻檢查刻度位置、有否移位、膠貼有否固定，發現異常立即通知護士或物理治療師。","s":"5.8.2.4.1 鼻胃喉","p":176,"v":"餵飼時必須讓病人坐直或最少坐起45度"},{"i":"m8qdwri","u":"u59","t":"g","q":"肌肉萎縮是指：","c":"骨骼肌在質量以及力量上的減少","w":["骨骼肌長期處於痙攣狀態而縮短","骨骼肌張力異常上升","關節周圍組織纖維化而令關節僵硬"],"a":0,"e":"肌肉萎縮成因：由缺乏運動而引起；或因各種腦神經疾病而引起（腦神經疾病引起的肌肉萎縮暫時沒有根治的方法）。","s":"5.9.1.2 肌肉萎縮","p":179,"v":"指骨骼肌在質量以及力量上的減少"},{"i":"m1to0byh","u":"u59","t":"g","q":"因缺乏運動而引起的肌肉萎縮，處理方法是：","c":"進行阻力訓練","w":["經常進行伸展訓練","以電類治療減低肌肉緊張","完全卧床休息"],"a":0,"e":"肌肉萎縮：進行阻力訓練；肌張力上升：經常進行伸展訓練；肌肉攣縮：經常進行伸展訓練及電類治療；關節僵硬：經常進行關節活動訓練及伸展運動。","s":"5.9.1.2.3 肌肉萎縮 處理方法","p":180,"v":"進行阻力訓練"},{"i":"m1cjhcsl","u":"u59","t":"g","q":"肌張力上升的主要成因是：","c":"腦部或脊髓神經內的上運動神經元受損","w":["下運動神經元受損","缺乏運動導致肌肉流失","關節囊攣縮"],"a":3,"e":"主要成因是腦部或脊髓神經內的上運動神經元受損（upper motor neuron lesion），而失去了腦部中央控制的肌肉失調現象，伴隨有過強腱反射。","s":"5.9.1.3.1 肌張力上升 成因","p":180,"v":"主要成因是腦部或脊髓神經內的上運動神經元受損"},{"i":"m1xxn5h4","u":"u59","t":"g","q":"肌張力上升的處理方法是：","c":"經常進行伸展訓練","w":["進行阻力訓練","以按摩及熱敷代替運動","完全休息，避免活動"],"a":1,"e":"肌張力上升暫時沒有根治的方法，處理方法是經常進行伸展訓練；缺乏運動引起的肌肉萎縮才是進行阻力訓練。","s":"5.9.1.3.2 肌張力上升 處理方法","p":180,"v":"經常進行伸展訓練"},{"i":"m1vptgft","u":"u59","t":"n","q":"肌肉攣縮（肌肉或關節長期處於痙攣狀態，致肌腱或關節軟組織永久縮短）的處理方法包括：","c":"經常進行伸展訓練，並以電類治療減低肌肉緊張","w":["進行阻力訓練，以增加肌肉的體積及力量","長期固定關節於同一位置，以免再次攣縮","避免任何活動，並以熱敷代替所有運動"],"a":2,"e":"攣縮以老年人多見，且常發生於肢體及其附近關節；可併發肌萎縮、關節變形、關節周圍韌帶纖維化、軟組織結構破壞、關節間隙出現骨橋活動受限。","s":"5.9.1.4.2 肌肉攣縮 處理方法","p":180,"v":"透過電類治療減低肌肉緊張"},{"i":"myjfzis","u":"u59","t":"n","q":"關節僵硬的處理方法是：","c":"經常進行關節活動訓練及伸展運動","w":["長期固定關節","只靠止痛藥","避免任何活動"],"a":0,"e":"關節僵硬成因：嚴重／急性發炎、長期慢性發炎、長期缺乏運動（長期臥床、骨折固定）、退化現象；處理方法：經常進行關節活動訓練及伸展運動。","s":"5.9.1.5.2 關節僵硬 處理方法","p":181,"v":"經常進行關節活動訓練及伸展運動"},{"i":"m1lw7y4g","u":"u59","t":"g","q":"壓瘡多數出現在身體的：","c":"骨突處","w":["肌肉豐厚處","關節屈側皺褶處","皮膚較薄的腹部"],"a":2,"e":"壓瘡是由於身體遭受一些不獲緩解的壓力擠壓，導致內部組織受創，形成損傷；病情劃分為多個級別或階段，以區分受損的程度。","s":"5.9.1.6.1 甚麼是壓瘡","p":181,"v":"壓瘡多數出現在骨突處"},{"i":"mhz721d","u":"u59","t":"n","q":"當壓力超出微絲血管的負荷（液壓單位達到多少毫米汞柱），血液便無法通過，令細胞組織得不到養份、血液和氧氣？","c":"32","w":["12","52","120"],"a":3,"e":"直接壓力若過度壓迫持續一段時間，血管便會壓毀，周圍的細胞會死亡，形成壓瘡；傷患一般更會遭受剪切力和摩擦力的影響，令病情變得複雜。","s":"5.9.1.6.2 壓瘡的成因（a 直接壓力）","p":181,"v":"液壓單位達到32毫米汞柱"},{"i":"m1mhmpv0","u":"u59","t":"g","q":"仰臥或側臥時，下列哪個部位屬常見的壓瘡位置？","c":"骶骨、髖粗隆","w":["小腿肚","前臂內側","腹部"],"a":1,"e":"臥姿常見壓瘡位置：頭（後枕、耳朵）；肩膀、肩胛骨；手肘；骶骨、髖粗隆；膝蓋內及外側、腳踝內及外側、腳跟。","s":"5.9.1.6.3 常見壓瘡位置－臥","p":182,"v":"骶骨、髖粗隆"},{"i":"m1omn85d","u":"u59","t":"g","q":"坐姿時，下列哪個部位屬常見的壓瘡位置？","c":"坐骨","w":["小腿肚","大腿前方肌肉","上臂外側"],"a":1,"e":"坐姿常見壓瘡位置：後枕；肩胛骨；手肘；骶骨、坐骨；腳跟、腳前掌。","s":"5.9.1.6.4 常見壓瘡位置－坐","p":183,"v":"骶骨、坐骨"},{"i":"mo6z29w","u":"u59","t":"g","q":"壓瘡「第一階段」的特徵是：","c":"受壓部位皮膚表面完好，但出現不變淡的紅斑","w":["整個皮層受損，皮下組織壞死，傷口幾達筋膜","部分皮層受損，有淺表性潰瘍及水泡","肌肉、筋腱、關節和骨骼等支撐結構受牽連，傷口有管和竇道"],"a":2,"e":"第一階段：皮膚表面完好，但出現不變淡的紅斑（受傷潰瘍的先兆）；第二階段：部分皮層受損（表皮和真皮）；第三階段：整個皮層受損，傷口幾達筋膜；第四階段：廣泛受累，傷口有管和竇道。","s":"5.9.1.6.5 壓瘡的階段","p":183,"v":"受壓的部位，皮膚表面完好，但出現不變淡的紅斑，此乃受傷潰瘍的先兆"},{"i":"mm8djhx","u":"u59","t":"n","q":"壓瘡「第四階段」的特徵是：","c":"整個皮層廣泛受損，肌肉、筋腱、關節及骨骼受牽連，有管和竇道","w":["皮膚表面完好，但出現不變淡的紅斑，皮膚發熱和變硬","部分皮層受損，有淺表性潰瘍，外形似擦傷，有水和淺坑","整個皮層受損，皮下組織壞死，傷口幾達筋膜，形成深坑"],"a":3,"e":"閉合性壓瘡：受傷部位表面似無大礙，但皮下隱藏致命性損傷；脊椎神經受損、用輪椅代步的人士，常會在髖部長出閉合性壓瘡。","s":"5.9.1.6.5 壓瘡的階段","p":183,"v":"傷口有管和竇道"},{"i":"m15w9dsz","u":"u59","t":"r","q":"長期卧床者，最少每多少小時翻身一次，不要讓身體同一個部位長時間受壓？","c":"兩小時","w":["半小時","四小時","六小時"],"a":0,"e":"長期卧床者最少每兩小時翻身一次；須檢視用大拇指輕按壓是否發白，若無發白，則須縮短翻身時間。無法自行移動的長者須最少每兩小時轉換體位一次。","s":"5.9.1.6.8 處理方法（a 避免長時間壓迫皮膚）","p":184,"v":"長期臥床者：最少每兩小時翻身一次"},{"i":"m1wuks8j","u":"u59","t":"r","q":"長期使用輪椅者，需每多久改變姿勢（例如以雙手撐起上半身使臀部懸空）以減低壓力？","c":"半小時","w":["十分鐘","兩小時","四小時"],"a":1,"e":"長期使用輪椅者需每半小時改變姿勢，可以雙手撐起上半身，使臀部懸空減低壓力。","s":"5.9.1.6.8 處理方法（a 避免長時間壓迫皮膚）","p":184,"v":"需每半小時改變姿勢"},{"i":"m1plvtpr","u":"u59","t":"r","q":"預防壓瘡時，下列何者「應避免」使用？","c":"圈墊","w":["枕頭","氣墊床","護腳跟套"],"a":0,"e":"可在病患兩腿間置一枕頭預防兩膝或兩足踝相互碰撞與摩擦，必要時使用氣墊床；所有圈墊的使用均應避免。","s":"5.9.1.6.8 處理方法（a 避免長時間壓迫皮膚）","p":184,"v":"所有圈墊的使用均應避免"},{"i":"m6ltieu","u":"u59","t":"r","q":"清潔皮膚後，應如何拭乾身體的水分（特別是皮膚皺摺處）？","c":"以乾毛巾點狀式拭乾","w":["用力來回擦乾","不拭乾，讓其自然風乾","用熱風吹乾"],"a":2,"e":"皮膚清潔：每天洗澡（此時為檢查皮膚的最好時機）；檢查皮膚狀況，尤其是骨頭突出的地方，如發紅、變色或破皮就要避免壓迫；清潔後以乾毛巾點狀式拭乾；沐浴後使用乳液或乳霜滋潤皮膚。","s":"5.9.1.6.8 處理方法（b 重視皮膚清潔並定期檢視皮膚狀況）","p":184,"v":"清潔後以乾毛巾點狀式拭乾身體的水分"},{"i":"m18hao0o","u":"u59","t":"r","q":"檢查皮膚狀況的最好時機是：","c":"每天洗澡時","w":["每週覆診時","睡覺前關燈後","病人感到痛楚時"],"a":3,"e":"每天洗澡，此時為檢查皮膚的最好時機；尤其要檢查骨頭突出的地方。","s":"5.9.1.6.8 處理方法（b 重視皮膚清潔並定期檢視皮膚狀況）","p":184,"v":"每天洗澡，此時為檢查皮膚的最好時機"},{"i":"m10lo9ir","u":"u59","t":"r","q":"對採半坐臥式的病人，床頭搖高應低於多少度（或配合搖高床尾），以減少尾骶骨處的剪力？","c":"30 度","w":["10 度","60 度","90 度"],"a":1,"e":"預防摩擦力、剪力：搬運病患或協助更換姿勢時，可利用滑毯、翻身中單，避免以拖、拉的方式移動病患身體；半坐臥式病患床頭搖高應低於 30 度，或配合搖高床尾。","s":"5.9.1.6.8 處理方法（c 預防摩擦力、剪力）","p":184,"v":"對採半坐臥式的病患床頭搖高應低於30度"},{"i":"m1rlbvjn","u":"u59","t":"r","q":"為增加皮膚適度循環，下列做法何者正確？","c":"鼓勵主動或協助被動關節活動，並避免按摩骨突處及發紅部位","w":["用力按摩骨突處及發紅部位，以促進血液循環","長時間保持同一姿勢，以免擦損皮膚表面","在發紅處塗上大量爽身粉，以保持皮膚乾爽"],"a":3,"e":"避免按摩骨突處或皮膚發紅部位，以免組織代謝及耗氧量增加，令皮膚缺血壞死的情形更加嚴重。","s":"5.9.1.6.8 處理方法（d 增加皮膚適度循環）","p":184,"v":"避免按摩骨突處或皮膚發紅部位"},{"i":"m1ayiqnj","u":"u59","t":"r","q":"失禁者每次排泄後，應使用什麼輕柔地清潔皮膚？","c":"清水或微酸性清潔劑","w":["強鹼性肥皂並用力擦洗","爽身粉乾擦","酒精棉球"],"a":0,"e":"失禁性皮膚炎預防照護：先諮詢醫療專業人員找出原因，選用不回滲的尿片；皮膚清潔（排泄後輕柔清潔，避免用力磨擦；亦可用乾洗潔膚液）；皮膚滋潤（凡士林或乳液、長效保濕霜）。","s":"5.9.1.6.8 處理方法（e 失禁性皮膚炎預防照護）","p":185,"v":"每一次排泄後，使用清水或微酸性清潔劑輕柔的清潔皮膚"},{"i":"ma63f3o","u":"u59","t":"r","q":"下列哪項是充氣坐墊的優點？","c":"可調節壓力分佈，透氣度及散熱度較好，易清理","w":["較輕、較耐用，但較難清理","價錢平宜，毋須經常保養","轉移時最穩定，亦不會被刺穿"],"a":2,"e":"乳膠坐墊：優點較輕、較耐用；缺點較難清理、不耐用、透氣及散熱較差、壓力分佈不均。充氣坐墊：優點如上；缺點價錢較貴、容易被刺穿、需經常保養及調節、對轉移較不穩定。","s":"5.9.2.1.1 坐墊（b 坐墊的種類）","p":186,"v":"充氣坐墊：優點——透氣度（濕度）較好、散熱度較好、可調節壓力分佈、易清理；缺點——價錢較貴、容易被刺穿、需經常保養及調節、對轉移較不穩定"},{"i":"mfh2ss9","u":"u59","t":"r","q":"充氣水泡坐墊（課本註明已棄用，但市面上仍可見有出售）的缺點是：","c":"沒有分散壓力，只是轉移壓力位置","w":["價錢昂貴","透氣度及散熱度較差","對轉移較不穩定"],"a":2,"e":"充氣水泡優點：價錢平；缺點：沒有分散壓力（只是轉移壓力位置）。啫喱坐墊：優點散熱度較好、較容易清理；缺點會刺穿、重、透氣度較差、對轉移較不穩定。","s":"5.9.2.1.1 坐墊（b 坐墊的種類）","p":186,"v":"沒有分散壓力"},{"i":"m1w0i8ad","u":"u59","t":"r","q":"使用氣墊床時，若發現病人身體會直接壓迫到床板（墊），應：","c":"調高充氣量","w":["調低充氣量","關掉電源","加鋪圈墊"],"a":0,"e":"氣墊床：減壓效果良好，使用電源可長期開動；應預先充氣；每天檢查充氣量；充氣條過硬時調低充氣量；充氣管應置於床尾，並依病人體重調整充氣條；無法充氣或塌陷需聯絡維修；留意床欄高度是否仍然合適。","s":"5.9.2.1.2 氣墊床（b 使用要點）","p":187,"v":"若身體會直接壓迫到床板（墊）時，應調高充氣量"},{"i":"mpdlqq4","u":"u59","t":"r","q":"氣墊床的充氣管應置於：","c":"床尾","w":["床頭","病人身下","床欄上"],"a":1,"e":"充氣管應置於床尾，並依病人體重調整充氣條。","s":"5.9.2.1.2 氣墊床（b 使用要點）","p":187,"v":"充氣管應置於床尾"},{"i":"mbtz0vh","u":"u59","t":"n","q":"深層靜脈血栓較常發生於：","c":"下肢靜脈","w":["上肢靜脈","腦血管","冠狀動脈"],"a":3,"e":"深層靜脈血栓主要徵狀是患肢腫脹、疼痛；偶因血栓脫落而造成肺栓塞。成因：靜脈血流緩滯（大手術後、長期臥床、心力衰竭、腹腔壓力增高）或血液凝血機會增高。","s":"5.9.1.1 深層靜脈血栓（Deep Vein Thrombosis）","p":177,"v":"較常發生於下肢靜脈"},{"i":"m6dmhby","u":"u59","t":"n","q":"預防深層靜脈血栓，下列做法何者正確？","c":"避免長時間同一姿勢，不要交叉腳坐，避免穿緊身腰帶","w":["長時間坐下，以節省體力及減少活動","交叉腳坐，以增加雙腿的血液回流","穿著緊身腰帶及襪帶，以固定腿部姿勢"],"a":0,"e":"其他處理方法：鼓勵在床上多作下肢運動並作深呼吸及咳嗽動作；坐下時雙腿抬高及每隔半小時步行數分鐘；長途旅行告知醫生；保持大便通暢；遵照指示起床前穿上彈性襪（睡覺前除下）；適當運動，保持適當體重。","s":"5.9.1.1.4 深層靜脈血栓 處理方法","p":177,"v":"不要交叉腳坐"},{"i":"m1g9s3u6","u":"u59","t":"n","q":"服用薄血藥的目的是：","c":"防止血塊在血管中形成，劑量須依醫生處方","w":["加速血塊溶解，並刻意增加身體出血量","刺激血液凝固，以減少受傷時的出血","降低血糖水平，劑量可自行按需要調整"],"a":3,"e":"薄血藥過量會導致出血的危險，不足亦會引致血塊形成；醫生會定時替病人抽血檢驗，調節劑量。若有血便、皮膚紫斑、牙齦出血及流鼻血、割傷後流血不止、瘀斑面積不斷擴大，應即與病房護士聯絡或到急症室。","s":"5.9.1.1.3 深層靜脈血栓 藥物治療","p":177,"v":"服用薄血藥的目的是防止血塊在血管中形成"},{"i":"mpbt7a8","u":"u59","t":"n","q":"為病人穿著壓力襪時，下列何者正確？","c":"尺碼由治療師量度，助理負責穿著並確保沒有皺摺","w":["助理自行量度尺碼，並到店舖購買壓力襪","穿著時把襪子覆回，以增加對小腿的壓力","壓力襪破損或變鬆後，仍可繼續使用一段時間"],"a":2,"e":"壓力襪：量度尺碼由治療師負責；穿著時確保沒有皺摺；不可覆回；若發現壓力襪有破損或長期使用後變鬆，應通知治療師。","s":"5.9.1.1.5 壓力襪／管","p":179,"v":"量度尺碼由治療師負責，而助理則負責穿著或協助定時檢查"},{"i":"mjih45m","u":"u59","t":"n","q":"預防壓瘡時，下列哪項「不可」做？","c":"使用爽身粉","w":["每天洗澡時以中性肥皂清潔並檢查全身皮膚","保持床鋪、衣物清潔整齊","盡早下床，減少卧床時間"],"a":1,"e":"切勿使用爽身粉，以免爽身粉與汗液混後成為糊狀，堵塞毛孔。其他注意事項：定期檢查皮膚；評估壓瘡風險；鼓勵適量運動；至少每兩小時轉換體位；使用軟枕、氣墊床等；注意扶抱方法減低剪切力及摩擦力；照顧者保持短指甲；均衡營養。","s":"5.9.2.1.4 預防壓瘡的注意事項","p":188,"v":"切勿使用爽身粉，以免爽身粉與汗液混後成為糊狀，堵塞毛孔"},{"i":"m1x332fk","u":"u59","t":"n","q":"按課本，使用約束物品：","c":"不應是第一選擇，只在例外情況下作最後處理方法","w":["是預防跌倒的首選方法，應盡早使用","可視為一種慣性做法，每位長者都適用","毋須病人親屬同意，亦毋須醫生的意見書"],"a":0,"e":"約束物品功能：防止病人弄開傷口縫合處、防止傷害自己或跌倒、防止自行拆去必須的醫療器材；使用時須取得病人及親屬的同意書及醫生意見書，每年檢討；期間每隔兩小時檢查並紀錄。","s":"5.9.3.3 約束物品 注意事項","p":189,"v":"使用約束物品不應是第一選擇，而是最後的處理方法"},{"i":"m16lmguk","u":"u59","t":"n","q":"使用約束物品期間，院方須每隔多久檢查病人受制於約束物品的情況，並加以紀錄？","c":"兩小時","w":["半小時","四小時","八小時"],"a":3,"e":"約束物品使用期間，院方必須對有關的病人保持密切留意，並每隔兩小時檢查及紀錄，以便下一更同事跟進。","s":"5.9.3.3 約束物品 注意事項","p":189,"v":"每隔兩小時檢查病人受制於約束物品的情況"},{"i":"m1nffgbv","u":"u59","t":"n","q":"約束物品的鬆緊及打結原則，下列何者正確？","c":"穩固而舒適，病人不能自行解除，職員容易鬆開","w":["愈緊愈好，完全限制病人所有活動","病人可輕易自行解除，以免感到不適","打死結以防鬆脫，緊急時才剪開繩結"],"a":2,"e":"約束物品應穩固而舒適，應有有限度的活動，同時確保能達到限制的目的；「平結」是穩固而又易解開的繩結技巧；固定位置必須是不可活動及穩固的支架上。","s":"5.9.3.5 約束物品鬆緊及打結原則","p":190,"v":"職員容易鬆開，以應付緊急情況(如急救)"},{"i":"m1agphz3","u":"u59","t":"n","q":"長期臥床引致心肺功能減弱，可導致：","c":"墜積性肺炎，處理方法包括心肺功能訓練及呼吸訓練","w":["壓瘡，處理方法是每兩小時翻身","深層靜脈血栓，處理方法是穿著緊身腰帶","便秘，處理方法是減少活動"],"a":1,"e":"肺炎：由於臥床姿勢減少換氣，病房亦有大量病菌，導致墜積性肺炎；穿衣及清潔困難：處理方法為關節活動訓練、伸展運動、阻力訓練；便秘：腸蠕動減少，處理方法為增加涉及腹部活動的運動。","s":"5.9.1.7 心肺功能減弱","p":185,"v":"導致墜積性肺炎的發生"}];
var BANK_SQ=[{"i":"smftn1b","u":"u1","t":"r","q":"試列出物理治療助理的日常工作。","y":["協助提供復康運動訓練、帶領治療小組","協助清潔、管理復康器材及治療儀器","協助物理治療師進行儀器治療","協助基本護理及照顧工作"],"s":"1.2.3.2 日常工作","p":6,"p2":7,"h":"課本共 4 項。可配合 1.2.2「物理治療助理之職責」補充：治療工作、復康運動、器材清潔、護理工作、行政支援。"},{"i":"s2dbp3f","u":"u1","t":"r","q":"試列出物理治療助理的就業前路（可工作的地方）。","y":["公營醫院","私營醫院","資助護理安老院","私營安老院","長者日間護理中心","嚴重殘疾人士護理院","復康中心","早期教育及訓練中心","特殊學校","私營物理治療診所"],"s":"1.2.3.3 就業前路","p":7,"p2":7,"h":"共 10 項。記憶法：醫院（公、私）→ 安老院（資助、私營）→ 日間護理／殘疾人士護理院 → 復康中心 → 兒童（早期教育、特殊學校）→ 私營診所。"},{"i":"s6xufb9","u":"u1","t":"n","q":"試述物理治療助理在復康治療上的三個主要角色。","y":["醫護人員：了解個人職責，有效地安排時間執行指示工作","病人的照顧者：懂得處理病人的不適及意見；時刻監察病人狀況並有危機意識；了解病人的難處，向治療師作出反映","物理治療師的協助者：儀器治療時擔任助手；準備病人、扶抱、接待、運送病人及準備病歷；在指示下單獨執行可允許的治療、運動治療、教育工作、情緒支援及自我照顧技巧；向治療師匯報病人情況"],"s":"1.2.1.1 復康治療上的角色","p":5,"p2":5,"h":"另有「其他的角色」：病人的朋友（傾訴對象、支持者）、病人與其親屬間的橋樑。"},{"i":"stxtq6i","u":"u1","t":"o","q":"試列出公營醫院二級病人服務助理（物理治療部）的入職要求。","y":["中五程度","能操流利粵語、能閱讀及書寫中英文","懂電腦操作，包括中、英文輸入法","工作主動、有良好溝通技巧","能應付體力勞動工作","具物理治療或護理之工作經驗","優先考慮：持有物理治療助理證書；持有健康服務助理(HCA)或醫護支援人員(臨床病人服務)(CRSW)證書"],"s":"1.1.4 各服務單位之入職要求","p":4,"p2":4,"h":"三級病人服務助理（PCA III）要求較低：小六程度、具相關工作經驗、流利粵語、書寫中文、能閱讀及明白簡單英文。"},{"i":"s1rmifms","u":"u1","t":"o","q":"試列出各服務單位助理職位的起薪點：物理治療診所、復康機構／安老院舍／特殊學校、公營醫院、私營醫院。","y":["物理治療診所（物理治療助理、診所助理）：$10K-13K，視乎經驗及工作時間而定","復康機構／安老院舍／特殊學校（復康助理、治療助理、護理員）：非外展 $11-13K；外展 $13-15K","公營醫院：二級病人服務助理 $18-25K；三級病人服務助理 $15-16K","私營醫院（物理治療助理）：$15-19K，視乎經驗而定"],"s":"1.1.4 各服務單位之入職要求","p":4,"p2":4,"h":"表格的「服務單位」欄在筆記中以橙色標示（MC、SQ 都可能考）。可同時記住各單位的學歷要求：診所／公營 PCA II／私營醫院＝中五；復康機構＝中三或以上；PCA III＝小六。"},{"i":"s11v49y5","u":"u1","t":"n","q":"試比較醫院、非政府機構（NGO）及私營診所內，物理治療助理工作的體能需求及工作時間特點。","y":["醫院：較大體能上的需求；少量文書工作；無需夜班工作，工作時間較穩定","非政府機構（NGO）：中等程度上的體能需求；文書工作；無需夜班工作，工作時間按服務需要而定","私營診所：較少體能上的需求；文書工作；工作時間較長，或需輪班"],"s":"1.1.3 物理治療常涉及之醫療範疇","p":2,"p2":3,"h":"同時可補充服務形式：醫院＝協助各類疾病病人運動訓練、接送病人、維修治療部儀器；NGO＝特定類別病人、帶領運動小組；私營診所＝準備治療、接待（預約、收銀）。"},{"i":"s1kfsqh1","u":"u1","t":"n","q":"試列出物理治療助理作為物理治療師的協助者時，須遵守的工作守則。","y":["尊重治療師的治療安排，與治療師保持良好溝通","不應替病人檢察、作出診斷及提供建議或詮釋治療師的檢察結果","不應替病人安排或建議任何運動及治療，以及不得在沒有治療師同意下執行治療","須對個人作出的護理判斷和行動負責和作出交代"],"s":"1.3.2 工作守則（b 作為物理治療師的協助者）","p":8,"p2":8,"h":"同一節另有 a) 作為病人的照顧者（關懷病人、尊重私隱、不疏忽職守）及 c) 作為機構的職員。"},{"i":"snuu0a3","u":"u1","t":"n","q":"試述構成「疏忽」的三個基本因素。","y":["照顧責任：被告人負有法律所承認的謹慎責任，即不應不合理地陷別人於風險之中","失責：被告人未盡謹慎責任，行為的謹慎程度低於一般被接受的合理謹慎標準","造成損失：失責與原告人所受損害存在因果關係；損害的發生並非由於原告人自己的疏忽"],"s":"1.3.3.1 疏忽","p":9,"p2":9,"h":"三個因素缺一不可：責任 → 失責 → 損失（因果關係）。"},{"i":"s1kg0j65","u":"u2","t":"r","q":"試列出肌肉的功能。","y":["產生活動：透過肌肉收縮，就可以產生各種各樣的動作","維持身體姿勢：在任何時刻，肌肉都保持著一定的張力，以維持身體的姿勢","儲能和產熱：肌肉內的能源儲備（如肌醣元、磷酸肌酸、三磷酸腺苷等）分解時釋放能量作肌肉活動之用，同時產生熱能，維持正常體溫"],"s":"2.4.3.2 肌肉的功能","p":42,"p2":42,"h":"共 3 項：活動、姿勢、儲能產熱。這一節在筆記中以紅色標示（SQ 範圍）。"},{"i":"sehhfb1","u":"u2","t":"o","q":"試述「球窩關節」的特點，並舉出例子。","y":["關節頭呈球狀，另一骨的關節面呈窩狀，包裹著關節頭的一部分（球面的三分之一至二分之一左右）","關節頭與關節窩只是鬆弛地連接，能作屈、伸、內收、外展、環轉和旋轉運動","是活動性最大的一種關節結構","例子：髖關節、肩關節"],"s":"2.4.2.2 滑膜關節的分類（f 球窩關節）","p":36,"p2":36,"h":"「球窩關節」四個字以紅色標示、例子（髖關節、肩關節）以橙色標示。"},{"i":"sq9stnq","u":"u2","t":"n","q":"試舉出六種滑膜關節（活動關節）及其例子。","y":["滑動關節：手掌掌骨間關節、肩鎖關節","鉸鏈關節：膝關節、肘關節","車軸關節：頸部第一及第二節脊椎間關節、橈骨和尺骨近側的關節","橢圓關節：手腕的旋轉關節、指關節","鞍狀關節：大拇指關節","球窩關節：髖關節、肩關節"],"s":"2.4.2.2 滑膜關節的分類","p":36,"p2":36,"h":"對應工作紙一第 8 題的表格。記憶：滑動（掌骨、肩鎖）→ 鉸鏈（膝、肘）→ 車軸（頸 1-2 節、橈尺骨）→ 橢圓（手腕、指關節）→ 鞍狀（拇指）→ 球窩（髖、肩）。","k":"工作紙一 第 8 題"},{"i":"s16wxbqf","u":"u2","t":"g","q":"試列出關節的主要結構及輔助結構。","y":["主要結構：關節面、關節囊、關節腔","輔助結構（增加關節的穩固性或靈活性）：關節軟骨、韌帶、關節盤"],"s":"2.4.2.3.2 間接連結（關節）","p":37,"p2":38,"h":"工作紙一第 9、10 題。留意 2.4.2.1.2 另有寫法（滑膜關節主要結構包括關節軟骨），作答以 2.4.2.3.2 及工作紙為準。","k":"工作紙一 第 9、10 題"},{"i":"s1hnd5a2","u":"u2","t":"o","q":"試述呼氣及吸氣時，橫膈膜及胸腔壓力的變化。","y":["呼氣：橫膈膜放鬆，增加胸腔壓力，肺內的空氣排出體外","吸氣：橫膈膜收縮，胸腔壓力減少，空氣吸入體內"],"s":"2.3.3.3.2 呼吸系統 功能","p":21,"p2":21,"h":"記憶：吸氣＝橫膈膜「收縮」→ 胸腔空間大、壓力減少；呼氣相反。"},{"i":"s4wr1tt","u":"u2","t":"o","q":"試解釋「雙關節肌群」，並舉例。","y":["雙關節肌群：橫跨兩個關節的肌肉","課本例子：大腿內側縫匠肌、上臂肱二頭肌","頁面橙色標示另列：肱三頭肌、膕繩肌、腓腸肌、股四頭肌","對比：單關節肌群（如臀大肌、胸大肌）；多關節肌群能做較複雜的關節運動（如伸指肌、屈趾長肌）"],"s":"2.3.3.4.1 肌肉骨骼系統 組成","p":21,"p2":21,"h":"這一頁的「雙關節肌群」標題及例子均以橙色標示，MC 及 SQ 皆有可能出題。"},{"i":"s1c01zqv","u":"u2","t":"n","q":"試述成人脊柱（椎骨）的組成。","y":["成人椎骨共 26 節，上下連接","7 塊頸椎、12 塊胸椎、5 塊腰椎","1 塊骶骨（5 合 1）、1 塊尾骨（4 合 1）","兒童、青少年的骶骨和尾骨尚未連合（5 塊薦椎、4 塊尾椎），合共 33 塊脊骨","從側面觀察有 4 個生理弧度：頸前彎、胸後彎、腰前彎、骶後彎"],"s":"2.4.1.1.1 中軸骨（b 椎骨）","p":29,"p2":29,"h":"對應工作紙一第 6、7 題。","k":"工作紙一 第 6、7 題"},{"i":"stck2t1","u":"u2","t":"g","q":"試描述大循環（體循環）及小循環（肺循環）的血流路徑。","y":["大循環：左心房 → 二尖瓣 → 左心室 → 主動脈瓣 → 主動脈 → 身體其他器官","小循環：大靜脈 → 右心房 → 三尖瓣 → 右心室 → 肺動脈瓣 → 肺動脈 → 肺部 → 肺靜脈 → 左心房","功能：大循環輸送含氧血液到各器官組織；小循環在肺氣泡進行氧氣及二氧化碳的氣體交換"],"s":"2.3.4.1.3 心臟的血流","p":24,"p2":24,"h":"此兩條流程在筆記中均為綠色標示（MC 範圍），亦適合練習寫成流程題。"},{"i":"s32volq","u":"u2","t":"n","q":"試列出骨骼的功能。","y":["支撐：維持身體姿勢","保護：保護身體內部器官","造血：骨髓透過造血作用製造血球","儲存：黃骨髓有儲藏脂肪的作用，骨也是人體礦物鹽的儲存庫","活動：與肌肉以槓杆機械原理協調運作，產生不同的動作"],"s":"2.4.1.2 骨骼的功能","p":32,"p2":32,"h":"共 5 項：支撐、保護、造血、儲存、活動。"},{"i":"sx5quha","u":"u2","t":"g","q":"試比較骨骼肌、平滑肌及心臟肌的特點。","y":["骨骼肌：附著於骨骼上；能隨意運動；在顯微鏡下有橫紋；容易疲勞","平滑肌：位於內臟；不能隨意運動；在顯微鏡下沒有橫紋；不易疲勞","心臟肌：構成心臟壁；不能隨意運動；在顯微鏡下有橫紋；不易疲勞"],"s":"2.4.3.3 肌肉的類型","p":42,"p2":42,"h":"三種肌肉的名稱在筆記中為綠色標示。"},{"i":"s15ykuqy","u":"u2","t":"g","q":"試列出肌肉組織的四種特性。","y":["興奮性：指接受刺激並發生反應的特性","收縮性：有收縮的能力","延伸性：在外力作用下，有伸展、延長的能力","伸彈性：當外在拉力移除後，可以回復原來的長度"],"s":"2.4.3.1 肌肉組織的特性","p":42,"p2":42,"h":"易混淆：延伸性（被拉長）與伸彈性（拉力移除後回復）。"},{"i":"sz0oc6e","u":"u2","t":"g","q":"試列出課本所述的物理治療方法（至少五項）。","y":["運動治療","電療法","光學治療","聲波治療","電磁波治療","水療","心胸肺治療","平衡和步態評估及鍛煉","體適能評估及訓練","手力治療","針灸治療","其他治療方法（熱療、冷療、肌內效貼布／運動貼布）"],"s":"2.1.5 物理治療的方法","p":13,"p2":15,"h":"共 12 項，各項標題在筆記中均為綠色標示（MC 範圍）；建議每項記住一個例子（如光學治療＝激光、紫外光、紅外線）。"},{"i":"srvlq27","u":"u2","t":"n","q":"試列出物理治療的目標。","y":["預防疾病","治療病患","恢復身體活動功能","提升身體活動能耐","改善及加強日常生活或工作能力","提高生活質素","緩和家人及照顧者的壓力","減低入院機會，降低醫療支出"],"s":"2.1.2 物理治療的目標","p":12,"p2":12,"h":"共 8 項。"},{"i":"s1o2p4w5","u":"u2","t":"n","q":"試列出復康治療的好處。","y":["保持或提升肢體的功能、預防併發症發生","保持智力、減慢智力衰退","增強患者的自我照顧能力","擴闊社交生活","改善患者的生活質素"],"s":"2.1.1.2 復康治療的好處","p":12,"p2":12,"h":"共 5 項。"},{"i":"s1p6vxwz","u":"u3","t":"r","q":"試列出骨關節炎的徵狀。","y":["負重關節痛楚","關節腫脹及變形","關節活動幅度減少，活動受阻","關節活動時有聲響或關節內有磨擦的感覺","肌肉痙攣","休息時關節僵硬","（嚴重時關節更會出現紅、腫、熱及劇痛等病狀，在運動後也會僵硬）"],"s":"3.1.2.1.2 徵狀","p":55,"p2":55,"h":"共 6 項主要徵狀（紅色標示）。可同時補充成因：年齡增長、關節壓力（跑步、上落樓梯、蹲下）、身體過重、關節結構異常、過往傷患。"},{"i":"s11k1lvi","u":"u3","t":"r","q":"試列出肩周炎（五十肩／凝肩）的四個階段。","y":["第一階段：疼痛是主要徵狀，活動機能開始受到阻礙","第二階段：疼痛加劇，甚至影響睡眠；一般肩關節的活動會產生痛楚，同時肩關節逐漸硬化，影響日常生活如穿衣等","第三階段：自發性肩關節疼痛減少，而肩關節硬化卻變得嚴重","第四階段：肩關節硬化會逐漸改善；病人在適當運動及護理下，一般都能恢復肩關節的活動機能","（以上各階段的長短因人而異）"],"s":"3.1.4.2.3 肩周炎的四階段","p":59,"p2":60,"h":"記憶：痛 → 更痛＋開始硬 → 痛減但硬得最嚴重 → 慢慢改善。"},{"i":"s17ovegy","u":"u3","t":"r","q":"試列出網球肘（肱骨外上髁炎）的成因。","y":["常見於重複地活動手腕或前臂，造成肘、腕關節的肌肉負荷過重，以致肌肉疲勞造成傷害（例如長時間手抱小孩，或做太多前臂用力的家務，如反覆搓洗衣物、手提過重的菜籃）","伸腕肌肉所承受的牽扯力量超過可承受的程度（例如工作上時常需要前臂用力旋轉如上螺絲、反覆敲打或搬重物的人士：廚師、打字員、油漆工人、水泥工人等）","長時間的創傷會令手肘外側的肌腱勞損"],"s":"3.1.4.4.1 成因","p":60,"p2":60,"h":"網球肘是伸腕肌肉連接肱骨外上髁的肌腱發炎。成因關鍵字：重複活動手腕／前臂、牽扯力量過大、長時間創傷。"},{"i":"snajorl","u":"u3","t":"r","q":"試列出網球肘（肱骨外上髁炎）的徵狀。","y":["在肘關節外側感到痛楚，尤其當手指、手腕或前臂用力時（例如當緊握、用力提取重物或扭毛巾時）會感到手臂酸痛無力","患處通常會發紅、腫脹、疼痛、發熱","於肱骨外髁出現壓痛點（稍為用力按壓，患者就會感到非常疼痛）"],"s":"3.1.4.4.2 徵狀","p":60,"p2":60,"h":"「壓痛點」＝受傷後對壓力特別敏感的地方。"},{"i":"sqhkvlv","u":"u3","t":"r","q":"試列出腰背痛的成因。","y":["長期不良姿勢","提舉過重物件或不正確抬舉動作","背部勞損或創傷","退化性病患如骨質疏鬆症、脊椎關節或椎間盤受到刺激或先天性脊椎異常"],"s":"3.1.4.6.1 成因","p":61,"p2":61,"h":"共 4 項。"},{"i":"s5xqap0","u":"u3","t":"r","q":"試列出腰背痛的徵狀。","y":["腰背、臀部、下肢出現疼痛","麻痺","乏力","感覺減退"],"s":"3.1.4.6.2 徵狀","p":61,"p2":61,"h":"徵狀出現的位置：腰背、臀部、下肢；內容：痛、麻、乏力、感覺減退。"},{"i":"s11w029g","u":"u3","t":"r","q":"試列出中風（腦血管意外）的兩大成因類別，並簡述。","y":["缺血性中風：因腦血管硬化導致血管變窄或栓塞（較常見，佔中風病例超過 70%）","　腦血管粥樣硬化可令腦部動脈形成血栓；心臟或頸動脈所形成的栓子可能游離到腦血管，阻塞血流；心臟其他疾病（心律不正、心瓣問題、冠心病）也可導致中風","出血性中風：由於腦內血管爆裂，血液流入腦組織內，俗稱「爆血管」","　多與長期性高血壓有關，部分與先天性腦血管病變有關（如腦血管腫瘤導致腦血管破裂）","（小中風 TIA：症狀不超過 5 分鐘，通常 24 小時內完全緩解，是中風前的跡象，不容忽視）"],"s":"3.2.1.1 成因","p":62,"p2":62,"h":"工作紙二第 7 題也問缺血性／出血性中風的成因。"},{"i":"s8ptgoy","u":"u3","t":"r","q":"試列出中風的常見病徵。","y":["半身不遂（肢體癱瘓）","言語不清","嘴歪、眼斜","流口水","吞嚥困難","大小便失禁","感覺麻木","嚴重者甚至昏迷或死亡"],"s":"3.2.1.2 徵狀","p":62,"p2":62,"h":"共 8 項。病徵視乎發生病變的位置及其損害程度而定，個別患者會有不同的病徵。"},{"i":"ssfx2n7","u":"u3","t":"r","q":"試列出認知障礙症早期、中期及晚期的徵狀。","y":["早期：近期記憶力衰退，思考能力減低","中期：情緒不穩，容易動怒，日夜顛倒，四處走動，日常生活需要家人協助","晚期：無法認出家人、大小便失禁、說話和理解力遲鈍、完全喪失自我照顧能力"],"s":"3.2.3.2 徵狀","p":65,"p2":65,"h":"按階段分開作答，每階段寫 1-2 個關鍵字即可。"},{"i":"s1jzbx70","u":"u3","t":"o","q":"試列出柏金遜症的主要徵狀。","y":["肌肉僵硬及活動能力受阻","因體能活動減少，而引致其他機能衰退","手腳震顫","面部表情呆滯、情緒低落","聲音沙啞、說話／吞嚥困難","姿勢失去平衡及身體反應緩慢","失去平衡力，容易跌倒，身軀前傾，以急促碎步向前衝，起步及轉彎時尤其困難","其他：抑鬱、精神錯亂、癡呆、便秘、體重下降、骨折風險上升"],"s":"3.2.2.2 徵狀","p":63,"p2":64,"h":"大部分患者思想及認知能力正常、思維清晰。這一節在筆記中以橙色標示（MC、SQ 皆可能出題）。"},{"i":"sj0dqx3","u":"u3","t":"g","q":"試列出骨質疏鬆症的高危因素。","y":["更年期後及 45 歲或以上女性","缺乏運動（如經常臥床）","身體缺乏鈣質及維他命 D","少接觸陽光","經常吸煙、飲酒","疾病或藥物副作用（如長期服用類固醇者）","家庭有骨質疏鬆症及骨折病史","過瘦","高齡","過多咖啡因（咖啡、茶、可樂一日超過三杯）"],"s":"3.1.1.2.2 骨質疏鬆症的高危因素","p":54,"p2":54,"h":"共 10 項，在筆記中為綠色標示（MC 範圍），但同樣適合作 SQ 練習。"},{"i":"s1n9joga","u":"u3","t":"g","q":"試列出中風後常見之問題及併發症。","y":["情緒問題：沮喪、抑鬱、易怒、易發脾氣","呼吸道／泌尿道感染","壓瘡","吞嚥困難","便秘"],"s":"3.2.1.4 中風後常見之問題及併發症","p":63,"p2":63,"h":"共 5 項。"},{"i":"s7mgw1a","u":"u3","t":"g","q":"試列出神經痛的特性。","y":["疼痛的部份與特定的神經路一致","突然產生劇烈疼痛，疼痛的時間雖短，但是會反覆發生","嚴重時輕微的壓力或刺激到皮膚亦會感覺疼痛"],"s":"3.1.3.1.1 神經痛的特性","p":58,"p2":58,"h":"並非所有疼痛都可稱作神經痛，須符合以上特性才可診斷。"},{"i":"s1pkwgox","u":"u3","t":"n","q":"試比較骨關節炎與類風濕性關節炎。","y":["成因：骨關節炎是關節軟骨因年齡增長、關節壓力、身體過重、關節結構異常或過往傷患而磨損；類風濕性關節炎是免疫系統異常（真正原因不明，與基因、賀爾蒙有關）","受影響關節：骨關節炎主要影響負重的下肢關節（膝、足踝、髖）；類風濕性關節炎常見於手腕、手指聯接關節和膝蓋，且為左右對稱","內臟：骨關節炎不損害內臟器官；類風濕性關節炎屬「系統性疾病」，可影響眼睛視力、心肺機能等","其他：類風濕性關節炎有晨僵、女性較多、30-50 歲為患病高峰期"],"s":"3.1.2 關節炎","p":55,"p2":56,"h":"比較題可按「成因／部位／內臟／特徵」四個角度作答。"},{"i":"s1mvjdmi","u":"u3","t":"n","q":"請列出三種常見的骨關節疾病。","y":["骨折","骨質疏鬆症","關節炎（骨關節炎／退化性關節炎、類風濕性關節炎、痛風症）","（亦可舉軟組織勞損：腕管綜合症、肩周炎、網球肘、高爾夫球肘；或腰背痛）"],"s":"3.1 常見骨骼／關節疾病","p":53,"p2":55,"h":"工作紙二第 1 題。答案只要是課本第 3.1 節所列的疾病即可，意思合理便有分。","k":"工作紙二 第 1 題"},{"i":"s1i857td","u":"u4","t":"r","q":"試列出透皮神經治療機（TENS）的功能。","y":["舒緩長期疼痛","鬆弛肌肉緊張","部分模式或使用較大輸出時，可能會引起輕微的肌肉收縮，故此可能帶來輕度促進血液循環的作用"],"s":"4.1.1.4.1 透皮神經治療機（TENS）b 功能","p":67,"p2":67,"h":"共 3 項（紅色標示）。TENS 屬低頻電療。"},{"i":"s5b59sh","u":"u4","t":"r","q":"試述透皮神經治療機（TENS）的操作程序。","y":["在電極貼上加上導電啫喱，並貼於患處","通知患者通電之感覺（如針刺或麻痺感）","按治療師為患者處方的治療模式、頻率及波長，調較輸出之電量大小，開啟輸出按鈕","治療時間應由治療師決定，一般約 20 分鐘","治療完成後，關掉電源"],"s":"4.1.1.4.1 透皮神經治療機（TENS）d 操作程序","p":67,"p2":67,"h":"紅色標示只涵蓋首兩項（加導電啫喱貼電極、通知患者通電感覺），其餘步驟建議一併記住。預備工作：導電啫喱、醫生膠紙。"},{"i":"s1l0civv","u":"u4","t":"r","q":"試列出干擾波電療（IFT）的功能。","y":["深層止痛","鬆弛肌肉緊張","促進血液循環，減輕關節或肌肉的炎症","吸盤有按摩作用"],"s":"4.1.1.4.3 干擾波電療儀（IFT）b 功能","p":69,"p2":69,"h":"共 4 項。IFT 屬中頻電療。"},{"i":"shf2ksy","u":"u4","t":"r","q":"試列出進行干擾波電療（IFT）前的預備工作。","y":["準備圓形海綿及水","準備毛巾（作蔽體用）","準備足夠數量的防水膠墊","清潔患者皮膚上的油脂及藥膏"],"s":"4.1.1.4.3 干擾波電療儀（IFT）c 預備工作","p":69,"p2":69,"h":"共 4 項。操作時：電極（吸盤）以對角交叉方式擺放，由治療師調較設定並慢慢增加電量。"},{"i":"s1hfzeyj","u":"u4","t":"r","q":"試列出超聲波治療（US）的功能。","y":["消炎、消腫、止痛","改善血液循環，加速復原","防止產生軟組織之黏連"],"s":"4.1.2.1 超聲波治療儀（US）b 功能","p":70,"p2":70,"h":"共 3 項。超聲波主要用於治療軟組織損傷（肌肉、韌帶、肌腱或關節膜的損傷）。"},{"i":"s1nbnb4h","u":"u4","t":"r","q":"試列出熱療的功能。","y":["鬆弛肌肉緊張","增加血液循環","減低關節痛楚及僵硬度","增加肌肉伸展性"],"s":"4.1.3.1 熱療的功能","p":73,"p2":73,"h":"共 4 項。熱療禁忌：癌症的腫瘤部位、傷口位置、皮膚病的部位、冷熱感知缺陷、急性發炎、不能配合指示的病人。"},{"i":"sgyjjre","u":"u4","t":"r","q":"試比較熱水袋與電熱氈作為熱敷用具的優點及缺點。","y":["熱水袋優點：平價、使用方便","熱水袋缺點：灌注熱水會有燙傷的危險；物料硬身，影響接觸面積","電熱氈優點：熱力較低，適合冷熱感較弱人士（如長者）；可調較溫度及時間","電熱氈缺點：收藏不便（用完的熱敷須平放，避免摺疊收藏，以使發熱線更耐用）；羊毛氈套不可用水清洗，以免縮水"],"s":"4.1.3.4.1 熱敷（a 熱敷用具）","p":73,"p2":73,"h":"表格在筆記中以紅色標示。其餘熱敷用具：微波爐加熱式（加熱方便，但熱力不持久）、Hydrocollator（熱力平均持久，但需預先加熱、耗電量大）。"},{"i":"s1s820yp","u":"u4","t":"g","q":"試列出電療的禁忌及電療前的準備。","y":["禁忌：植有心臟起搏器／腦部深層刺激器","禁忌：患有皮膚病的部位","禁忌：孕婦盤腔部位","禁忌：不能配合指示的病人","準備：確定病人沒有上述禁忌症","準備：測試表皮感覺（如尖銳及鈍的感覺、冷熱感）","準備：檢查及確保電療儀器運作正常","準備：預備所需的配件"],"s":"4.1.1.1–4.1.1.2 電療的禁忌／電療前的準備","p":66,"p2":66,"h":"兩節在筆記中都是綠色標示（MC 範圍），亦屬工作紙三 TENS 操作技巧的重點。"},{"i":"s1x2y21f","u":"u4","t":"n","q":"試列出 TENS 的輸出能量、所需配件、主要功能及治療時的感覺。","y":["輸出能量：低頻電流（透皮神經電刺激，能刺激身體釋放內啡呔）","所需配件：電極貼、導電啫喱、醫生膠紙","主要功能：舒緩長期疼痛、鬆弛肌肉緊張，（部分模式或較大輸出時）輕度促進血液循環","治療時的感覺：局部針刺感及輕微震動"],"s":"4.1.1.4.1 透皮神經治療機（TENS）","p":67,"p2":67,"h":"對應工作紙三(一)表格。「輸出能量」一欄筆記沒有單獨列出，可由 2.1.4 的電療分類（低頻／中頻／高頻）及各儀器特性歸納，意思合理即可。","k":"工作紙三(一) TENS"},{"i":"svp004a","u":"u4","t":"n","q":"試列出神經肌肉電刺激（NMES）的輸出能量、所需配件、主要功能及治療時的感覺。","y":["輸出能量：電流，經完整的周邊神經系統傳導，以引起肌肉收縮","所需配件：電極貼（貼在肌肉的 motor point 上，位置請諮詢治療師）","主要功能：有針對性的神經和肌肉收縮運動；肌肉受傷或手術後康復；促進血液循環","治療時的感覺：肌肉被電流誘發收縮（必須看見肌肉收縮，甚或是全幅度活動）"],"s":"4.1.1.4.2 神經肌肉電刺激（NMES）","p":68,"p2":68,"h":"臨床應用：必須配合主動運動訓練；若病人未能配合可作被動式關節活動；肌肉再教育及誘發。","k":"工作紙三(一) NMES"},{"i":"svlbujb","u":"u4","t":"n","q":"試列出干擾波治療機（IFT）的輸出能量、所需配件、主要功能及治療時的感覺。","y":["輸出能量：兩個中頻交變電流聚合產生","所需配件：電極貼／吸盤、圓形海綿及水、毛巾（蔽體用）、足夠數量的防水膠墊","主要功能：深層止痛、鬆弛肌肉緊張、促進血液循環並減輕關節或肌肉炎症；吸盤有按摩作用","治療時的感覺：「過電」的感覺（針刺感），肌肉會不隨意地抽動"],"s":"4.1.1.4.3 干擾波電療儀（IFT）","p":69,"p2":69,"h":"兩組電極需以對角交叉方式擺放。","k":"工作紙三(一) IFT"},{"i":"sdbmzew","u":"u4","t":"n","q":"試列出超聲波治療（US）的輸出能量、所需配件、主要功能及治療時的感覺。","y":["輸出能量：電流通過晶體而產生的高頻率聲波","所需配件：導電（治療）啫喱、紙巾／毛巾（清潔用）","主要功能：消炎、消腫、止痛；改善血液循環，加速復原；防止產生軟組織之黏連","治療時的感覺：正常情況下，治療時沒有特別感覺"],"s":"4.1.2.1 超聲波治療儀（US）","p":70,"p2":71,"h":"輸出頭要在患處打圈；切勿在沒有啫喱／水的情況下開機。","k":"工作紙三(一) US"},{"i":"s1qd25m5","u":"u4","t":"n","q":"試列出衝擊波治療的輸出能量、所需配件、主要功能及治療時的感覺。","y":["輸出能量：高能量的聲波（與超聲波在波形、頻率及能量都有很大差別）","所需配件：導電啫喱、紙巾／毛巾（清潔用）；應由治療師操作","主要功能：刺激新血管生長，加速血液循環及喚醒細胞自我修復；大量刺激痛覺神經受體，達到即時止痛；形成氣化泡，瓦解鈣化性沉澱物","治療時的感覺：患處會有一定程度的酸、疼痛；聚焦於非患處時通常不會感到不適"],"s":"4.1.2.2 衝擊波治療儀","p":71,"p2":72,"h":"適應症例子：鈣化性肌腱炎、足底筋膜炎、網球肘、骨折癒合不良、骨壞死。禁忌：孕婦、起搏器、影響血凝固藥物、胸部／肺部附近、痛症部位附近有腫瘤、金屬植入物／傷口位置。","k":"工作紙三(一) 衝擊波"},{"i":"s1mnd6yc","u":"u4","t":"n","q":"試列出 TENS 操作技巧中的★重點注意事項。","y":["向病人確認沒有電療的禁忌症（沒有植入心臟起搏器、腦部深層刺激器、患有皮膚病的部位、孕婦盤腔部位、感覺缺失）","向治療師再確認治療位置、時間，並確認可以開始電療","提示病人在治療過程中切勿睡覺，如有任何不適請立即通知工作人員","提示病人在治療過程中如感到刺激強度減弱，請立即通知工作人員"],"s":"工作紙三(二) 電療機(TENS)的認識及操作技巧","p":66,"p2":66,"h":"這 4 項在工作紙上以★標示。其他步驟包括：檢查儀器及電源、自我介紹、核對身份、講解、針刺及鈍角感覺測試、檢查皮膚、承托姿勢、加導電啫喱貼電極、提醒不能自行調整電量、口述調校計時器及放求助鐘於病人伸手可及位置、完成後先關機。","k":"工作紙三(二)"},{"i":"s1xeykpn","u":"u4","t":"g","q":"試列出激光治療的注意事項。","y":["戴上護目眼罩","切勿直接照射眼睛","切勿直接對著鏡子或反射面","治療時需於分隔區域內進行，並於門外貼出警告告示"],"s":"4.1.6.1 激光治療 c 操作時的注意事項","p":79,"p2":79,"h":"激光功能：消炎、消腫、止痛、加速傷口癒合；臨床應用：針灸、淋巴水腫治療。"},{"i":"sb7qt2n","u":"u4","t":"g","q":"試述牽引治療的特性、功能及操作注意事項。","y":["特性：利用牽引的拉力及時間達到治療效果；常用來治療因脊椎神經根受壓迫所致的疼痛、麻痺或肌肉萎縮（如坐骨神經痛、肢體麻痺）；可作頸部或腰部的牽拉","功能：減輕椎間盤內部的壓力、舒整關節、改善受牽引部位的血液循環、放鬆肌肉、減輕痛楚","注意事項：只有在治療期間才可鬆開治療床上的滑動裝置；必須給予病人急停掣及求助鐘；牽引帶必須舒適而穩固地繫於病人身上"],"s":"4.1.5 牽引治療","p":77,"p2":78,"h":"「特性」一節在筆記中為綠色標示。"},{"i":"s1evm2ya","u":"u4","t":"n","q":"試列出三種電極貼的種類及其特點。","y":["自黏電極貼：使用方便；成本較高；導電性能隨使用次數下降，需不時更換","膠碳電極貼：清潔容易；可重複使用；需要導電啫喱；準備需時","海綿電極：可用於毛髮密集位置；導電效能良好；需留意清潔問題"],"s":"4.1.1.3 電極貼的種類","p":66,"p2":66,"h":"三種各記 2-3 個關鍵字即可。"},{"i":"s15w4tp","u":"u4","t":"n","q":"試述蠟療的操作程序。","y":["在使用前 1 小時開機，待蠟溶化","測試溫度在 52-55℃之間","清洗治療部位","接受治療部份浸 5-8 層蠟","每次加蠟，應待前一層蠟變白及稍乾才加另一層","完成後，套上膠袋及棉套保溫","敷在患處 15-20 分鐘，蠟套可由治療助理拆除"],"s":"4.1.3.4.4 蠟療機（b 操作程序）","p":76,"p2":76,"h":"蠟療適合不規則的部位，多用於手掌、手腕及足部；適用於關節炎、慢性痛、關節僵硬的患者；軟蠟治療可同時配合運動治療。"},{"i":"sqbqmjo","u":"u4","t":"n","q":"試列出治療助理在進行治療時的職責（預備、監察及善後工作）。","y":["預備：預備配套物品及所需物資；檢查及確保治療儀器正常運作；調較正確的設定；接觸患者前打招呼、自我介紹、確定患者名稱及接受協助的部位、講解步驟及應有的感覺、協助患者保持正確及舒適體位、適當展露身體部位並保障私隱","通知治療師所執行的預備工作，以便治療師進行治療","監察：與患者一直保持溝通或詢問其感覺；提醒患者切勿睡著，按需要通知治療師跟進；盡量避免接觸傷口及面向患者，留意其面部表情","善後：關機，收拾儀器及幫助患者清潔皮膚；詢問患者有否不適；妥善整理患者；確保患者在安全的休息位置，避免令患者獨處，離開前確保患者有求助的方法；通知治療師；清潔儀器及存放合適的地方；洗手"],"s":"4.3.2 治療助理在進行治療時之職責","p":85,"p2":86,"h":"注意事項：治療助理必須嚴格遵守治療師為患者處方治療的安排。"},{"i":"s7xe41p","u":"u51","t":"r","q":"試列出體溫、脈搏及呼吸的量度方法及其正常值。","y":["體溫｜量度方法：耳探、肛探、腋探、口探、額探；正常值：成人一般為 36.1-37.5℃（攝氏）","脈搏｜量度方法：觸摸橈動脈／頸動脈；聽診（心尖跳）；正常值：成年人每分鐘 60-100 次","呼吸｜量度方法：觀察（留意呼吸的頻率、深度與節律）；正常值（次／分鐘）：成人 16-20；嬰兒 30-40；小孩 20-25"],"s":"5.1.4 量度生命表徵的方法（體溫、脈搏、呼吸）","p":89,"p2":91,"h":"這三項在筆記中以紅色標示（SQ 範圍）。工作紙四的表格另包括血壓及血氧（見下一題）。","k":"工作紙四"},{"i":"sxl2wh6","u":"u51","t":"n","q":"試列出血壓及血氧的量度方法及其正常值。","y":["血壓｜量度方法：電子血壓計（手臂式較準確；手腕式可靠性較低；如有懷疑以水銀血壓計為準）、水銀血壓計","血壓｜正常值：理想血壓 收縮壓 <120／舒張壓 <80 mmHg（高血壓前期 120-139／80-89；第一階段高血壓 140-159／90-99；第二階段高血壓 >160／>100）","血氧｜量度方法：血含氧量測量機（Oximeter），以感應器夾著手指指尖（或耳垂）","血氧｜正常值：97-99%；低於 90% 表示低血氧症，患者可能出現口唇／皮膚發紫"],"s":"5.1.4.4／5.1.7.3 血壓及血氧","p":91,"p2":97,"h":"工作紙四要求列出五項生命表徵，血壓及血氧不在紅色標示內，但值得一併準備。","k":"工作紙四","pt":"血壓：第 91-93 頁；血氧：第 97-98 頁"},{"i":"sqkziss","u":"u51","t":"g","q":"試列出運動在生理方面的功能。","y":["促進血液循環，增強心肺功能","防止身體過胖，保持理想體重","減低患上糖尿病、高血壓、心臟病的機會","有助控制血糖、高膽固醇及高血壓","增加腸臟活動，減低便秘及患上結腸癌的機會","強健骨骼肌肉，預防骨質疏鬆","強化肌力，減慢衰老過程","促進軟組織的柔韌性及關節靈活性，減低跌倒的機會","改善關節因退化而引致的僵硬及痛楚","改善胃口及睡眠"],"s":"5.1.2.1 運動的功能（生理方面）","p":87,"p2":87,"h":"共 10 項，在筆記中為綠色標示（MC 範圍）。另有心理方面（減少抑鬱和精神緊張等）及社交方面（擴闊社交圈子等）。"},{"i":"s14uhjc7","u":"u51","t":"g","q":"試列出伸展運動的目的。","y":["鬆弛肌肉，增加血液循環","改善關節的活動幅度及關節周邊軟組織的柔韌性","減低運動受傷的風險及運動後肌肉緊張","減低因肌肉繃緊或抽筋所引致的疼痛","預防及治療肌腱勞損"],"s":"5.2.1.1.1 伸展運動 目的","p":100,"p2":100,"h":"共 5 項。"},{"i":"s1srr5x9","u":"u51","t":"g","q":"試以帶氧運動為例，說明運動處方 F.I.T.T.V.P. 中各項的內容。","y":["F 頻率：每週 3-5 次（隔天進行）","I 強度：約最高心率的 60-85%；最高心率＝220－年齡；運動停止後立刻量度脈搏 6 秒再乘以 10（或 10 秒再乘以 6）","T 性質：大肌肉有氧運動，如跑步、游泳、踏自行車、跳健康舞、打壁球","T 時間：每次連續 15-60 分鐘","V 總和（Volume）、P 進度（Progression）"],"s":"5.1.6 運動處方","p":94,"p2":94,"h":"長期計劃：每週最少 3-5 次運動、每次 30-45 分鐘；每週運動達致 150 分鐘；目標每週累積消耗 1000 卡路里（或平均每天步行 10,000 步）。"},{"i":"snv1jbs","u":"u51","t":"g","q":"試述呼吸運動的目的及訓練方法。","y":["目的：改善呼吸的效率；減少呼吸時的負荷","訓練方法：腹式呼吸","訓練方法：協調噘唇呼吸","一般方法：合嘴，以鼻孔慢慢吸氣，使肺部擴張，然後用口呼氣"],"s":"5.2.1.5 呼吸運動","p":103,"p2":103,"h":"呼吸運動在 5.8.1.7（慢性阻塞性肺病）亦有呼吸協調訓練：彎腰時呼氣、挺身時吸氣；用力時呼氣；伸手時吸氣、垂手時慢慢呼氣。"},{"i":"s1bg3c8s","u":"u51","t":"n","q":"試簡述一般運動小組（約 45-60 分鐘）的流程。","y":["熱身運動（約 10-15 分鐘）：溫暖身體各部位的軟組織（如原地踏步）；伸展運動增進柔軟度，減少受傷；長者更需要熱身","主題運動（約 20-30 分鐘）：耐力訓練及肌肉訓練；初期輕量，逐漸增強；運動時呼吸自然，仍可自若地談話","緩和運動（約 5 分鐘）：逐漸使身體平伏，呼吸及脈搏跳動恢復平常","伸展運動及總結（約 5 分鐘）：主要伸展剛才進行運動的肌肉或大肌肉，減少肌肉酸痛"],"s":"5.3.3.2 運動小組流程","p":107,"p2":108,"h":"記憶：10-15 → 20-30 → 5 → 5。"},{"i":"s10bsrr0","u":"u51","t":"n","q":"試列出不適宜進行運動的情況。","y":["發燒","胸口絞痛","身體劇痛","暈眩","噁心","嘔吐","血壓不穩定","糖尿病控制不佳"],"s":"5.3.3.4 運動須知（e）","p":109,"p2":109,"h":"共 8 項，課本以「等」作結，意思相近的合理情況亦可。"},{"i":"s8abwv9","u":"u51","t":"n","q":"試列出量度生命表徵時的注意事項。","y":["按照病人個別護理需要，定時替病人量度生命表徵","進行量度前：遵照機構的預防感染措施；確保醫療儀器操作正常；確定病人身份，解釋程序及可提供的協助，獲取其合作；先參考病人過往的數據作為基準值","為病人預備最舒適的位置及姿勢（如坐靠背扶手椅、仰臥），保障病人私隱，避免不必要暴露身體","一次性使用的物品（如耳探套）於使用後必須放入指定廢物棄置箱內","準確地記錄量度數據，如有異常即向上級報告"],"s":"5.1.4.4.4 量度生命表徵時的注意事項","p":93,"p2":93,"h":"共 5 大點（a–e）。"},{"i":"s1lfsmo9","u":"u51","t":"n","q":"試列出協助病人進行個別運動訓練時的重點（接待及預備、協助訓練）。","y":["接待及預備：清潔雙手；預備場地、器材及進行方式；自我介紹；核對身份；講解目的、流程及注意事項；給予合適的訓練指引；了解病人情況（血壓、心跳、有否不適）；協助保持正確體位；調教訓練儀器","協助訓練：運用合適的技巧（如示範）；觀察病人表現，留意姿勢及動作；按病人能力修正或調整幅度；留意病人有否申訴不適（有不適應立即終止訓練並向上級報告）；提醒切勿過度用力；觀察完成後的效果（按需要轉介上級）；完成工作後洗淨雙手；妥善記錄並向上級匯報"],"s":"5.3.4 協助個別運動的指引","p":109,"p2":109,"h":"與 5.7.1.4（進行被動運動時的注意事項）內容相近，可一併溫習。"},{"i":"s1ulbr5","u":"u54","t":"r","q":"試述採用「之」或「Z」字路線上落坡度大的斜坡的好處。","y":["雖然會增加行走距離，但可減低行走路段的斜度","從而減低照顧者因力量不足或意外脫手，而令輪椅倒溜失控發生意外的風險","萬一發生意外時，輪椅亦只會溜向斜坡兩邊，不至於直衝斜坡底，減低嚴重性"],"s":"5.4.3.4.3 上斜坡","p":117,"p2":117,"h":"紅色標示（SQ 範圍）。關鍵字：減低斜度、減低失控風險、溜向兩邊。"},{"i":"s1heunvu","u":"u54","t":"r","q":"試列出病人過椅（如大班椅、便椅）及過床後的注意事項。","y":["過椅（大班椅、便椅等）後：必須扣安全帶，或上枱面板，給予求助鐘或安置能讓職員容易看見的位置","過床後：必須上床欄，給予求助鐘","（補充）送病人回床時，若沒有特別指示，病人應仰臥於病床正中央，頭部貼近床頭"],"s":"5.6.3 扶抱時的基本技巧（注意事項）","p":133,"p2":133,"h":"紅色標示涵蓋前兩項。同一節的其他注意事項：除去手錶飾物、清潔雙手、確保輪轆已鎖上、核對身份、移開障礙物、縮短轉移距離、告知病人程序。"},{"i":"s2vgs7s","u":"u54","t":"g","q":"試列出受助者在輪椅上的正確坐姿。","y":["身體挺直，背部貼近輪椅背","雙腳放在腳踏上","雙手放在兩邊扶手之內","扣上安全帶，鬆緊適中","留意受助者是否坐得平穩及舒適","檢查衣物或其他物件有否絆著後輪"],"s":"5.4.3.3.1 輪椅上的坐姿","p":116,"p2":116,"h":"共 6 項，在筆記中為綠色標示（MC 範圍）。"},{"i":"sz74vx0","u":"u54","t":"g","q":"試列出助行器的使用原則，並說明量度助行器高度的方法。","y":["由物理治療師按使用者身體情況指導他使用某一類輔助器材","助行器的高度要與使用者的高度配合","檢查助行器調節高度鈕掣是否安全穩妥","協助使用者步行時，必須站於使用者弱側，以防弱肢乏力或跌倒","轉彎時盡量用好腳做重心","量度高度：最好發力的角度為手肘微曲 20-30 度；可參考股骨大轉子的位置；第一次調校以病人主觀感覺為依歸"],"s":"5.4.4.2 助行器的使用原則","p":122,"p2":122,"h":"兩節在筆記中均為綠色標示（MC 範圍）。"},{"i":"szrain4","u":"u54","t":"n","q":"試列出輪椅的常見檢查事項（按輪椅部分）。","y":["剎掣：是否操作正常？螺絲有否鬆脫？有否其他損壞？","骨架：有否裂痕或生銹？螺絲有否鬆脫或損壞？摺合時活動是否順暢或過緊？","輪胎：有否損壞或漏氣？前後輪軸之螺絲有否鬆脫、失掉或纏上毛髮？","活動式腳踏：有否損壞或鬆脫？能否穩固地裝回？","腳踏板：翹起後是否穩定？","扶手：有否損壞或鬆脫？","可裝拆除的扶手：是否穩固地裝回？","坐墊：有否破損？","靠背：有否破損？","其他：輪椅是否能直線行駛？左右旋轉是否暢順？有沒有雜聲？安全帶是否損壞？"],"s":"5.4.3.6 檢查及維修輪椅","p":118,"p2":118,"h":"對應工作紙五的表格（10 個部分）。每個部分寫 1-2 個重點即可。","k":"工作紙五"},{"i":"st1n5pj","u":"u54","t":"g","q":"試列出預防跌倒的家居環境改善方法。","y":["室內光線：燈光充足、光度適中、不反光，黃光燈泡較適合長者；晚上枕邊放電筒或裝床頭燈；走廊裝夜明燈；電話及救命鐘放近床邊；用清晰大字體指示牌","睡房及客廳：床邊有扶手或床欄；床及床褥高度適中；椅子高度適中；梳化不要太軟；地板與傢俬顏色對比強烈，地毯固定妥當；避免使用摺椅和有轆的座椅","廁所：座廁旁安裝扶手（不要以毛巾架作支撐）；夜間置便椅、便盆或尿壺；加高坐廁；減低或去除門檻","浴室：防滑地磚、沖涼椅；浴缸內鋪防滑墊／防滑貼；必要時改為企缸","廚房：地面保持乾潔；枱面高度適中；可放置椅子；用長柄夾拾地上物件；物件放在就近自己的高度"],"s":"5.5.3.3 家居環境","p":126,"p2":127,"h":"「家居環境」在筆記中為綠色標示，「室內光線」一項特別標出。"},{"i":"s1xuatj4","u":"u54","t":"n","q":"試列出引致跌倒的內在因素及外在因素。","y":["內在因素：身體機能衰退（肌肉力量、關節活動能力、平衡力、視力或聽力）；情緒及心理因素（曾跌倒而缺乏信心或恐懼）；過份自信、不了解自身體能；酒精、藥物影響（降血壓藥、抗敏感藥、鎮靜劑）；疾病影響（貧血、關節痛及退化、體位性低血壓）","外在因素：環境因素（濕滑凹凸地面、室內光線不足、通道狹窄或有障礙物）；缺乏扶手或不當使用輔助物品；不良生活習慣（使用不合適助行器具、穿過長褲子、站在不穩椅子拿櫃頂物品）"],"s":"5.5.2 引致跌倒的原因或風險","p":125,"p2":126,"h":"體位性低血壓（躺卧轉直立時收縮壓降大於 20 或舒張壓降大於 10 mmHg）屬內在因素，筆記為綠色標示。"},{"i":"satzxo2","u":"u54","t":"n","q":"試列出扶抱時的基本技巧。","y":["使用四肢的大肌肉，避免使用腰背發力","任何時候升起重物的力量應來自下肢，股四頭肌及臀大肌","評估病人的體重，先評估自己的能力","重物（病人）要近身","預備環境及輔助物；搬抬前預計路程並確保沒有障礙；路途太遠可設休息站","保持溝通（病人及協助者）","二人扶抱：兩人良好溝通，由一人發號令（如數「一、二、三」）才一齊慢慢抬起（放下時亦數口令）"],"s":"5.6.3 扶抱時的基本技巧","p":132,"p2":132,"h":"原則：病人安全、職業安全、有效率。"},{"i":"s1fhyk9x","u":"u54","t":"n","q":"試列出協助右側偏癱病人由床轉移至輪椅的主要步驟，並指出★重點。","y":["預備：除去手錶、飾物並清潔雙手；預備輪椅、調較病床高度；自我介紹及核對身份；講解程序及目的；全程留意病人有否不適","協助病人屈曲髖及膝關節；手按肩膊及髖骨，協助轉為側臥；協助雙腳移出床邊","轉移前確保輪椅停泊於病人健側、無障礙物及鎖上輪轆","★一手托起病人肩膊，另一手按於髖骨處，協助病人坐起；指導病人用健側手扶床坐穩","協助病人穿鞋，使雙腳着地；用手承托病人腋下，手肘盡量靠近自己身體","★協助病人用健側手按住扶手，慢慢坐在輪椅上","★坐上輪椅後必須先扣上安全帶；協助病人端坐、放回腳踏；患側上肢放於腹前／大腿上／輪椅內，雙腳放腳踏上","完成後洗淨雙手","★扣分重點：發力時沒有保持腰背挺直及沒有以大腿發力；獨留病人於床上時沒有鎖床欄；轉移前及離開前沒有鎖輪轆；未能穩妥扶持令病人不適；沒有時刻保持病人於視線範圍內；出現任何危及病人安全的情況"],"s":"5.6.4.2.1 由床邊轉移至輪椅","p":134,"p2":135,"h":"對應工作紙六（實操評核表）。學習時留意「健側」原則：輪椅停泊健側、病人用健側手扶床及扶手。","k":"工作紙六"},{"i":"s17fmqg5","u":"u54","t":"n","q":"試列出處理「快將跌倒的病人」的步驟。","y":["以雙手支撐病人腋下或抓緊褲頭","將病人拉近自己身邊（重物近身），以身體支撐病人，同時兩腳前後站立","保護病人頭部","慢慢與病人順勢坐下","安慰病人，同時召喚他人幫助","監察（如合適的維生指數）、滙報及記錄"],"s":"5.6.5.1 快將跌倒的病人","p":136,"p2":136,"h":"共 6 步。扶起已跌倒的病人：先確定病人情況 → 通知並要求協助 → 選擇合適的助移方法（輔助物品／協助有若干能力的病人／助移機）→ 監察、匯報及記錄。"},{"i":"s6g33y1","u":"u57","t":"o","q":"試列出阻力訓練的好處。","y":["有助血壓和血糖的控制","減少肌肉及關節的慢性痛症","預防骨質疏鬆","減低跌倒及受傷的機會","增強運動能力","保持身體正確姿勢及改善體態","促進生理機能及健康","減低精神壓力","增強自信心"],"s":"5.7.3.2 阻力訓練的好處","p":142,"p2":142,"h":"共 9 項，筆記以橙色標示（MC、SQ 都要）。"},{"i":"s1fc4crf","u":"u57","t":"o","q":"試列出阻力訓練常用的阻力來源。","y":["自身重量（Self-body Weight）：使用身體重量","重物（Weights）：如使用啞鈴、槓鈴等","橡根帶（Theraband）"],"s":"5.7.3.3 訓練原則（阻力來源）","p":143,"p2":143,"h":"橙色標示。例子（5.2.1.2）：使用外來阻力＝器械運動、舉啞鈴／水樽、踢沙包；使用自己身體重量＝仰臥起坐、掌上壓。"},{"i":"s6q5xqg","u":"u57","t":"n","q":"試簡述被動式運動的目的、不宜進行的情況及注意事項。","y":["目的：維持各關節及軟組織的活動幅度，減低肌肉關節攣縮的機會；維持全身血液循環，避免深部靜脈栓塞","不宜：急性肌肉、肌腱、韌帶損傷；未完全癒合骨折處所牽涉的關節；剛接受手術的肌肉、肌腱、韌帶、關節與皮膚部位；深部靜脈栓塞的肢體","注意事項：接觸病人前清潔雙手、自我介紹及核對身份；預備場地及器材；協助病人保持正確體位；用毛巾遮蓋尷尬部位；不可按壓於傷口；講解目的、流程及注意事項；先了解病人情況（如血壓、心跳）；觀察面部表情，按病人能力調整幅度，避免過度用力；保持溝通；如病人不適立即終止並向上級報告；觀察效果，按需要轉介；完成後洗淨雙手；妥善記錄及向上級匯報"],"s":"5.7.1 被動式運動（Passive Exercise）","p":138,"p2":138,"h":"「被動式運動」定義在筆記中為綠色標示。"},{"i":"su55wd0","u":"u57","t":"n","q":"試列出伸展運動的種類及訓練指引。","y":["種類：動態伸展（身體反覆彈震以擴展關節）；靜態伸展（靜止緩慢延伸關節肌肉）；本體感覺神經肌肉促進法（PNF）","訓練方法：主動式伸展、輔助性伸展、被動式伸展（適合長期卧床患者）","訓練頻率：每星期針對主要肌群進行 5 天或以上","運動強度：每組動作做 2-3 次，當肌肉感到輕微拉扯時，每次動作嘗試維持 20-30 秒；強度以可接受程度為準","助理應選用靜態伸展；盡量穿著鬆身衣物；保持呼吸暢順"],"s":"5.7.2 伸展運動","p":139,"p2":139,"h":"伸展幅度為患者關節可接受之最大幅度；伸展動作的方向與肌肉收縮所帶來的動作方向相反。"},{"i":"ssvzi63","u":"u57","t":"n","q":"試列出進行被動式伸展運動的要點。","y":["須完全承托患者肢體，了解所伸展的目標肌肉群","伸展位置或力量不應橫跨多個關節（特別是膝、踝、肩、手肘、手腕、手指）","雙手擺放之位置應在被伸展肌肉之上下關節之上","一手應為定點（支點），另手為移動點（力點）","或會有輕微拉扯感，應以患者可接受程度為宜，不應造成過份不適","盡量與患者保持眼神接觸及對話，了解拉筋程度會否太大"],"s":"5.7.2.7.2 被動式伸展運動","p":141,"p2":141,"h":"被動式伸展適合為長期卧床患者進行；常見方法（上肢）三角肌、斜方肌、肱二頭肌、肱三頭肌、胸大肌；（下肢）臀大肌、股四頭肌、膕繩肌、腓腸肌。"},{"i":"s133rlah","u":"u57","t":"n","q":"試述為偏癱病人進行腓腸肌靜態被動伸展的主要步驟及★重點（工作紙七）。","y":["預備：除去手錶、飾物，接觸病人前後洗手；自我介紹；核對身份；講解目的及過程；全程檢查及查詢病人狀況","指示病人利用健側幫助橫移（或助理利用橫單）將病人移近床邊；調較床至合適高度","擺位：左偏癱——右手確保病人膝關節保持伸直、左手包著足跟位置，病人的腳掌放於助理的前臂上；右偏癱則相反","借助自身重量施力，同時控制力度（增加足背屈曲）","★緩慢地伸展動作至最大幅度，沒有作動彈的動作","詢問病人小腿是否有被拉緊的感覺；固定在此位置 15-30 秒，共做 3-5 次","★時刻注意病人面部表情，不會因過份牽拉令病人表現劇痛","完成後協助病人置身於原本的姿勢（仰臥於床的正中，頭部盡量貼近床頭）","★離開病床時有上好床欄；★離開病床前給予求助鐘；★未有按指示而錯誤伸展健側（為扣分重點）"],"s":"5.7.2.7.2 被動式伸展運動（腓腸肌）","p":140,"p2":141,"h":"工作紙七為實操評核表。留意「錯誤伸展健側」是★扣分重點：偏癱病人須伸展的是患側。","k":"工作紙七"},{"i":"s1igadva","u":"u58","t":"o","q":"試列出髖關節置換手術後初期（肌肉力量未完全回復前）的注意事項。","y":["不可作髖關節屈曲多於 90 度","不可作髖關節內收超過中線","不可作股骨內轉","病人如廁時一般會給予加高坐墊，以避免髖關節過度屈曲","晚上睡覺時把一個枕頭置於兩腿之間，直至骨科醫生另行指示"],"s":"5.8.1.1.2.1 髖關節置換手術後的注意事項","p":146,"p2":146,"h":"共 5 項：前兩項筆記以橙色標示，後三項以紅色標示。部分膝關節置換手術後，膝關節不宜屈曲超過 90 度。"},{"i":"s1eu1asr","u":"u58","t":"o","q":"試列出腰背痛的治療及護理方法。","y":["物理治療","手術治療","藥物治療","適量運動：每日做 30 分鐘輕柔運動，有助減慢退化過程，以及使背部的肌肉更壯健並且柔韌","改善生活習慣：正確地搬移物件；保持良好站立及坐姿；穿著舒適及低跟的鞋，避免穿著太高跟的鞋（高跟鞋令身體重量向前傾，增加背部弧度）；保持適中體重、均衡飲食（過重或肥胖會增加背部負擔）"],"s":"5.8.1.2.2.6 腰背痛","p":148,"p2":148,"h":"物理治療、手術治療、藥物治療及適量運動為橙色標示；「改善生活習慣」為紅色標示。"},{"i":"s1hkwp2j","u":"u58","t":"r","q":"試列出骨折的痊癒過程（三個階段）。","y":["一）在骨折處血塊的凝結（血腫形成期）","二）纖維組織生長（骨痂形成期）","三）新生骨的形成（骨痂改造期）"],"s":"5.8.1.3 骨折創傷","p":148,"p2":149,"h":"記憶：血塊 → 纖維組織（骨痂形成）→ 新生骨（骨痂改造）。治療骨折最重要的因素：給予骨骼適當的負重（壓力），刺激成骨細胞活動。"},{"i":"s1r1nfcz","u":"u58","t":"o","q":"試述固定骨折的方法。","y":["整復骨骼和固定的方法主要分兩類：閉合性復位和外固定；開放性復位和內固定","外固定：從體外固定骨折部","內固定：手術的方式將金屬骨釘釘合在骨折部分","無移位的骨折：通常可用石膏固定患處","移位性的骨折：要透過手術進行復位及固定，如鑲入鋼針、鋼線或螺絲等","完全粉碎及無法復位的關節：醫生會考慮進行關節置換術，最常見的有長者股骨骨折後進行的髖關節置換手術"],"s":"5.8.1.3.2.1 固定骨折","p":149,"p2":149,"h":"「固定骨折」一段以橙色標示。骨折後的其他治療：痛症治療（儀器）、功能訓練（關節活動、肌力及功能訓練、控制／平衡力訓練）、藥物治療（複雜性骨折須消毒、清創、投予抗生素）。"},{"i":"s6r0ho7","u":"u58","t":"r","q":"試列出中風的復康訓練項目。","y":["阻力訓練：鍛鍊肌肉力量及控制","伸展運動：維持、恢復及增加關節活動度；防止肌肉攣縮；防止關節僵硬；緩解黏連","訓練肢體控制","平衡、步行、耐力訓練","功能訓練：轉身、站立、轉移、走路、上落樓梯","訓練使用助行器及日常生活器具","改善認知及溝通能力","起居生活及自我照顧技巧訓練","痛症處理","家居評估"],"s":"5.8.1.5.5 中風復康訓練項目","p":152,"p2":153,"h":"共 10 項（a–j），紅色標示。"},{"i":"s66i1y5","u":"u58","t":"r","q":"試列出腦麻痺的成因。","y":["嬰兒在出生前：腦部受到創傷而引起，如孕婦在懷孕早期受到某些感染（例如德國麻疹、帶狀皰疹），或服食某些藥物、嚴重營養不良等","嬰兒在生產過程中：早產、難產造成腦部的傷害；缺氧，使腦部得不到充分的氧氣供應","嬰兒在出生後：因腦部感染如腦炎、腦膜炎或創傷"],"s":"5.8.1.11.2 成因","p":166,"p2":166,"h":"工作紙八第 2 題原題。按「出生前、生產過程中、出生後」三個時期作答最清晰。","k":"工作紙八 第 2 題"},{"i":"s1qc59wa","u":"u58","t":"n","q":"試列出兒童整體發展遲緩的徵狀。","y":["智能或認知：學習、思考及解決問題的能力","語言：語言理解、表達及發音能力","大肌肉：坐、站立、步行、跑、跳等體能發展","小肌肉：手眼協調、工具運用及抄寫能力等","社交及適應力：溝通、社交、自理及日常生活所需的基本技巧","（兒童可以在一個或多個範疇上表現遲緩，個別差異大）"],"s":"5.8.1.10.2 兒童整體發展遲緩 徵狀","p":165,"p2":165,"h":"工作紙八第 1 題原題（筆記上沒有標色，但屬工作紙題目，值得準備）。成因：遺傳、懷孕及生產因素、幼兒及兒童時期染病／中毒／腦部受損、環境因素（缺乏社交或語言啟發）。","k":"工作紙八 第 1 題"},{"i":"skafjvg","u":"u58","t":"r","q":"試列出為兒童進行運動時須注意的事項。","y":["要特別注意職業安全：職員經常因遷就兒童的身高而長時間彎腰，或因輕視兒童的體重，以不正確的姿勢進行扶抱","由於兒童不善於表達自己，職員要有更強的觀察力，期望能找出兒童正面對的問題"],"s":"5.8.1.11.5 運動時的注意事項及指引","p":167,"p2":167,"h":"共 2 點，紅色標示。"},{"i":"s1uud91l","u":"u58","t":"r","q":"試列出急性運動創傷的種類，並簡述各種創傷。","y":["骨折（Fracture）：骨骼經由外力的出擊而折斷，或是由於疲勞或訓練過度時較易發生，可分為閉合性及開放性骨折","挫傷（Contusion）：皮下組織受到鈍力撞擊所造成的創傷，沒有開創性傷口；患部常見微血管破裂出血，表面血腫（俗稱瘀青）","韌帶拉傷／扭傷（Sprain）：關節過度伸展，韌帶無法承受猛烈的力量而撕裂甚至發炎腫脹；程度分輕度、中度、嚴重三級","肌肉拉傷／扯傷（Strain）：柔軟度不足（未充分熱身伸展）、不正常的收縮或協調性不良，導致肌纖維受拉扯受傷甚至斷裂；較常見的是下背肌群及股四頭肌；程度分輕度、中度、嚴重三級"],"s":"5.8.1.13.1.1 急性運動創傷","p":169,"p2":170,"h":"四種創傷的名稱以紅色標示。慢性運動創傷：慢性肌腱炎、壓力性（疲勞性）骨折。"},{"i":"s1vd5lzn","u":"u58","t":"r","q":"試述急救原則 PRICE 的五個步驟。","y":["P 保護（Protection）","R 休息（Rest）","I 冰敷（Ice）：血管收縮，減少組織液，從而減少腫脹","C 加壓（Compression）：用彈性帶穩固地輕輕包紮","E 抬高（Elevation）：把受傷部位托高"],"s":"5.8.1.13.4 運動創傷 治療及護理方法（a 急救原則）","p":172,"p2":172,"h":"紅色標示。另在 5.8.1.1.2.1（關節炎急性期）亦有 PRICE，為綠色標示。"},{"i":"shn31pf","u":"u58","t":"g","q":"試列出骨關節炎／類風濕性關節炎的治療及護理方法。","y":["冷熱治療：急性期用 PRICE，慢性期熱敷","適量運動：節奏慢、低負重運動（如游泳、散步），增強肌肉、減輕關節負荷、保持關節活動能力、減輕痛楚","控制體重，免增加關節負荷","保持正確姿勢","均衡飲食，增加鈣的吸收","嚴重時可佩戴護具","藥物治療：主要是徵狀治療，痛楚時給予消炎止痛藥","手術治療（如全膝關節置換、髖關節置換）"],"s":"5.8.1.1.2 關節炎 治療及護理方法","p":145,"p2":145,"h":"「復康原則」「PRICE」「適量運動」在筆記中為綠色標示。"},{"i":"s6gqo6j","u":"u58","t":"g","q":"試列出柏金遜症的治療及護理方法。","y":["藥物治療：未有根治原發性柏金遜症的方法，但藥物能控制病徵、減輕震顫；通常需長期服用，切勿自行中止","物理治療：康復運動（預防肌肉痙攣、增加身體及關節柔軟性、保持正確姿勢防止畸形）；適當使用助行器及正確運用轉移技巧","職業治療：手部活動及起居生活功能訓練；用拉鍊或魔術貼代替鈕扣；提供輔助器具；改善家居佈置（扶手、斜路代替樓梯等）","語言治療：幫助改善說話及吞嚥問題","按摩及熱療：保持肌肉彈性，熱療時小心燙傷","注意家居安全，預防跌倒","心理輔導"],"s":"5.8.1.6.2 柏金遜症 治療及護理方法","p":154,"p2":155,"h":"「治療及護理方法」及藥物治療、物理治療、康復運動、職業治療、語言治療均為綠色標示。"},{"i":"skfi6oh","u":"u58","t":"g","q":"試列出慢性阻塞性肺病的徵狀及復康原則。","y":["徵狀：咳嗽；痰多；氣促，運動時情況惡化；呼吸困難（呼吸時有哮喘鳴音）；體力及活動能力下降；出現缺氧情況，如嘴唇、手、腳呈藍色","復康原則：保持肺部衛生防止肺炎；維持體能","（補充）最常見的是慢性支氣管炎及肺氣腫，患者一般都有長期吸煙或吸二手煙的經驗"],"s":"5.8.1.7 慢性阻塞性肺病","p":156,"p2":156,"h":"胸肺復康治療：教授控制氣喘技巧、呼吸鍛鍊、清除痰涎（抽痰、拍痰、姿位排痰）、呼吸與身體動作協調、體力鍛鍊、節省體力方法、氧氣治療。"},{"i":"swr2d2q","u":"u58","t":"g","q":"試述心絞痛發作時的處理方法。","y":["先讓病人坐下（或半坐臥休息），立即終止一切活動","若病人備有脷底丸（硝酸甘油片），應盡快協助他服用：將一粒含於舌下，切勿吞下或咬碎，然後觀察 5 分鐘","避免把脷底丸放在掌心，應倒在藥瓶蓋上，以免體溫和濕氣影響藥效","如果心絞痛仍未舒緩，再含第二片；5 分鐘後如仍未好轉，則再含第三片","再於 5 分鐘後若心絞痛仍未有消退迹象，則可能是心肌梗塞，應盡快聯絡病房醫生"],"s":"5.8.1.8.4 冠心病 運動時的注意事項及指引","p":160,"p2":160,"h":"舌下有豐富的血管網絡，能加快脷底丸成份的吸收，故能在短時間內舒緩心絞痛。冠心病患者必須隨身攜帶脷底丸及病歷咭。"},{"i":"sbcsroz","u":"u58","t":"g","q":"試列出慢性糖尿病併發症。","y":["失明、視網膜病變、白內障、青光眼","足部循環及神經系統病變、感染、潰瘍和壞疽，嚴重會導致截足","中風","心臟病","腎臟感染、腎衰竭"],"s":"5.8.1.9.5.2 慢性糖尿病併發症","p":162,"p2":162,"h":"綠色標示。急性併發症：血糖過高（呼吸快而深、噁心、嘔吐、嚴重劇渴、神智不清或昏迷）、血糖過低（心跳加速、手震、出汗、頭暈、嚴重飢餓感等）。"},{"i":"s1v52rh8","u":"u58","t":"n","q":"試列出痛風症的治療及護理方法。","y":["痛風雖不能根治，但適當的藥物及飲食控制可以防止復發","多飲開水，透過排尿可以幫助排出體內過量的尿酸","冰敷以消炎、消腫","控制體重","適量運動（如關節運動）","避免進食含有高嘌呤的食物：酒類；動物內臟（腦、肝、腰、心臟、胰等）；沙甸魚、魚卵、貝殼類海產；避免過量肉類、家禽和魚類；避免過量乾豆類、冬菇、椰菜花、菠菜及鮮露筍","藥物治療：急性發作時遵照醫生指示服用消炎止痛藥；若血液內尿酸持續高出正常水平，需長期服藥"],"s":"5.8.1.1.2.2 痛風症","p":146,"p2":147,"h":"「冰敷以消炎、消腫」一項以紅色標示。"},{"i":"sr2hcpk","u":"u58","t":"o","q":"試列出網球肘（肱骨外上髁炎）的治療及護理方法。","y":["冰敷：當網球肘處於發炎期，可在壓痛的部位以冰敷止痛和消炎，患者應避免手腕用力","物理治療：以超聲波止痛和消炎","運動治療：進行肌力加強運動和伸展運動，預防網球肘復發","藥物治療：若病情未受控制，會以非類固醇消炎藥或藥膏止痛、消炎","（網球肘／高爾夫球肘）伸展運動；矯形支架（如手肘帶）減輕相關肌肉緊張；避免重複／過度的腕部活動"],"s":"5.8.1.2.2.4–5.8.1.2.2.5 肱骨外上髁炎（網球肘）","p":148,"p2":148,"h":"「冰敷」及「超聲波」兩項以橙色標示。"},{"i":"s17wj56j","u":"u58","t":"g","q":"試列出腕管綜合症（腕骨隧道症候群）的治療及護理方法。","y":["休息患處","使用輔助用具：防止手腕彎曲的支架可幫助減輕滑膜發炎和腫脹","物理治療","藥物治療：醫生處方消炎藥加以控制，並根據病情作局部的類固醇注射","手術治療"],"s":"5.8.1.2.2.1 腕骨隧道症候群／腕管綜合症","p":147,"p2":147,"h":"綠色標示（a–e 共 5 項）。預防方法見單元三 3.1.4.1.3：適時放鬆雙手、每 15-20 分鐘稍歇並伸展手腕、避免過份屈曲手腕、避免把手腕壓在堅硬表面。"},{"i":"s12rprcy","u":"u59","t":"r","q":"試列出處理（預防）壓瘡的方法。","y":["避免長時間壓迫皮膚","重視皮膚清潔並定期檢視皮膚狀況","預防摩擦力、剪力","增加皮膚適度循環","失禁性皮膚炎預防照護","（可補充要點）長期卧床者最少每兩小時翻身；輪椅使用者每半小時改變姿勢；每天洗澡時檢查皮膚；用滑毯、翻身中單；鼓勵關節活動；失禁後用清水或微酸性清潔劑輕柔清潔"],"s":"5.9.1.6.8 處理方法（a–e）","p":184,"p2":185,"h":"5 大項標題均為紅色標示（SQ 範圍）。作答時先寫標題，再為每項補 1-2 個要點會更穩陣。另有「處理原則」：保持皮膚完整性、早期偵測高危人士、防止壓瘡惡化、促進傷口癒合、讓患者及家人了解成因及預防方法。"},{"i":"sq0l0jf","u":"u59","t":"r","q":"試列出「避免長時間壓迫皮膚」的方法。","y":["長期卧床者：最少每兩小時翻身一次，不要讓身體同一個部位長時間受壓；須檢視用大拇指輕按壓是否發白，若無發白，則須縮短翻身時間","依病患易受壓部位選擇合宜的支托工具或減低力的輔助物，例如枕頭、氣墊床；可在病患兩腿間置一枕頭預防兩膝或兩足踝的相互碰撞與摩擦；所有圈墊的使用均應避免","長期使用輪椅者：需每半小時改變姿勢，可以雙手撐起上半身，使臀部懸空減低壓力","保持病患的床單及衣物清潔平整，減少壓力源"],"s":"5.9.1.6.8 處理方法（a 避免長時間壓迫皮膚）","p":184,"p2":184,"h":"共 4 點。"},{"i":"s1chtzuj","u":"u59","t":"r","q":"試列出「重視皮膚清潔並定期檢視皮膚狀況」的方法。","y":["每天洗澡，此時為檢查皮膚的最好時機","檢查皮膚狀況，尤其是骨頭突出的地方，如果有發紅、變色或破皮，就要避免壓迫","清潔後以乾毛巾點狀式拭乾身體的水分，特別是皮膚皺摺處","擦澡或沐浴後，使用乳液或乳霜滋潤皮膚"],"s":"5.9.1.6.8 處理方法（b 重視皮膚清潔並定期檢視皮膚狀況）","p":184,"p2":184,"h":"共 4 點。"},{"i":"s1o0tn01","u":"u59","t":"r","q":"試列出預防壓瘡的「預防摩擦力、剪力」及「增加皮膚適度循環」的方法。","y":["預防摩擦力、剪力：搬運病患或協助病患更換姿勢時，可利用滑毯、翻身中單，避免以拖、拉的方式移動病患身體","預防摩擦力、剪力：對採半坐臥式的病患，床頭搖高應低於 30 度，或配合搖高床尾，以減少因身體下滑造成尾骶骨處的剪力","增加皮膚適度循環：鼓勵病患執行主動關節活動或協助執行被動關節活動，以增加其皮膚血液循環","增加皮膚適度循環：避免按摩骨突處或皮膚發紅部位，以避免組織代謝及耗氧量增加，導致皮膚缺血壞死的情形更加嚴重"],"s":"5.9.1.6.8 處理方法（c、d）","p":184,"p2":184,"h":"兩項標題均為紅色標示。"},{"i":"sbpp2bi","u":"u59","t":"r","q":"試述失禁性皮膚炎的預防照護。","y":["失禁情況的發生應先諮詢醫療專業人員並找出相關原因，針對原因改善失禁的發生，並選用不回滲的尿片","皮膚清潔：每一次排泄後，使用清水或微酸性清潔劑輕柔的清潔皮膚；避免用力磨擦和擦洗皮膚；亦可使用乾洗潔膚液","皮膚滋潤：使用凡士林或乳液，降低皮膚紅疹、粗慥及脫皮現象的發生；皮膚病與濕疹者應向專業醫師諮詢治療方式；亦可使用長效保濕霜"],"s":"5.9.1.6.8 處理方法（e 失禁性皮膚炎預防照護）","p":185,"p2":185,"h":"失禁性皮膚炎常是加重皮膚破損的主因之一。"},{"i":"s1747d3c","u":"u59","t":"r","q":"試列出坐墊的功能及各類坐墊的優缺點。","y":["功能：預防壓瘡；改善坐姿；減輕臀部在坐時所受的壓力","乳膠坐墊：優點——較輕、較耐用；缺點——較難清理、不耐用、透氣度（濕度）較差、散熱度較差、壓力分佈不均","充氣坐墊：優點——透氣度（濕度）較好、散熱度較好、可調節壓力分佈、易清理；缺點——價錢較貴、容易被刺穿、需經常保養及調節、對轉移較不穩定","啫喱坐墊：優點——散熱度較好、較容易清理；缺點——會刺穿、重、透氣度（濕度）較差、對轉移較不穩定","充氣水泡（已棄用，但市面上仍可見有出售）：優點——價錢平；缺點——沒有分散壓力（只是轉移壓力位置）"],"s":"5.9.2.1.1 坐墊","p":186,"p2":186,"h":"「減壓用品」及「坐墊」標題為紅色標示。其他減壓用品：氣墊床、護手肘套及護腳跟套。"},{"i":"se6gf4x","u":"u59","t":"r","q":"試述氣墊床（Air Mattress／Ripple bed）的特點及使用要點。","y":["特點：減壓效果良好；使用電源，可以長期開動","使用氣墊床應預先充氣","每天檢查氣墊床充氣量是否正常：若身體會直接壓迫到床板（墊）時，應調高充氣量；充氣條過硬時，則調低充氣量","充氣管應置於床尾，並依病人體重調整充氣條","發現無法充氣或塌陷情形，需聯絡維修","留意床欄高度是否仍然合適"],"s":"5.9.2.1.2 氣墊床","p":187,"p2":187,"h":"「氣墊床」及「護手肘套及護腳跟套」標題為紅色標示。"},{"i":"svvhqrh","u":"u59","t":"g","q":"試列出臥姿及坐姿時常見的壓瘡位置。","y":["臥姿：頭（後枕、耳朵）","臥姿：肩膀、肩胛骨","臥姿：手肘","臥姿：骶骨、髖粗隆","臥姿：膝蓋內及外側、腳踝內及外側、腳跟","坐姿：後枕","坐姿：肩胛骨","坐姿：手肘","坐姿：骶骨、坐骨","坐姿：腳跟、腳前掌"],"s":"5.9.1.6.3–5.9.1.6.4 常見壓瘡位置","p":182,"p2":183,"h":"兩節在筆記中均為綠色標示（MC 範圍）；亦適合用作 SQ 練習。"},{"i":"sw7vzvn","u":"u59","t":"g","q":"試列出壓瘡的四個階段。","y":["第一階段：受壓的部位，皮膚表面完好，但出現不變淡的紅斑，此乃受傷潰瘍的先兆；皮膚變色、發熱和變硬，都屬於預警訊號","第二階段：部分皮層受損（表皮和真皮），皮膚有淺表性潰瘍，外形似擦傷，有水和淺坑狀傷口","第三階段：整個皮層受損，皮下組織壞死，傷口幾達筋膜；潰瘍部位形成深坑，但旁邊組織結構可能未完全摧毀","第四階段：整個皮層受損，廣泛面積受累，皮下組織壞死，肌肉、筋腱、關節和骨骼等的支撐結構受到牽連，傷口有管和竇道"],"s":"5.9.1.6.5 壓瘡的階段","p":183,"p2":183,"h":"「第一階段」為綠色標示；其餘階段建議一併記住。"},{"i":"s7lha5z","u":"u59","t":"n","q":"試列出預防壓瘡的注意事項。","y":["定期檢查皮膚狀況及留意引致壓瘡之因素","評估患上壓瘡之風險，以加強預防措施","鼓勵或協助長者作適量運動","無法自行移動的長者，須最少每兩小時轉換體位一次","可採用壓瘡預防輔助用具，如軟枕、氣墊床，或均壓用品如軟膠墊，放於易受壓部位","注意正確扶抱方法，及替長者轉身時減低剪切力及摩擦力","照顧者應保持短指甲及避免尖銳飾物，以免弄損長者皮膚","經常保持皮膚清潔及乾爽","切勿使用爽身粉，以免與汗液混後成為糊狀，堵塞毛孔","每天洗澡（擦澡）時以中性肥皂清潔，並檢查全身皮膚有無發紅、破皮現象","視乎情況使用乳液輕柔按摩全身，乳液可在皮膚形成一層保護膜","大小便失禁者，若發現任何排泄應盡快清潔，避免皮膚長期受刺激","保持床鋪、衣物清潔、整齊","攝取均衡營養，以吸收足夠的蛋白質及維生素","盡早下床，減少卧床時間；無法下床長者則協助每日兩次全關節運動"],"s":"5.9.2.1.4 預防壓瘡的注意事項","p":188,"p2":188,"h":"共 15 項（a–o），不必逐字背誦，按「壓力、皮膚護理、營養及活動」歸類記憶。"},{"i":"s1n0i2ay","u":"u59","t":"n","q":"試述深層靜脈血栓的成因、徵狀及處理方法。","y":["徵狀：患肢腫脹、疼痛；血液回流受阻導致患肢遠端靜脈曲張；偶因血栓脫落而造成肺栓塞","成因：靜脈血流緩滯（大手術後、長期臥床、心力衰竭、腹腔壓力增高）；血凝機會增高（創傷、燒傷、分娩、嚴重脫水、癌症、藥物副作用、感染等）","處理：避免長時間保持同一姿勢；鼓勵在床上多作下肢運動並作深呼吸及咳嗽動作；避免長時間坐下，坐時雙腿抬高，每隔半小時步行數分鐘","處理：不要交叉腳坐；避免穿著襪帶、緊身腰帶及褲或緊身膝絲襪；保持大便通暢；起床前穿上彈性襪，睡覺前除下；適當運動，保持適當體重","遵醫囑服用薄血藥；如有血便、皮膚紫斑、牙齦出血、流鼻血、割傷後流血不止、瘀斑面積擴大，應即與病房護士聯絡或到急症室"],"s":"5.9.1.1 深層靜脈血栓","p":177,"p2":178,"h":"足踝運動（Ankle-Toe-Exercise）及壓力襪／管亦有助預防；助理負責穿著壓力襪及協助定時檢查，量度尺碼由治療師負責。"},{"i":"s1o70arp","u":"u59","t":"n","q":"試列出長期卧床及缺乏活動的常見後遺症及其處理方法。","y":["深層靜脈血栓：避免長時間同一姿勢、床上下肢運動、穿彈性襪、適當運動","肌肉萎縮：進行阻力訓練","肌張力上升：經常進行伸展訓練","肌肉攣縮：經常進行伸展訓練；透過電類治療減低肌肉緊張","關節僵硬：經常進行關節活動訓練及伸展運動","壓瘡：避免長時間壓迫皮膚、皮膚清潔及檢視、預防摩擦力及剪力、增加皮膚循環","心肺功能減弱（墜積性肺炎）：心肺功能訓練、呼吸訓練","穿衣及清潔困難：關節活動訓練、伸展運動、阻力訓練","便秘：增加涉及腹部活動的運動，藉增加腹腔壓力刺激腸蠕動"],"s":"5.9.1 常見長期卧床及缺乏活動的後遺症","p":177,"p2":185,"h":"可用作整單元的總結表：後遺症 → 處理方法。","pt":"第 177-185 頁（各項後遺症及處理方法）"}];

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(sec){var m=Math.floor(sec/60),s=sec%60;return(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function rng(seed){var a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;var t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function wsample(list,wf,k,r){
  var keyed=list.map(function(x){return{x:x,k:Math.pow(r(),1/wf(x))};});
  keyed.sort(function(a,b){return b.k-a.k;});
  return keyed.slice(0,k).map(function(o){return o.x;});
}
function ids(a){return a.map(function(q){return q.i;});}
function optsOf(q){if(!q._o){var o=q.w.slice();o.splice(q.a,0,q.c);q._o=o;}return q._o;}
function pageStr(p,p2){return '第 '+p+((p2&&p2!==p)?'–'+p2:'')+' 頁';}
function wrongIds(){return Object.keys(mem.wrong).filter(function(id){return MCBY[id];});}
function sqNeed(){return Object.keys(mem.sq).filter(function(id){return SQBY[id]&&mem.sq[id]<=1;});}
function cur(){return S.session.items[S.session.idx];}
function hasMC(s){return s.items.some(function(it){return it.k==='mc';});}
function canReveal(s){return s.mode==='practice'||!!s.end||!hasMC(s);}
function isDone(it){return it.k==='mc'?it.picked!==null:(it.shown||it.rate!==null||it.text.replace(/\s/g,'')!=='');}

/* ---------- mock papers ---------- */
function makePaper(seed,exMC,exSQ){
  var r=rng(seed),mc=[],sq=[];
  UORDER.forEach(function(g){
    var pool=BANK_MC.filter(function(q){return q.u===g&&!exMC[q.i];});
    mc=mc.concat(wsample(pool,function(q){return(q.t==='g'||q.t==='o')?3:1;},QUOTA[g],r));
  });
  var gs=UORDER.filter(function(g){return BANK_SQ.some(function(s){return s.u===g&&!exSQ[s.i];});});
  for(var n=0;n<3&&gs.length;n++){
    var g=wsample(gs,function(x){return SQW[x];},1,r)[0];
    gs=gs.filter(function(x){return x!==g;});
    var sp=BANK_SQ.filter(function(s){return s.u===g&&!exSQ[s.i];});
    sq.push(wsample(sp,function(s){return(s.t==='r'||s.t==='o')?3:1;},1,r)[0]);
  }
  sq.sort(function(a,b){return UORDER.indexOf(a.u)-UORDER.indexOf(b.u);});
  return{mc:ids(mc),sq:ids(sq)};
}
var PAPERS=null;
function paperSet(name){
  if(!PAPERS){
    var A=makePaper(101,{},{});
    var exM={},exS={};A.mc.forEach(function(i){exM[i]=1;});A.sq.forEach(function(i){exS[i]=1;});
    var B=makePaper(202,exM,exS);
    B.mc.forEach(function(i){exM[i]=1;});B.sq.forEach(function(i){exS[i]=1;});
    var C=makePaper(303,exM,exS);
    PAPERS={A:A,B:B,C:C};
  }
  return PAPERS[name];
}

/* ---------- session ---------- */
function buildItems(mcIds,sqIds){
  var p=mem.prefs;
  var m=p.shuffleQ?shuffle(mcIds):mcIds.slice();
  var s=p.shuffleQ?shuffle(sqIds):sqIds.slice();
  var items=m.map(function(id){
    var q=MCBY[id];
    var order=p.shuffleO?shuffle([0,1,2,3]):[0,1,2,3];
    return{k:'mc',id:id,order:order,a:order.indexOf(q.a),picked:null,flagged:false};
  });
  s.forEach(function(id){items.push({k:'sq',id:id,text:'',shown:false,rate:null,flagged:false});});
  return items;
}
function startSet(cfg){
  var mode=cfg.mode||mem.prefs.mode;
  S.session={title:cfg.title,tag:cfg.tag||'',paper:!!cfg.paper,mode:mode,cfg:cfg,items:buildItems(cfg.mc||[],cfg.sq||[]),idx:0,start:Date.now(),end:null};
  S.view='quiz';S.navOpen=false;S.modal=null;
  startTimer();render();window.scrollTo(0,0);
}
function startTimer(){
  stopTimer();
  S.timerId=setInterval(function(){
    var el=document.getElementById('timer');
    if(el&&S.session&&!S.session.end)el.textContent=fmt(Math.floor((Date.now()-S.session.start)/1000));
  },1000);
}
function stopTimer(){if(S.timerId){clearInterval(S.timerId);S.timerId=null;}}

function pick(i){
  if(S.view!=='quiz'||S.modal)return;
  var s=S.session,it=cur();
  if(it.k!=='mc'||i<0||i>3)return;
  if(s.mode==='practice'){
    if(it.picked!==null)return;
    it.picked=i;
    if(i!==it.a)mem.wrong[it.id]=1;
    else if(s.tag==='wrong')delete mem.wrong[it.id];
    save();
  }else{
    it.picked=(it.picked===i)?null:i;
  }
  render();
}
function go(n){
  var s=S.session;
  if(n<0||n>=s.items.length)return;
  s.idx=n;render();window.scrollTo(0,0);
}
function flag(){var it=cur();it.flagged=!it.flagged;render();}
function tally(s){
  var c=0,a=0,w=0,n=0;
  s.items.forEach(function(it){if(it.k!=='mc')return;n++;if(it.picked!==null){a++;if(it.picked===it.a)c++;else w++;}});
  return{c:c,a:a,w:w,n:n,u:n-a};
}
function openSubmit(){
  var s=S.session,t=tally(s);
  var un=s.items.filter(function(x){return x.k==='mc'&&x.picked===null;}).length;
  var fl=s.items.filter(function(x){return x.flagged;}).length;
  var sqn=s.items.filter(function(x){return x.k==='sq';}).length;
  if(s.mode==='practice'&&un===0){finish();return;}
  var body='';
  if(t.n)body+='MC 共 '+t.n+' 題，'+(un?'尚有 '+un+' 題未作答':'全部已作答');
  if(sqn)body+=(body?'；':'')+'SQ 共 '+sqn+' 題（不計分）';
  if(fl)body+='；'+fl+' 題已標記';
  body+='。'+(s.mode==='exam'?'交卷後會顯示分數，並可對答案。':'未作答的 MC 不計分。');
  S.modal={title:s.mode==='exam'?'確定交卷？':'完成並查看結果？',body:body,actions:[{label:'繼續作答',act:'closeModal'},{label:s.mode==='exam'?'確定交卷':'查看結果',act:'finish',pri:1}]};
  render();
}
function finish(){
  var s=S.session;
  s.end=Date.now();
  if(s.mode==='exam'){
    s.items.forEach(function(it){
      if(it.k!=='mc'||it.picked===null)return;
      if(it.picked!==it.a)mem.wrong[it.id]=1;
      else if(s.tag==='wrong')delete mem.wrong[it.id];
    });
  }
  var t=tally(s);
  if(t.n>0&&t.a>0){
    mem.history.unshift({t:Date.now(),title:s.title,mode:s.mode,c:t.c,n:t.n,a:t.a,sec:Math.round((s.end-s.start)/1000)});
    mem.history=mem.history.slice(0,30);
  }
  save();stopTimer();
  S.modal=null;S.view='result';S.rfilter='all';
  render();window.scrollTo(0,0);
}

/* ---------- html helpers ---------- */
function tierTag(t){return '<span class="tag t-'+t+'">'+TIERLAB[t]+'</span>';}
function locHTML(x){
  var h='<dl class="loc"><div><dt>課本位置</dt><dd>'+esc(GL[x.u])+'　'+esc(x.s)+'</dd></div><div><dt>頁數</dt><dd>'+(x.pt||pageStr(x.p,x.p2))+'</dd></div>';
  if(x.k)h+='<div><dt>工作紙</dt><dd>'+esc(x.k)+'</dd></div>';
  if(x.v)h+='<div><dt>原文</dt><dd class="src">'+esc(x.v)+'</dd></div>';
  return h+'</dl>';
}
function rateHTML(it,idx){
  var h='<div class="rate"><span class="rate-l">自我評估（不計分）</span><div class="seg">';
  [[2,'答得好'],[1,'答到一部分'],[0,'要重溫']].forEach(function(x){
    h+='<button data-act="rate" data-n="'+idx+'" data-r="'+x[0]+'" aria-pressed="'+(it.rate===x[0])+'">'+x[1]+'</button>';
  });
  return h+'</div></div>';
}
function sqAnsHTML(q,it,idx,showMine){
  var h='<div class="ans"><b class="ans-t">參考答案要點</b><p class="hint">按課本整理；考試時意思合理即可，毋須與下列文字逐字相同。</p><ul class="pts">';
  q.y.forEach(function(p){h+='<li>'+esc(p)+'</li>';});
  h+='</ul>';
  if(showMine&&it.text.replace(/\s/g,'')!=='')h+='<div class="mine"><b>你的答案</b><br>'+esc(it.text)+'</div>';
  if(q.h)h+='<p class="tipline">'+esc(q.h)+'</p>';
  h+=locHTML(q)+rateHTML(it,idx)+'</div>';
  return h;
}

/* ---------- views ---------- */
function renderHeader(){
  var h='';
  var themeLabel=mem.theme==='auto'?'自動':(mem.theme==='dark'?'深色':'淺色');
  var themeBtn='<button class="ibtn" data-act="theme" title="切換外觀" aria-label="切換外觀，目前：'+themeLabel+'">'+themeLabel+'</button>';
  if(S.view==='quiz'&&S.session){
    var s=S.session,it=cur();
    var done=s.items.filter(isDone).length;
    var secs=Math.floor(((s.end||Date.now())-s.start)/1000);
    var kind=it.k==='mc'?'MC':'SQ';
    var t=tally(s);
    var sub=(s.mode==='exam'?'考試模式':'練習模式')+'，完成 '+done+'/'+s.items.length+(s.mode==='practice'&&t.a?'，MC 對 '+t.c+'/'+t.a:'');
    h+='<div class="tb"><button class="ibtn" data-act="quit">退出</button>'
      +'<div class="grow"><div class="tb-title">第 '+(s.idx+1)+' / '+s.items.length+' 題（'+kind+'）</div>'
      +'<div class="tb-sub">'+sub+'</div></div>'
      +'<span class="timer" id="timer">'+fmt(secs)+'</span></div>'
      +'<div class="pbar"><i style="width:'+Math.round(done/s.items.length*100)+'%"></i></div>';
  }else if(S.view==='home'){
    h+='<div class="tb"><div class="brand grow"><span class="logo">PTA</span><div><div class="brand-t">物理治療助理刷題</div><div class="brand-s">ERB 基礎證書 期末筆試</div></div></div>'+themeBtn+'</div>';
  }else{
    h+='<div class="tb"><button class="ibtn" data-act="home">主頁</button><div class="grow"><div class="tb-title">'+(S.view==='result'?'測驗結果':'題解檢視')+'</div><div class="tb-sub">'+esc(S.session?S.session.title:'')+'</div></div>'+themeBtn+'</div>';
  }

}
