<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>物理治療助理期末筆試刷題</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef3f5; --surface:#ffffff; --surface2:#e6eef1; --text:#13222c; --muted:#58707c; --line:#cfdbe1;
  --brand:#0a6a86; --on-brand:#ffffff; --brand-soft:#d6ebf2;
  --ok:#1b7f47; --on-ok:#ffffff; --ok-soft:#d8f0e1;
  --bad:#bf3a2b; --on-bad:#ffffff; --bad-soft:#fbe0dc;
  --mark:#f2cf3d; --mark-soft:#fff3bf; --mark-ink:#5c4700;
  --g-bg:#d5efdc; --g-ink:#145a2d; --o-bg:#fde3c2; --o-ink:#7a4100; --r-bg:#f9d9d5; --r-ink:#8a2217;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c181e; --surface:#14252d; --surface2:#1b323c; --text:#e5eef2; --muted:#92aab5; --line:#2a4350;
    --brand:#4cc3e3; --on-brand:#04222c; --brand-soft:#12394a;
    --ok:#4fd187; --on-ok:#052b14; --ok-soft:#133823;
    --bad:#ff8574; --on-bad:#3a0a04; --bad-soft:#40201b;
    --mark:#f2cf3d; --mark-soft:#3b3410; --mark-ink:#f6e08a;
    --g-bg:#143b24; --g-ink:#8be2ac; --o-bg:#46300f; --o-ink:#f5c27a; --r-bg:#4a1f1a; --r-ink:#ffb3a7;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c181e; --surface:#14252d; --surface2:#1b323c; --text:#e5eef2; --muted:#92aab5; --line:#2a4350;
  --brand:#4cc3e3; --on-brand:#04222c; --brand-soft:#12394a;
  --ok:#4fd187; --on-ok:#052b14; --ok-soft:#133823;
  --bad:#ff8574; --on-bad:#3a0a04; --bad-soft:#40201b;
  --mark:#f2cf3d; --mark-soft:#3b3410; --mark-ink:#f6e08a;
  --g-bg:#143b24; --g-ink:#8be2ac; --o-bg:#46300f; --o-ink:#f5c27a; --r-bg:#4a1f1a; --r-ink:#ffb3a7;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"PingFang HK","PingFang TC","Noto Sans HK","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.6;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,h2,h3,p,dl,dd,dt,ul,ol{margin:0}
.serif{font-family:"Noto Serif HK","Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU","MingLiU",serif}

#topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:31;background:var(--surface);border-bottom:1px solid var(--line)}
.tb{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px}
.tb .grow{flex:1;min-width:0}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;font-size:.82rem;letter-spacing:.02em}
.brand-t{font-weight:700;line-height:1.2}
.brand-s{font-size:.78rem;color:var(--muted);line-height:1.2}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:40px;min-width:40px;padding:0 12px;font-size:.9rem}
.pbar{height:4px;background:var(--surface2)}
.pbar i{display:block;height:100%;background:var(--brand);transition:width .25s}
.tb-title{font-weight:700;line-height:1.25}
.tb-sub{font-size:.8rem;color:var(--muted);line-height:1.25}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:.95rem}

.wrap{max-width:780px;margin:0 auto;padding:16px 14px 28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.card.tight{padding:12px}
.h-sec{font-size:1.05rem;font-weight:700;margin:22px 2px 10px}
.muted{color:var(--muted)}
.small{font-size:.86rem}

.hero{padding:6px 2px 14px}
.hero h1{font-size:1.5rem;line-height:1.35;font-weight:800}
.hero p{color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
@media (min-width:520px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.3rem;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}

.seg-row{display:flex;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.seg-row .lab{width:64px;font-size:.9rem;color:var(--muted)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;min-height:40px;font-size:.92rem}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);font-weight:600}
.hint{font-size:.84rem;color:var(--muted);margin-top:4px}

details.card summary{cursor:pointer;font-weight:600}
details.card[open] summary{margin-bottom:12px}
.legend-card .row{display:flex;gap:10px;align-items:baseline;margin:0 0 6px}
.legend-card .row:last-child{margin:0}
.legend-card .row .tag{flex:0 0 auto}

.set{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px}
.set:hover{border-color:var(--brand)}
.set .n{flex:0 0 auto;min-width:54px;text-align:center;font-size:1.3rem;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums;line-height:1.1}
.set .n small{display:block;font-size:.72rem;font-weight:500;color:var(--muted)}
.set .m{flex:1;min-width:0}
.set .m b{display:block}
.set .m span{font-size:.86rem;color:var(--muted)}
.set[disabled]{opacity:.5;cursor:not-allowed}
.set.feature{border:2px solid var(--brand)}
.papers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 10px}
.papers .set{margin:0;flex-direction:column;align-items:flex-start;gap:4px}
.papers .set .n{text-align:left;min-width:0;font-size:1.05rem}
@media (min-width:560px){.papers{grid-template-columns:repeat(4,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;font-size:.92rem}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip em{font-style:normal;color:var(--muted);font-size:.82rem;margin-left:4px}
.chip[aria-pressed="true"] em{color:inherit;opacity:.85}
.sub-h{font-size:.9rem;color:var(--muted);margin:14px 2px 8px}

.hist{width:100%;border-collapse:collapse;font-size:.92rem}
.hist td{padding:8px 4px;border-bottom:1px solid var(--line)}
.hist tr:last-child td{border-bottom:0}
.hist .sc{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.86rem;padding:8px 2px}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tag{font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.alt{background:var(--brand-soft);color:var(--brand)}
.tag.warn{background:var(--mark-soft);color:var(--mark-ink)}
.tag.t-g{background:var(--g-bg);color:var(--g-ink)}
.tag.t-o{background:var(--o-bg);color:var(--o-ink)}
.tag.t-r{background:var(--r-bg);color:var(--r-ink)}
.qno{display:flex;gap:12px;align-items:flex-start}
.qno .num{flex:0 0 auto;font-weight:800;font-size:1.15rem;color:var(--brand);font-variant-numeric:tabular-nums;line-height:1.7;min-width:2.1em}
.qtext{font-size:1.14rem;line-height:1.7;font-weight:600;margin:0 0 16px}

.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;margin:0 0 10px;line-height:1.55}
.opt .k{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:.82rem;color:var(--muted);background:transparent}
.opt:hover .k{border-color:var(--brand);color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .k{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .k{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.opt.dim{opacity:.62}
.opt[aria-disabled="true"]{cursor:default}
.exp{border-radius:12px;padding:12px 14px;margin-top:4px;border-left:5px solid var(--muted);background:var(--surface2)}
.exp.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.exp.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.exp>b{display:block;margin-bottom:2px}
.exp>p{font-size:.95rem}

.loc{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:.9rem}
.loc>div{display:flex;gap:10px;margin:0 0 4px}
.loc dt{flex:0 0 4.2em;color:var(--muted)}
.loc dd{flex:1;min-width:0}
.loc dd.src{border-left:3px solid var(--line);padding-left:10px;color:var(--text);opacity:.9}

.lab{display:block;font-size:.86rem;color:var(--muted);margin:0 0 6px}
.ta{display:block;width:100%;min-height:9em;resize:vertical;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);line-height:1.6}
.ta:focus{border-color:var(--brand)}
.ans{margin-top:14px;border-radius:12px;padding:14px;border-left:5px solid var(--brand);background:var(--brand-soft)}
.ans-t{display:block}
.mine{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--surface);white-space:pre-wrap;font-size:.92rem}
.pts{margin:8px 0 0;padding-left:1.3em}
.pts li{margin:0 0 5px;line-height:1.6}
.tipline{margin-top:8px;font-size:.9rem}
.rate{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rate-l{font-size:.86rem;color:var(--muted)}
.rate .seg{background:var(--surface)}

.wrap.inquiz{padding-bottom:0}
.actions{position:sticky;bottom:0;z-index:25;margin:0 -14px;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.actions .in{display:flex;gap:8px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:46px;padding:0 14px;font-weight:600;white-space:nowrap}
.actions .btn.flex{padding:0 6px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.flex{flex:1}
.btn.wide{flex:1.6}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.mark[aria-pressed="true"]{background:var(--mark-soft);border-color:var(--mark);color:var(--mark-ink)}
.btn.block{width:100%;margin:0 0 10px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.cell{position:relative;min-height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:50%;font-weight:700;font-variant-numeric:tabular-nums;aspect-ratio:1}
.cell.sq{border-radius:12px}
.cell.ans{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.cell.ok{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.cell.bad{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.cell.cur{outline:3px solid var(--text);outline-offset:2px}
.cell.flag::after{content:"";position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:var(--mark);border:2px solid var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin-top:10px}

.score{text-align:center;padding:8px 0 4px}
.score .big{font-size:3.2rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.score .big small{font-size:1.2rem;color:var(--muted);font-weight:600}
.verdict{display:inline-block;margin-top:8px;padding:4px 16px;border-radius:999px;font-weight:700}
.verdict.pass{background:var(--ok-soft);color:var(--ok)}
.verdict.fail{background:var(--bad-soft);color:var(--bad)}
.bars{display:grid;gap:12px;margin-top:6px}
.bar-h{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;margin-bottom:4px}
.bar-t{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--brand)}
.bar-t i.low{background:var(--bad)}
.bar-t i.hi{background:var(--ok)}
.rv-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:.9rem;flex-wrap:wrap}
.st{font-weight:700}
.st.ok{color:var(--ok)}
.st.bad{color:var(--bad)}
.st.na{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
.foot{font-size:.8rem;color:var(--muted);text-align:center;margin-top:18px}
.sqlist{margin:8px 0 0;padding-left:1.3em}
.sqlist li{margin:0 0 6px}

#modal .ov{position:fixed;inset:0;z-index:50;background:rgba(5,15,20,.55);display:grid;place-items:center;padding:20px}
#modal .box{background:var(--surface);border:1px solid var(--line);border-radius:16px;max-width:420px;width:100%;padding:20px}
#modal h3{font-size:1.1rem;margin-bottom:8px}
#modal .row{display:flex;gap:10px;margin-top:16px}
@media (prefers-reduced-motion: reduce){.pbar i{transition:none}}
@media (max-width:380px){.seg button{padding:8px 10px}}
</style>
</head>
<body>
<header id="topbar"></header>
<main id="app" class="wrap"></main>
<div id="modal"></div>
<noscript><p style="padding:16px">此頁面需要啟用 JavaScript 才能使用。</p></noscript>
<script>

var BANK_MC=[{"i":"m19p5yt6","u":"u1","t":"g","q":"「物理治療」的理論基礎源自哪一種醫學？","c":"西方醫學","w":["中醫學","印度草藥學","營養學"],"a":1,"e":"「物理治療」源自西方醫學的理論基礎；又由於中西醫療合璧，業界會考慮採用有醫學實證的治療方法（例如中醫的針灸）。","s":"1.1.1 物理治療服務的歷史及簡介","p":1,"v":"源自西方醫學的理論基礎"},{"i":"m13jfs5u","u":"u1","t":"g","q":"第一次世界大戰之後，西方醫療認為需要發展一種輔助醫療，主要是為了幫助哪類人士「復康」？","c":"戰爭創傷的人士","w":["先天殘疾的兒童","長期病患的長者","運動創傷的運動員"],"a":2,"e":"課本指第一次世界大戰之後，西方醫療認為需要發展輔助醫療來幫助戰爭創傷人士「復康」，並一直發展至今天。","s":"1.1.1 物理治療服務的歷史及簡介","p":1,"v":"來幫助戰爭創傷的人士"},{"i":"m1ir5x7q","u":"u1","t":"n","q":"第一所物理治療學校於哪個國家成立？","c":"英國","w":["美國","德國","中國"],"a":3,"e":"課本 1.1.1：第一所物理治療學校於英國成立。","s":"1.1.1 物理治療服務的歷史及簡介","p":1,"v":"第一所物理治療學校於英國成立"},{"i":"mtalqys","u":"u1","t":"g","q":"關於物理治療的特點，下列何者正確？","c":"屬非藥物治療，沒有藥物的副作用，並著重以運動幫助病人康復","w":["以藥物治療為主，運動只屬輔助，故會有藥物副作用","只適用於肌肉骨骼疾病，完全不涉及呼吸系統的病人","完全依賴儀器治療，並不涉及運動及病人的參與"],"a":0,"e":"物理治療利用人體生理對物理刺激所作出的反應來達到治療目的，同時著重以運動幫助病人康復；亦包括較少人認識的「呼吸系統方面的物理治療」。","s":"1.1.1 物理治療服務的歷史及簡介","p":1,"v":"物理治療是建基於醫學的非藥物治療方法之一，故沒有藥物的副作用"},{"i":"mej6x0m","u":"u1","t":"g","q":"課本介紹物理治療會採用「有醫學實證」的治療方法，並以圖示列出「研究」的元素。下列何者與圖示相符？","c":"實驗、數據、統計分析","w":["個人經驗、口碑、廣告宣傳","診斷、處方、手術","傳統習慣、師徒相傳、病人意見"],"a":1,"e":"課本第 1 頁圖示：「研究」包含實驗、數據及統計分析，說明醫學實證建基於研究證據。","s":"1.1.1 物理治療服務的歷史及簡介","p":1,"v":"圖示：研究 → 實驗、數據、統計分析"},{"i":"m1fsufhn","u":"u1","t":"g","q":"物理治療助理在機構中的主要工作是：","c":"協助物理治療師進行復康治療，例如帶領治療小組及執行簡單復康運動","w":["獨立診斷病人，並為病人制訂整套治療計劃及目標","向病人詮釋治療師的檢查結果，並解釋其康復進度","處方藥物及決定治療方案，再自行執行有關治療"],"a":0,"e":"助理是協助者：不應替病人檢察、診斷或提供建議，亦不得在沒有治療師同意下執行治療（1.3.2）。","s":"1.1.2 行業市場概況及趨勢","p":1,"v":"協助物理治療師進行復康治療工作，例如帶領治療小組及執行簡單的復康運動"},{"i":"m1gian3o","u":"u1","t":"n","q":"現時物理治療行業最多的職位空缺來自：","c":"社福機構","w":["公營醫院","私營醫院","私營物理治療診所"],"a":3,"e":"課本 1.1.2：現時行業最多的職位空缺是來自於社福機構。","s":"1.1.2 行業市場概況及趨勢","p":1,"v":"現時行業最多的職位空缺是來自於社福機構"},{"i":"m86poqn","u":"u1","t":"n","q":"關於註冊規定，下列何者正確？","c":"物理治療師及職業治療師須依輔助醫療業條例註冊，助理則暫不受監管","w":["物理治療助理亦須依輔助醫療業條例註冊，否則不能受聘","只有物理治療師須註冊，職業治療師及助理均毋須註冊","物理治療師、職業治療師及助理均完全不受任何法例監管"],"a":2,"e":"課本指助理職位暫不受法例監管，但這類工作與生命健康有關，在未受相關訓練的情況下並不適宜。","s":"1.1.2 行業市場概況及趨勢","p":1,"v":"需在香港輔助醫療業條例下註冊，而從事助理職位，則暫不受法例監管"},{"i":"m153avzu","u":"u1","t":"g","q":"下列哪項屬於物理治療助理作為「物理治療師的協助者」的角色？","c":"在物理治療師為病人進行儀器治療時，擔任助手的角色","w":["替病人作出診斷及提供建議","自行決定病人的運動及治療安排","只負責接待及文件工作，毋須協助執行治療"],"a":1,"e":"助理須準確及有效率地協助執行治療，並非只進行接待及文件工作；診斷、建議及安排治療則不屬助理的工作範圍。","s":"1.2.1.1 復康治療上的角色（c 物理治療師的協助者）","p":5,"v":"在物理治療師為病人進行儀器治療時，擔任助手的角色"},{"i":"ma0ylie","u":"u1","t":"g","q":"病人的朋友致電助理，查詢某病人的病情。助理最適當的做法是：","c":"未得病人同意，不向對方透露病人的任何資料","w":["核對對方身份後，簡單講述病情","只透露診斷，不講治療內容","請對方向同房的其他病人查詢"],"a":3,"e":"工作守則：尊重病人的私隱，未得病人同意下，不得向其他人士透露病人的任何資料。","s":"1.3.2 工作守則（作為病人的照顧者）","p":8,"v":"尊重病人的私隱，未得病人同意下，不得向其他人士透露病人的任何資料","sc":1},{"i":"mbpru4t","u":"u1","t":"o","q":"公營醫院「二級病人服務助理（物理治療部）」(PCA II) 的入職學歷要求是：","c":"中五程度","w":["小六程度","中三程度或以上","大專程度"],"a":2,"e":"PCA II：中五程度、流利粵語、中英文讀寫、懂電腦、能應付體力勞動、具物理治療或護理經驗；持物理治療助理證書可獲優先考慮。PCA III 為小六程度；復康機構等為中三程度或以上。","s":"1.1.4 各服務單位之入職要求","p":4,"v":"公營醫院：二級病人服務助理（物理治療部）(PCA II)，中五程度，起薪點 $18-25K"},{"i":"m18ykwoh","u":"u1","t":"o","q":"公營醫院「三級病人服務助理（物理治療部）」(PCA III) 的入職學歷要求是：","c":"小六程度","w":["中五程度","中三程度或以上","大專程度"],"a":0,"e":"PCA III：小六程度、具物理治療或護理之工作經驗、能操流利粵語及書寫中文、能閱讀及明白簡單英文，起薪點 $15-16K。","s":"1.1.4 各服務單位之入職要求","p":4,"v":"公營醫院：三級病人服務助理（物理治療部）(PCA III)，小六程度，起薪點 $15-16K"},{"i":"m141exav","u":"u1","t":"o","q":"在復康機構、安老院舍或特殊學校擔任治療助理，「外展職位」的起薪點約為：","c":"$13-15K","w":["$11-13K","$10-13K","$18-25K"],"a":0,"e":"復康機構／安老院舍／特殊學校：非外展職位 $11-13K，外展職位 $13-15K（視乎經驗而定）。物理治療診所為 $10K-13K；公營醫院 PCA II 為 $18-25K。","s":"1.1.4 各服務單位之入職要求","p":4,"v":"復康機構／安老院舍／特殊學校：非外展職位 $11-13K；外展職位 $13-15K"},{"i":"m1ss8ci2","u":"u1","t":"o","q":"關於私營醫院物理治療助理的入職要求，下列何者正確？","c":"中五程度，持物理治療助理證書，並具不少於兩年相關工作經驗","w":["中三程度，持物理治療助理證書，毋須任何工作經驗","小六程度，持有證書者可獲優先考慮，毋須工作經驗","須為註冊物理治療師，並具不少於兩年工作經驗"],"a":1,"e":"私營醫院：中五程度、持有物理治療助理證書、流利廣東話及良好英語／普通話、懂電腦、良好溝通及顧客服務態度、能應付體力勞動、具不少於兩年相關經驗；起薪點 $15-19K。","s":"1.1.4 各服務單位之入職要求","p":4,"v":"具不少於兩年物理治療或護理之工作經驗"},{"i":"m4cje1m","u":"u1","t":"n","q":"下列哪項是私營診所內，物理治療助理工作的特點？","c":"較少體能上的需求，有文書工作，工作時間較長或需輪班","w":["較大體能上的需求，少量文書工作，無需夜班，工作時間較穩定","中等程度的體能需求，有文書工作，工作時間按服務需要而定","毋須接待病人，亦毋須處理預約及收銀工作"],"a":2,"e":"私營診所助理主要協助治療師準備治療、接待病人（包括預約、收銀工作）及清潔檢查儀器。「較大體能上的需求，少量文書…」描述醫院；「中等程度的體能需求，有文書…」描述非政府機構（NGO）。","s":"1.1.3.3 私營診所","p":3,"v":"較少體能上的需求"},{"i":"mi52cwl","u":"u1","t":"o","q":"關於「性罪行定罪紀錄查核」機制，下列何者正確？","c":"由合資格申請人自願向警務處提出，並須出示僱主證明文件","w":["由僱主強制代員工向警務處申請，員工毋須出示任何文件","涵蓋私人補習導師及志願工作者，並須由僱主批准","只適用於在醫院工作的人員，並須由醫院管理局申請"],"a":3,"e":"查核申請須由合資格申請人自願向警務處性罪行定罪紀錄查核辦事處提出，並出示僱主證明文件；機制並不涵蓋私人補習導師及志願工作者。","s":"1.3.3.5 「性罪行定罪紀錄查核」機制","p":11,"v":"自願向警務處性罪行定罪紀錄查核辦事處提出。申請人必須出示有關僱主發出的證明文件"},{"i":"m19oap54","u":"u1","t":"n","q":"構成「疏忽」的三個基本因素是：","c":"照顧責任、失責、造成損失","w":["故意傷害、失責、賠償","照顧責任、保密、造成損失","失責、取得同意、造成損失"],"a":2,"e":"疏忽三要素：①照顧責任（負有法律承認的謹慎責任）；②失責（謹慎程度低於一般被接受的標準）；③造成損失（失責與損害有因果關係，且非原告人自己疏忽所致）。","s":"1.3.3.1 疏忽","p":9,"v":"構成疏忽的基本因素"},{"i":"mccmsrx","u":"u1","t":"n","q":"下列哪項是物理治療助理在工作守則上「不應」做的事？","c":"在沒有治療師同意下，為病人執行治療","w":["與治療師保持良好溝通","尊重病人私隱","發現問題時立即暫停並向上司報告"],"a":1,"e":"助理不應替病人安排或建議任何運動及治療，亦不得在沒有治療師同意下執行治療；須尊重治療師安排並保持良好溝通。","s":"1.3.2 工作守則（作為物理治療師的協助者）","p":8,"v":"不得在沒有治療師同意下執行治療"},{"i":"m16nkjbm","u":"u1","t":"n","q":"根據性別歧視條例，「性騷擾」的重點是：","c":"提出不受歡迎的性要求，或作出涉及性的行徑或陳述","w":["只包括身體接觸，不包括言語、動作或展示物件","只限上司對下屬作出的行為，同事之間不算","對方須明確拒絕三次後，有關行為才算成立"],"a":0,"e":"定義：提出不受歡迎的性要求或作出涉及性的行徑或陳述；範圍包括身體接觸、言語、動作，以及展示或傳閱色情刊物／物件。","s":"1.3.3.2 性別歧視條例－性騷擾","p":9,"v":"提出不受歡迎的性要求或作出涉及性的行徑或陳述"},{"i":"mb368c6","u":"u1","t":"n","q":"病人問助理：「我的復康進度理想嗎？是否康復得比較慢？」助理最適當的回應是：","c":"說明分析復康進度是治療師的責任，請病人向治療師查詢","w":["憑自己的經驗，詳細分析病人的進度並給予預測","自行向病人解釋治療師的檢查結果及其意義","建議病人自行加強運動量，以加快康復進度"],"a":3,"e":"講解分析復康進度是治療師的責任；助理應與治療師充分溝通及合作，以達致一致態度，避免對病人造成不必要的誤會。","s":"1.3.1 基本道德原則（b）","p":8,"v":"講解分析復康進度是治療師的責任","sc":1},{"i":"m1dmbq1e","u":"u1","t":"n","q":"按課本，物理治療助理每日的工作時間及每星期的工作天數約為：","c":"每日 9-10 小時；每星期 5-6 天","w":["每日 6-7 小時；每星期 5 天","每日 8 小時；每星期 4 天","每日 12 小時；每星期 7 天"],"a":1,"e":"工作大綱：工作時間 9-10 小時，每星期 5-6 天工作，輪班輪休（視乎工作單位而定）。","s":"1.2.3.1 工作時間","p":6,"v":"9-10小時"},{"i":"m1uu5v7u","u":"u1","t":"n","q":"下列哪項屬於助理可協助治療師提供的「簡單治療」？","c":"熱敷、冰敷及蠟療","w":["針灸及手力治療","獨立設定超聲波的強度及頻率","決定衝擊波的治療方案"],"a":3,"e":"助理職責（治療工作）：協助物理治療師為病人提供簡單治療，如熱敷、冰敷及蠟療等，並清楚每個治療程序及提供協助。","s":"1.2.2.1 治療工作","p":5,"v":"協助物理治療師為病人提供簡單治療，如熱敷、冰敷及蠟療等"},{"i":"mf35mw1","u":"u1","t":"n","q":"按「個人資料（私隱）條例」的保障資料原則，涉及「查閱個人資料（查詢；申請；更正）」的是：","c":"第六原則","w":["第一原則","第四原則","第五原則"],"a":0,"e":"第一原則：收集目的及方式；第二原則：準確性及保留期間；第四原則：資料保安；第五原則：資料使用者須公開有關政策及實務；第六原則：查閱個人資料。","s":"1.3.3.3 保密","p":9,"v":"第六原則查閱個人資料"},{"i":"m7vbgz5","u":"u2","t":"g","q":"物理治療主要藉著自然界中的「物理因子」來治療。下列哪一組屬於物理因子？","c":"電、聲、光、水、冷、熱力","w":["藥物、針劑、手術、疫苗","營養、睡眠、情緒、環境","遺傳、年齡、性別、種族"],"a":2,"e":"物理治療藉自然界中的物理因子（電、聲、光、水、冷、熱力等）及人體生理學原理，施予非侵入性、非藥物性的治療。","s":"2.1.4 物理治療的媒介","p":13,"v":"物理因子（電、聲、光、水、冷、熱力等）"},{"i":"m4jhdp9","u":"u2","t":"g","q":"「以人體結構、力學、生理學和病理學為基本，讓病人通過不同形式的運動來強化肌肉、增加關節活動、改善協調及平衡」的治療方法是：","c":"運動治療","w":["電療法","手力治療","水療"],"a":0,"e":"運動治療例子：伸展運動、阻力運動及帶氧運動，目的是增強心肺功能、舒展筋肌、活動關節。","s":"2.1.5.1 運動治療","p":13,"v":"以人體結構、力學、生理學和病理學為基本的治療方法"},{"i":"m1s2paol","u":"u2","t":"g","q":"「利用高、中、低頻率的直流或交流電（如微電流、干擾波）」的治療方法稱為：","c":"電療法","w":["光學治療","聲波治療","電磁波治療"],"a":2,"e":"電療法包括利用高、中、低頻率的直流或交流電，如微電流、干擾波等。","s":"2.1.5.2 電療法","p":14,"v":"電療包括利用高、中、低頻率的直或交流電，如微電流、干擾波等"},{"i":"m105jl9h","u":"u2","t":"g","q":"下列哪一組屬於「光學治療」？","c":"激光、紫外光、紅外線","w":["超聲波、衝擊波","脈衝電磁波、短波","透皮神經治療、干擾波"],"a":1,"e":"光學治療：激光、紫外光、紅外線。超聲波及衝擊波屬聲波治療；脈衝電磁波及短波屬電磁波治療。","s":"2.1.5.3 光學治療","p":14,"v":"如激光、紫外光、紅外線"},{"i":"m4jwqcg","u":"u2","t":"g","q":"超聲波及衝擊波在課本中歸類為哪一類治療方法？","c":"聲波治療","w":["電磁波治療","光學治療","水療"],"a":3,"e":"聲波治療：如超聲波及衝擊波。電磁波治療則是脈衝電磁波及短波。","s":"2.1.5.4 聲波治療","p":14,"v":"如超聲波及衝擊波"},{"i":"m1a3kweu","u":"u2","t":"g","q":"「脈衝電磁波」及「短波」在課本中歸類為哪一類治療方法？","c":"電磁波治療","w":["聲波治療","光學治療","水療"],"a":3,"e":"電磁波治療：如脈衝電磁波及短波，達到止痛、消腫和加強功能等作用。","s":"2.1.5.5 電磁波治療","p":14,"v":"如脈衝電磁波及短波"},{"i":"m1tgdlv5","u":"u2","t":"g","q":"關於水療，下列何者正確？","c":"利用水的浮力、阻力、水壓和較暖溫度，不懂游泳亦可進行","w":["與游泳相同，病人必須先學會特別的游泳技巧才可進行","只可在極深的水中進行，以便完全消除重力的影響","主要利用冰冷的水令血管收縮，以達到止痛的效果"],"a":0,"e":"水療不同於游泳，不需要病人學習特別的技巧；利用浮力、阻力、水壓及較暖溫度，讓患者進行一些陸上不能輕易做到的復康運動。","s":"2.1.5.6 水療","p":14,"v":"水療不同於游泳，不需要病人學習特別的技巧，即使不懂游泳亦可進行"},{"i":"m270285","u":"u2","t":"g","q":"「拍痰、抽痰及呼吸訓練」屬於哪一類物理治療方法？","c":"心胸肺治療","w":["手力治療","水療","光學治療"],"a":1,"e":"心胸肺治療：如拍痰、抽痰及呼吸訓練等。","s":"2.1.5.7 心胸肺治療","p":14,"v":"如拍痰、抽痰及呼吸訓練等"},{"i":"m1f2fz7l","u":"u2","t":"g","q":"下列哪一組屬於「手力治療」的例子？","c":"醫療性按摩、筋膜鬆弛、姿位鬆弛、軟組織鬆動術","w":["拍痰、抽痰、呼吸訓練、姿位排痰、呼吸協調","激光、紫外光、紅外線、偏光燈、低能量雷射","超聲波、衝擊波、短波、脈衝電磁波、干擾波"],"a":2,"e":"手力治療揉合中、西方手力治療的專業方法，主要療效為鎮痛、舒整關節及筋腱，促進關節功能恢復。","s":"2.1.5.10 手力治療","p":14,"v":"例子：醫療性按摩、筋膜鬆弛、姿位鬆弛、軟組織鬆動術"},{"i":"m1p2ulvj","u":"u2","t":"g","q":"「肌肉力量測試、柔軟度測試及心肺功能測試」屬於哪一類物理治療方法？","c":"體適能評估及訓練","w":["平衡和步態評估及鍛煉","手力治療","心胸肺治療"],"a":1,"e":"體適能評估及訓練包括為病者提供有關的檢查、測試及訓練，例子：肌肉力量測試、柔軟度測試、心肺功能測試等。","s":"2.1.5.9 體適能評估及訓練","p":14,"v":"例子：肌肉力量測試、柔軟度測試、心肺功能測試等"},{"i":"m1wq041o","u":"u2","t":"g","q":"課本指由認可物理治療師提供的現代針灸治療，主要臨床應用是：","c":"為病人止痛、刺激肌力及恢復功能","w":["診斷內臟疾病","處方藥物調理氣血","取代所有運動治療"],"a":3,"e":"針灸治療由香港物理治療師學會專業鑒定認可的物理治療師提供，主要臨床應用是為病人止痛、刺激肌力及恢復功能。","s":"2.1.5.11 針灸治療","p":15,"v":"主要臨床應用是為病人止痛、刺激肌力及恢復功能"},{"i":"moheny7","u":"u2","t":"g","q":"下列哪一組屬於課本所列的「其他治療方法」？","c":"熱療、冷療、肌內效貼布／運動貼布（Taping）","w":["激光、紫外光、紅外線、低能量雷射刺激","拍痰、抽痰、呼吸訓練、胸肺物理治療","超聲波、衝擊波、脈衝電磁波及短波"],"a":0,"e":"其他治療方法：熱療（Hot Therapy）、冷療（Cold Therapy）、肌內效貼布／運動貼布（Taping）等。","s":"2.1.5.12 其他治療方法","p":15,"v":"如熱療(Hot Therapy)、冷療(Cold Therapy)、肌內效貼布/運動貼布(Taping)等"},{"i":"m1inm8zx","u":"u2","t":"g","q":"下列哪個專科提供肢體活動及功能鍛煉、預防併發症、家居環境評估和安排，務求盡量恢復病人的獨立活動及生活能力？","c":"腦神經系統復康","w":["脊椎勞損及痛症","心肺系統復康","運動創傷"],"a":2,"e":"腦神經系統復康提供全面的康復治療，並包括協調、平衡、感知等方面；脊椎勞損及痛症則以鎮痛、脊椎護理及預防復發為主。","s":"2.1.7 常見有物理治療服務的專科例子（a）","p":15,"v":"腦神經系統復康提供全面的康復治療"},{"i":"mmsmcf5","u":"u2","t":"g","q":"牽引治療、手力治療、電療、針灸、伸展及強化肌肉運動，是下列哪個專科常用的治療方法？","c":"脊椎勞損及痛症","w":["腦神經系統復康","燒傷復康","老人科綜合物理治療"],"a":1,"e":"脊椎勞損及痛症：提供鎮痛處理、脊椎護理和預防復發等治療，使病人減輕疼痛和回復日常活動。","s":"2.1.7 常見有物理治療服務的專科例子（b）","p":15,"v":"脊椎勞損及痛症提供鎮痛處理、脊椎護理和預防復發等治療"},{"i":"mruxx4m","u":"u2","t":"g","q":"將人體橫切為「上、下」兩部分的切面稱為：","c":"水平面","w":["矢狀面","冠狀面","斜切面"],"a":3,"e":"水平面（Transverse Plane）＝上、下；矢狀面（Sagittal）＝左、右；冠狀面（Coronal）＝前、後。","s":"2.2.2 身體的剖面圖","p":17,"v":"水平面(Transverse Plane)：將人體橫切為上、下兩部份的切面"},{"i":"m11vbv3f","u":"u2","t":"g","q":"將人體切為「左、右」兩部分的切面稱為：","c":"矢狀面","w":["冠狀面","水平面","斜切面"],"a":0,"e":"矢狀面（Sagittal Plane）將人體切為左、右兩部份。","s":"2.2.2 身體的剖面圖","p":17,"v":"矢狀面(Sagittal Plane)：將人體切為左、右兩部份的切面"},{"i":"ma8trly","u":"u2","t":"g","q":"下列有關身體切面的配對，何者正確？","c":"冠狀面：前、後；水平面：上、下","w":["冠狀面：左、右；水平面：前、後","冠狀面：上、下；水平面：左、右","矢狀面：前、後；冠狀面：上、下"],"a":2,"e":"記憶法：矢狀＝左右、冠狀＝前後、水平＝上下。","s":"2.2.2 身體的剖面圖","p":17,"v":"冠狀面(Coronal Plane)：將人體切為前、後兩部份的切面"},{"i":"m8phm25","u":"u2","t":"g","q":"人體構造由小至大的正確排序是：","c":"細胞 → 組織 → 器官 → 系統","w":["細胞 → 器官 → 組織 → 系統","組織 → 細胞 → 器官 → 系統","細胞 → 組織 → 系統 → 器官"],"a":0,"e":"組織由形狀及種類相同的細胞組成；器官由許多不同類型的組織聚合；系統由不同器官組合，共同完成複雜的功能。","s":"2.3.2 人體構造","p":19,"v":"2.3.2人體構造","k":"工作紙一 第 1 題"},{"i":"mzjr2ha","u":"u2","t":"g","q":"細胞由哪三個部分構成？","c":"細胞膜、細胞質及細胞核","w":["細胞壁、細胞質及細胞核","細胞膜、細胞液及細胞壁","細胞膜、細胞核及骨基質"],"a":1,"e":"細胞是人體結構和功能的最少基本單位，由細胞膜、細胞質及細胞核所構成。","s":"2.3.2.1 細胞","p":19,"v":"細胞是由細胞膜、細胞質及細胞核所構成"},{"i":"m8meouf","u":"u2","t":"g","q":"下列何者屬於「組織」的種類？","c":"上皮組織","w":["神經細胞","心","循環系統"],"a":3,"e":"組織種類：神經組織、上皮組織、肌肉組織、結締組織。神經細胞屬細胞種類；心屬器官；循環系統屬系統。","s":"2.3.2.2 組織","p":19,"v":"種類：神經組織、上皮組織、肌肉組織、結締組織"},{"i":"mgeievt","u":"u2","t":"g","q":"器官由許多不同類型的組織聚合而成。下列哪一組全部屬於「器官」？","c":"心、肝、脾、肺、腎","w":["神經細胞、上皮細胞、骨細胞、肌肉細胞","神經組織、上皮組織、肌肉組織、結締組織","循環系統、神經系統、消化系統、呼吸系統"],"a":2,"e":"器官種類：心、肝、脾、肺、腎。「神經細胞、上皮細胞、骨細胞…」為細胞種類，「神經組織、上皮組織、肌肉組…」為組織種類，「循環系統、神經系統、消化系…」為系統種類。","s":"2.3.2.3 器官","p":19,"v":"種類：心、肝、脾、肺、腎"},{"i":"m1815sbf","u":"u2","t":"g","q":"循環系統（Circulatory System）包括：","c":"心臟、血管系統和血液","w":["心臟、肺和血液","心臟、肝臟和血管","血液、淋巴管和脾"],"a":0,"e":"循環系統包括心臟、血管系統和血液；血管分動脈、靜脈及毛細血管。功能是將血內的二氧化碳在肺內排出，並將含氧及營養的血液傳送至全身。","s":"2.3.3.1 循環系統","p":19,"v":"包括心臟、血管系統和血液"},{"i":"msea8sl","u":"u2","t":"g","q":"血液成分中，負責傳送氧份的是：","c":"紅血球","w":["白血球","血小板","血漿"],"a":2,"e":"紅血球傳送氧份；白血球殺滅病菌；血小板凝血；血漿則是血液的液體部分。","s":"2.3.3.1.1 循環系統 組成（b 血液）","p":19,"v":"由紅血球（傳送氧份）、白血球（殺滅病菌）、血小板（凝血）及血漿所組成"},{"i":"m11ozsb7","u":"u2","t":"g","q":"心臟位於胸腔的哪個位置？","c":"胸腔中間，心尖略偏左","w":["胸腔右側，心尖略偏右","腹腔上部，靠近肝臟","胸腔左側，完全位於左肺之內"],"a":1,"e":"心臟位於胸腔中間，心尖略偏左的位置，由左右心房及左右心室組成，負責血液輸送。","s":"2.3.3.1.1 循環系統 組成（a 心臟）","p":19,"v":"心臟：位於胸腔中間，心尖略偏左的位置"},{"i":"m1eqsb8w","u":"u2","t":"g","q":"神經系統由哪兩大部分組成？","c":"中樞神經系統及周圍神經系統","w":["大腦及小腦","腦神經及脊神經","感覺神經及運動神經"],"a":3,"e":"神經系統由中樞神經系統（大腦、小腦、腦幹及脊髓）及周圍神經系統組成。","s":"2.3.3.2.1 神經系統 組成","p":20,"v":"是由中樞神經系統及周圍神經系統組成"},{"i":"mqsgegj","u":"u2","t":"g","q":"負責處理內耳的平衡器官，並負責協調及平衡的腦部結構是：","c":"小腦","w":["大腦","腦幹","脊髓"],"a":1,"e":"小腦：處理內耳的平衡器官，負責協調、平衡。大腦負責接收情報、判斷及指揮；腦幹維持生命功能；脊髓傳送訊息及產生反射運動。","s":"2.3.3.2.1 神經系統 組成（b 小腦）","p":20,"v":"小腦：處理內耳的平衡器官，負責協調、平衡"},{"i":"m6rwlv9","u":"u2","t":"g","q":"連接大腦及脊髓，並維持呼吸、心跳、血壓、調節體溫等生命功能的是：","c":"腦幹","w":["小腦","大腦","脊髓"],"a":2,"e":"腦幹連接大腦及脊髓，維持生命功能如呼吸、心跳、血壓、調節體溫等。","s":"2.3.3.2.1 神經系統 組成（c 腦幹）","p":20,"v":"腦幹：連接大腦及脊髓，維持生命功能如呼吸、心跳、血壓、調節體溫等"},{"i":"mivsm57","u":"u2","t":"g","q":"人體脊椎神經共有多少對？","c":"31 對","w":["26 對","29 對","33 對"],"a":3,"e":"頸神經 8 對、胸神經 12 對、腰神經 5 對、薦神經 5 對、尾神經 1 對，共計 31 對。26 是成人椎骨節數；33 是兒童脊骨塊數；29 是顱骨塊數。","s":"2.3.3.2.1 神經系統 組成（d 脊髓）","p":20,"v":"頸神經有8對、胸神經12對、腰神經5對、薦神經5對、尾神經1對，共計31對脊椎神經"},{"i":"m1wtyuh7","u":"u2","t":"g","q":"頸神經共有多少對？","c":"8 對","w":["7 對","12 對","5 對"],"a":0,"e":"頸神經有 8 對（注意：頸椎只有 7 塊，但頸神經有 8 對）；胸神經 12 對、腰神經 5 對、薦神經 5 對、尾神經 1 對。","s":"2.3.3.2.1 神經系統 組成（d 脊髓）","p":20,"v":"頸神經有8對、胸神經12對"},{"i":"m1fquwde","u":"u2","t":"g","q":"呼吸系統的功能是：","c":"為細胞提供氧氣，並協助排出二氧化碳及維持體溫","w":["分泌激素以調控體內各種生理功能","引流組織液，使淋巴液和靜脈溝通","排出新陳代謝廢物以調節體內環境穩定"],"a":3,"e":"呼吸系統由上呼吸道（鼻、咽、喉）及下呼吸道（肺、支氣管、氣泡）組成，空氣在肺泡囊進行氣體交換。","s":"2.3.3.3.2 呼吸系統 功能","p":21,"v":"為細胞提供氧氣，並協助排出二氧化碳及維持體溫"},{"i":"m1tb0swl","u":"u2","t":"n","q":"肺臟的主要功能是進行：","c":"氣體交換（吸入氧氣，呼出二氧化碳）","w":["血液過濾","消化吸收","激素分泌"],"a":2,"e":"肺部是人體氣體交換的主要器官，假如發生病變而發揮不到氣體交換的功能，就會危及生命。","s":"2.3.4.2 肺部","p":26,"v":"肺部是人體氣體交換的主要器官","k":"工作紙一 第 4 題"},{"i":"mcpcggy","u":"u2","t":"o","q":"吸氣時，橫膈膜及胸腔壓力的變化是：","c":"橫膈膜收縮，胸腔壓力減少，空氣吸入體內","w":["橫膈膜放鬆，胸腔壓力增加，空氣吸入體內","橫膈膜收縮，胸腔壓力增加，空氣排出體外","橫膈膜放鬆，胸腔壓力減少，空氣排出體外"],"a":0,"e":"吸氣：橫膈膜收縮，胸腔壓力減少，空氣吸入體內；呼氣：橫膈膜放鬆，增加胸腔壓力，肺內的空氣排出體外。","s":"2.3.3.3.2 呼吸系統 功能","p":21,"v":"吸氣：橫膈膜收縮，胸腔壓力減少，空氣吸入體內"},{"i":"m5o1367","u":"u2","t":"g","q":"肌肉骨骼系統的功能是：","c":"參與動作的產生，維持姿勢及產生熱量，並支撐身體","w":["分泌激素以調控體內各種生理功能","引流組織液","調節體內環境穩定，排出新陳代謝的物質"],"a":1,"e":"肌肉骨骼系統：參與動作的產生，維持姿勢及產生熱量，為人體提供支持作用，主要功能是支撐身體。","s":"2.3.3.4.2 肌肉骨骼系統 功能","p":21,"v":"參與動作的產生，維持姿勢及產生熱量"},{"i":"m1eif5nm","u":"u2","t":"o","q":"「橫跨兩個關節」的肌肉屬於雙關節肌群。課本所舉的例子是：","c":"大腿內側縫匠肌、上臂肱二頭肌","w":["臀大肌、胸大肌","伸指肌、屈趾長肌","三角肌、斜方肌"],"a":1,"e":"單關節肌群：如臀大肌、胸大肌；雙關節肌群：橫跨兩個關節，如縫匠肌、肱二頭肌（頁面橙色標示另列：三頭肌、膕繩肌、腓腸肌、股四頭肌）；多關節肌群：能做較複雜的關節運動，如伸指肌、屈趾長肌。","s":"2.3.3.4.1 肌肉骨骼系統 組成（b 雙關節肌群）","p":21,"v":"橫跨兩個關節，如大腿內側縫匠肌、上臂肱二頭肌"},{"i":"m1d4ritn","u":"u2","t":"g","q":"成人的消化系統從口腔到肛門（直腸）長約：","c":"7-8 米","w":["3-4 米","5-6 米","9-10 米"],"a":3,"e":"成人的消化系統從口腔到肛門（直腸）長約 7-8 米；主要功能是攝取、消化、吸收及排泄。","s":"2.3.3.5.2 消化系統","p":22,"v":"成人的消化系統從口腔到肛門（直腸）長約7-8米"},{"i":"m1fuxqow","u":"u2","t":"g","q":"下列何者屬於「淋巴器官」？","c":"胸腺","w":["肝臟","腎臟","胰臟"],"a":2,"e":"淋巴系統由淋巴管道、淋巴器官（包括淋巴結、扁桃體、脾和胸腺）和淋巴組織構成；功能是引流組織液；相關疾病：手術後淋巴水腫。","s":"2.3.3.6.1 淋巴系統 組成","p":22,"v":"淋巴器官（包括淋巴结、扁桃體、脾和胸腺）"},{"i":"m1lu9t74","u":"u2","t":"g","q":"內分泌系統由什麼組成？","c":"分泌激素的無導管腺體","w":["淋巴管道及淋巴器官","上呼吸道及下呼吸道","心臟、血管及血液"],"a":0,"e":"內分泌系統由分泌激素的無導管腺體組成，主要功能是調控體內各種生理功能正常運作。","s":"2.3.3.7 內分泌系統","p":22,"v":"由分泌激素的無導管腺體組成"},{"i":"mp9vimc","u":"u2","t":"g","q":"排泄系統的主要功能是：","c":"調節體內環境穩定","w":["繁殖","攝取、消化、吸收食物","引流組織液"],"a":1,"e":"排泄系統處理人體在新陳代謝過程中排出體外的物質，主要功能是調節體內環境穩定；生殖系統的主要功能是繁殖。","s":"2.3.3.9 排泄系統","p":22,"v":"主要功能是調節體內環境穩定"},{"i":"ma2y9vq","u":"u2","t":"g","q":"心房和心室之間由什麼相隔，其作用是防止血液回流到心房？","c":"心瓣","w":["心肌","心包膜","冠狀動脈"],"a":3,"e":"上下心房和心室由心瓣相隔，作用是控制由心房流入心室的血流，防止血流返回心房。","s":"2.3.4.1.2 心臟的構造","p":23,"v":"上下心房和心室由心瓣相隔，作用是控制由心房流入心室的血流，防止血流返回心房","k":"工作紙一 第 2 題"},{"i":"my5mhqe","u":"u2","t":"g","q":"心臟本身所需的營養及氧份，由哪些血管供給？","c":"左、右冠狀動脈","w":["左、右肺動脈","上、下腔靜脈","左、右頸動脈"],"a":0,"e":"心臟由左、右冠狀動脈來供給營養及氧份；冠狀動脈為主動脈的一條分支。","s":"2.3.4.1.2 心臟的構造","p":23,"v":"心臟由左、右冠狀動脈來供給營養及氧份"},{"i":"m1iophs4","u":"u2","t":"o","q":"冠狀動脈狹窄會令心肌缺血，而引致：","c":"心肌梗塞","w":["中風","靜脈曲張","心律不正"],"a":2,"e":"冠狀動脈為主動脈的分支，供應心臟血液；冠狀動脈狹窄會引起心肌缺血而致心肌梗塞。心搏過速（多於 100 次）或過慢（少於 60 次）才稱為心律不正。","s":"2.3.4.1.3 心臟的血流（c 冠狀動脈）","p":24,"v":"冠狀動脈狹窄會引起心肌缺血而致心肌梗塞","k":"工作紙一 第 3 題"},{"i":"mq0pegl","u":"u2","t":"g","q":"大循環（體循環）的血流次序是：","c":"左心房 → 二尖瓣 → 左心室 → 主動脈瓣 → 主動脈 → 身體其他器官","w":["左心室 → 二尖瓣 → 左心房 → 主動脈瓣 → 主動脈 → 身體其他器官","右心房 → 三尖瓣 → 右心室 → 主動脈瓣 → 主動脈 → 身體其他器官","左心房 → 三尖瓣 → 左心室 → 主動脈瓣 → 主動脈 → 身體其他器官"],"a":3,"e":"大循環：左心房 → 二尖瓣 → 左心室 → 主動脈瓣 → 主動脈 → 身體其他器官。三尖瓣屬右心（右心房與右心室之間）。","s":"2.3.4.1.3 心臟的血流（a 大循環）","p":24,"v":"大循環的流程：左心房→二尖瓣→左心室→主動脈瓣→主動脈→身體其他器官"},{"i":"mwbybyq","u":"u2","t":"g","q":"下列哪項是小循環（肺循環）的正確血流次序？","c":"大靜脈 → 右心房 → 三尖瓣 → 右心室 → 肺動脈瓣 → 肺動脈 → 肺部 → 肺靜脈 → 左心房","w":["大靜脈 → 右心房 → 二尖瓣 → 右心室 → 肺動脈瓣 → 肺動脈 → 肺部 → 肺靜脈 → 左心房","大靜脈 → 左心房 → 三尖瓣 → 左心室 → 肺動脈瓣 → 肺動脈 → 肺部 → 肺靜脈 → 右心房","大靜脈 → 右心房 → 三尖瓣 → 右心室 → 肺靜脈 → 肺部 → 肺動脈 → 左心房"],"a":0,"e":"小循環：缺氧血液由右心室輸到肺，經氣體交換後回到左心房。記憶：右心用三尖瓣、肺動脈；左心用二尖瓣、主動脈。","s":"2.3.4.1.3 心臟的血流（b 小循環）","p":24,"v":"小循環的流程：大靜脈→右心房→三尖瓣→右心室→肺動脈瓣→肺動脈→肺部→肺靜脈→左心房"},{"i":"m6iasrg","u":"u2","t":"g","q":"心臟傳導系統的結構包括：","c":"竇房結、房室結、房室束","w":["二尖瓣、三尖瓣、肺動脈瓣","左心房、右心房、左心室","冠狀動脈、冠狀靜脈、冠狀竇"],"a":1,"e":"在心肌內有一群特殊的肌肉神經細胞，稱為心臟之傳導系統，結構包括竇房結、房室結、房室束。","s":"2.3.4.1.4 心臟的傳導系統","p":25,"v":"其結構包括：竇房結、房室結、房室束"},{"i":"m11tdq13","u":"u2","t":"g","q":"肌肉節律性的收縮，為何有助靜脈血液回流到心臟？","c":"肌肉收縮擠壓分佈其間的靜脈，使血液循靜脈瓣的開啟方向回流","w":["肌肉收縮令靜脈血管壁變厚，使血液流動更快速","肌肉收縮令血液由靜脈逆流至毛細血管再回心臟","肌肉收縮產生熱力，令靜脈內的血液變稀而易流動"],"a":2,"e":"肌肉節律性的收縮對分佈於其間的靜脈有著擠壓作用，使血液循靜脈瓣的開啟方向回流到心臟。（這也是活動、運動對預防深層靜脈血栓有幫助的原因。）","s":"2.3.4.1.5 心臟的功能","p":26,"v":"肌肉節律性的收縮對分佈於其間的靜脈有著擠壓作用"},{"i":"mzxhzl0","u":"u2","t":"n","q":"一般成年人平均每分鐘大約呼吸多少次？","c":"16-20 次","w":["6-10 次","25-30 次","30-40 次"],"a":0,"e":"一般成年人平均每分鐘大約呼吸 16-20 次；一般兒童或新生嬰兒的呼吸速率比成年人高。","s":"2.3.4.2.2 肺部的功能","p":26,"v":"一般成年人平均每分鐘大約呼吸16-20次"},{"i":"m8wv1tm","u":"u2","t":"n","q":"關於肺部構造，下列何者正確？","c":"左肺有 2 片肺葉，右肺有 3 片肺葉","w":["左肺有 3 片肺葉，右肺有 2 片肺葉","兩側肺各有 3 片肺葉","兩側肺各有 2 片肺葉"],"a":1,"e":"肺位於胸腔內，由肋骨保護，分成左肺和右肺；左肺有 2 片肺葉，右肺則有 3 片肺葉（記憶：左 2 右 3）。","s":"2.3.4.2.1 肺部的構造","p":26,"v":"左肺有2片肺葉，右肺則有3片肺葉"},{"i":"m14j6xdq","u":"u2","t":"n","q":"一般情況下，心臟每分鐘的心搏約為多少次？心搏多於多少次稱為心搏過速（屬心律不正）？","c":"約 80 次；多於 100 次","w":["約 60 次；多於 80 次","約 100 次；多於 120 次","約 80 次；多於 120 次"],"a":3,"e":"心搏每分鐘約 80 次；若心搏過速（多於 100 次）或心搏過慢（少於 60 次）稱之為心律不正。","s":"2.3.4.1.5 心臟的功能","p":26,"v":"若心搏過速（多於100次）或心搏過慢（少於60次）稱之為心律不正"},{"i":"m1r6ekl7","u":"u2","t":"n","q":"人體的骨骼系統由多少塊骨頭及超過 200 個關節組成，約佔成年人體重的百分之幾？","c":"206 塊；15%","w":["260 塊；25%","206 塊；40%","300 塊；15%"],"a":2,"e":"骨骼系統由 206 塊骨頭及超過 200 個關節組成，約佔成年人體重的 15%。40% 是骨骼肌佔全身重量的比例。","s":"2.4.1 骨骼系統","p":28,"v":"人體的骨骼系統是由206塊骨頭及超過200個關節所組成，約佔成年人體重的15%","k":"工作紙一 第 5 題"},{"i":"m1ilk1h7","u":"u2","t":"g","q":"成年人的椎骨（脊柱）共有多少節？","c":"26 節","w":["24 節","29 節","33 節"],"a":2,"e":"成人椎骨 26 節＝頸椎 7＋胸椎 12＋腰椎 5＋骶骨 1（5 合 1）＋尾骨 1（4 合 1）。33 是兒童、青少年骶骨及尾骨尚未融合時的總數；29 是顱骨（含聽小骨及舌骨）的塊數。","s":"2.4.1.1.1 中軸骨（b 椎骨）","p":29,"v":"成人的椎骨有26節"},{"i":"m1402k9c","u":"u2","t":"g","q":"成人脊柱各部分的數目，下列何者正確？","c":"7 塊頸椎、12 塊胸椎、5 塊腰椎、1 塊骶骨、1 塊尾骨","w":["12 塊頸椎、7 塊胸椎、5 塊腰椎、1 塊骶骨、1 塊尾骨","7 塊頸椎、12 塊胸椎、5 塊腰椎、5 塊骶骨、4 塊尾骨","7 塊頸椎、10 塊胸椎、7 塊腰椎、1 塊骶骨、1 塊尾骨"],"a":3,"e":"成人：頸 7、胸 12、腰 5、骶 1、尾 1，共 26 節。「7 塊頸椎、12 塊胸椎、…」是兒童、青少年的數目（5 塊薦椎、4 塊尾椎，合共 33 塊）。","s":"2.4.1.1.1 中軸骨（b 椎骨）","p":29,"v":"椎骨包括7塊頸椎，12塊胸椎，5塊腰椎，1塊骶骨（5合1）和1塊尾骨（4合1）","k":"工作紙一 第 7 題"},{"i":"malww6v","u":"u2","t":"n","q":"兒童、青少年的骶骨和尾骨尚未連合，脊骨合共有多少塊？","c":"33 塊","w":["26 塊","29 塊","31 塊"],"a":1,"e":"兒童、青少年有 5 塊薦椎和 4 塊尾椎，加上頸、胸及腰椎，合共 33 塊脊骨；成年後 5 塊骶骨和 4 塊尾骨各自融合成 1 塊。","s":"2.4.1.1.1 中軸骨（b 椎骨）","p":29,"v":"合共有33塊脊骨"},{"i":"m1enn3wa","u":"u2","t":"g","q":"從側面觀察脊柱，並不是筆直的，而是有幾個前後凹凸的弧度（稱為生理弧度）？","c":"4 個","w":["2 個","3 個","5 個"],"a":0,"e":"生理弧度有 4 個：頸前彎、胸後彎、腰前彎和骶後彎，有助吸收走路和運動時所產生的震盪。","s":"2.4.1.1.1 中軸骨（b 椎骨）","p":29,"v":"從側面觀察脊柱，它並不是筆直的，而是有4個前後凹凸的弧度"},{"i":"mzeh4e4","u":"u2","t":"n","q":"人體肋骨左右共有多少對？","c":"12 對","w":["10 對","11 對","24 對"],"a":2,"e":"肋骨和胸骨：肋骨由肋骨和肋軟骨組成，左右共有 12 對；第 11 和 12 肋軟骨游離，不和胸骨相連。","s":"2.4.1.1.1 中軸骨（c 肋骨和胸骨）","p":30,"v":"左右共有12對"},{"i":"me22r49","u":"u2","t":"n","q":"骨髓透過造血作用製造血球，屬於骨骼的哪項功能？","c":"造血","w":["支撐","保護","儲存"],"a":3,"e":"骨骼五大功能：支撐（維持姿勢）、保護（內部器官）、造血（骨髓製造血球）、儲存（黃骨髓儲脂肪、礦物鹽庫）、活動（與肌肉以槓杆原理運作）。","s":"2.4.1.2 骨骼的功能","p":32,"v":"造血：骨髓透過造血作用製造血球"},{"i":"m2rmp7s","u":"u2","t":"n","q":"下列哪一塊骨屬於「種籽骨」？","c":"髕骨","w":["肱骨","腕骨","肩胛骨"],"a":0,"e":"種籽骨形如豆狀，分佈於手和足的肌腱內，例子是髕骨。肱骨＝長骨；腕骨＝短骨；肩胛骨＝扁平骨。","s":"2.4.1.3 骨的形狀","p":32,"v":"種籽骨形如豆狀"},{"i":"m1obpe8s","u":"u2","t":"n","q":"長期臥床時，骨質的生成與分解情況是：","c":"骨質堆積速度慢於分解，骨質從骨骼流失","w":["骨質堆積速度高於分解，骨骼增生","骨質堆積速度等於分解，骨骼處於恆定","骨質只分解，完全不再生成"],"a":1,"e":"當骨質的堆積速度高於分解速度，骨骼會增生、成長（如經常負重運動）；當堆積速度慢於分解，骨質會流失（如長期臥床）。","s":"2.4.1.5 骨骼的恆定","p":34,"v":"當骨質的堆積速度慢於分解，骨質就會從骨骼流失，例如長期臥床"},{"i":"mimd6ew","u":"u2","t":"n","q":"按課本，男性約自幾歲起逐漸於骨骼中流失鈣質？","c":"60 歲","w":["40 歲","50 歲","30 歲"],"a":2,"e":"女性約自 40 歲，男性約自 60 歲起會逐漸於骨骼中流失鈣質；鈣質流失是造成骨質疏鬆症的主要原因。","s":"2.4.1.6 骨骼的生長周期","p":34,"v":"女性約自40歲，而男性約自60歲起會逐漸於骨骼中流失鈣質"},{"i":"m1wu7qnl","u":"u2","t":"n","q":"按關節的可活動程度分類，「恥骨聯合」屬於：","c":"微動關節","w":["不動關節","活動關節","纖維關節"],"a":1,"e":"不動關節：頭蓋骨間的骨縫；微動關節：恥骨聯合、椎骨的連結（活動範圍很小）；活動關節：肩關節、膝關節（人體大部分關節）。","s":"2.4.2.1.1 按可活動程度分類","p":35,"v":"微動關節有限度是骨與骨之間以軟骨組"},{"i":"mpi533k","u":"u2","t":"o","q":"按課本，滑膜關節（synovial joints）的主要結構有：","c":"關節面、關節軟骨、關節囊和關節腔","w":["關節面、關節囊、韌帶和關節盤","縫合關節、韌帶聯合、釘狀聯合","關節腔、肌腱、關節盤和軟骨膜"],"a":0,"e":"此處（2.4.2.1.2）寫滑膜關節主要結構有四項。留意 2.4.2.3.2 另把「關節主要結構」列為關節面、關節囊、關節腔三項，關節軟骨歸入輔助結構；作答時按題目所問章節或工作紙為準。","s":"2.4.2.1.2 按結構性分類","p":35,"v":"滑膜關節：主要結構有關節面、關節軟骨、關節囊和關節腔"},{"i":"ma54hg5","u":"u2","t":"r","q":"下列哪種關節結構的活動性最大，能作屈、伸、內收、外展、環轉和旋轉運動？","c":"球窩關節","w":["鉸鏈關節","鞍狀關節","橢圓關節"],"a":3,"e":"球窩關節：關節頭呈球狀，另一骨的關節面呈窩狀，兩者只是鬆弛地連接，是活動性最大的一種關節結構；例子：髖關節、肩關節。","s":"2.4.2.2 滑膜關節的分類（f 球窩關節）","p":36,"v":"是活動性最大的一種關節結構"},{"i":"m8119pu","u":"u2","t":"o","q":"下列哪一個關節屬「球窩關節」？","c":"髖關節","w":["膝關節","肘關節","大拇指關節"],"a":3,"e":"球窩關節例子：髖關節、肩關節。膝、肘＝鉸鏈關節；大拇指＝鞍狀關節。","s":"2.4.2.2 滑膜關節的分類（f 球窩關節）","p":36,"v":"例：髖關節、肩關節","k":"工作紙一 第 8 題"},{"i":"mikzhto","u":"u2","t":"n","q":"下列哪個關節屬「鉸鏈關節」（只能作單一平面的屈、伸運動，如門鉸）？","c":"肘關節","w":["髖關節","肩關節","大拇指關節"],"a":1,"e":"鉸鏈關節：一骨凸起的部分嵌在另一骨凹陷的部分，只能作屈、伸運動；例：膝關節、肘關節。","s":"2.4.2.2 滑膜關節的分類（b 鉸鏈關節）","p":36,"v":"例：膝關節、肘關節","k":"工作紙一 第 8 題"},{"i":"mk3umx2","u":"u2","t":"n","q":"大拇指關節屬於哪一類滑膜關節？","c":"鞍狀關節","w":["球窩關節","橢圓關節","車軸關節"],"a":2,"e":"鞍狀關節：兩個關節面均呈馬鞍型，彼此成十字形交叉接合，可作屈、伸、內收、外展和環轉，活動能力比橢圓關節大；例：大拇指關節。","s":"2.4.2.2 滑膜關節的分類（e 鞍狀關節）","p":36,"v":"例：大拇指關節","k":"工作紙一 第 8 題"},{"i":"m1x6seuz","u":"u2","t":"n","q":"頸部第一及第二節脊椎之間的關節，屬於哪一類滑膜關節？","c":"車軸關節","w":["鉸鏈關節","鞍狀關節","橢圓關節"],"a":0,"e":"車軸（樞軸）關節：關節頭呈圓柱狀，關節窩呈環狀，關節頭繞本身的垂直軸在環內回旋；例：頸部第一及第二節脊椎間關節、橈骨和尺骨近側的關節。","s":"2.4.2.2 滑膜關節的分類（c 車軸關節）","p":36,"v":"例：頸部第一及第二節脊椎間關節","k":"工作紙一 第 8 題"},{"i":"m1gan99a","u":"u2","t":"n","q":"手腕的旋轉關節及指關節，屬於哪一類滑膜關節？","c":"橢圓關節","w":["滑動關節","鉸鏈關節","球窩關節"],"a":2,"e":"橢圓關節：由一凸一凹的橢圓型關節面組成，可作前後和左右運動；例：手腕的旋轉關節、指關節。滑動關節例：手掌掌骨間關節、肩鎖關節。","s":"2.4.2.2 滑膜關節的分類（d 橢圓關節）","p":36,"v":"例：手腕的旋轉關節、指關節","k":"工作紙一 第 8 題"},{"i":"m8913fd","u":"u2","t":"g","q":"關節的「主要結構」是指：","c":"關節面、關節囊、關節腔","w":["關節軟骨、韌帶、關節盤","關節面、韌帶、關節盤","關節囊、關節軟骨、肌腱"],"a":0,"e":"主要結構：關節面、關節囊、關節腔；輔助結構（增加關節穩固性或靈活性）：關節軟骨、韌帶、關節盤。","s":"2.4.2.3.2 間接連結（a 關節的主要結構）","p":37,"v":"關節的主要結構","k":"工作紙一 第 9 題"},{"i":"m1r1y9by","u":"u2","t":"g","q":"關節的「輔助結構」（能增加關節的穩固性或靈活性）是指：","c":"關節軟骨、韌帶、關節盤","w":["關節面、關節囊、關節腔","關節面、關節軟骨、關節腔","關節囊、韌帶、肌腱"],"a":1,"e":"輔助結構：關節軟骨、韌帶、關節盤。主要結構則是關節面、關節囊、關節腔。","s":"2.4.2.3.2 間接連結（b 關節的輔助結構）","p":38,"v":"關節的輔助結構（能增加關節的穩固性或靈活性）","k":"工作紙一 第 10 題"},{"i":"m3nr9n6","u":"u2","t":"g","q":"關於「韌帶」，下列何者正確？","c":"由彈性纖維束組成，分佈在關節周圍，連結兩骨、穩固關節並防止脫臼","w":["由纖維軟骨構成凹盤狀，主要功能是製造窩形的關節面","由結締組織構成，能夠收縮並帶動關節及骨骼活動","覆蓋在關節面上，能減輕衝擊及吸收震動"],"a":3,"e":"韌帶是由彈性纖維束組成的規則致密結締組織（例子：膝關節前十字韌帶）。「由纖維軟骨構成凹盤狀，主要…」描述關節盤；「由結締組織構成，能夠收縮並…」描述肌肉／肌腱；「覆蓋在關節面上，能減輕衝擊…」描述關節軟骨（關節面）。","s":"2.4.2.3.2 間接連結（b 關節的輔助結構）","p":38,"v":"韌帶是一種由彈性纖維束組成的規則致密結締組織，分佈在關節的周圍，有連結兩骨和穩固關節的作用，防止脫臼"},{"i":"mfp7ged","u":"u2","t":"g","q":"「關節盤」的主要功能是：","c":"製造一個窩形的關節面，以增加關節的穩定性","w":["分泌滑膜液，起潤滑作用，以減少關節面的摩擦","連結兩骨，穩固關節並防止關節脫臼","吸收震動，並為關節軟骨提供營養"],"a":0,"e":"關節盤由纖維軟骨構成凹盤狀的軟骨，主要功能是製造一個窩形的關節面，增加關節的穩定性。","s":"2.4.2.3.2 間接連結（b 關節的輔助結構）","p":38,"v":"關節盤：由纖維軟骨構成凹盤狀的軟骨，主要功能是製造一個窩形的關節面，以增加關節的穩定性"},{"i":"m6sjf3p","u":"u2","t":"g","q":"關節囊內層（滑膜層）的功能是：","c":"分泌滑膜液，起潤滑作用，減少關節面軟骨之間的摩擦","w":["製造血球，供應全身所需的紅血球及白血球","儲存脂肪，並作為人體礦物鹽的儲存庫","連結兩骨，穩固關節並防止關節脫臼"],"a":1,"e":"關節囊分內外兩層：內層為滑膜層，可分泌滑膜液，起潤滑作用，並為關節軟骨提供營養；外層為纖維層，有些部分局部增厚形成韌帶。","s":"2.4.2.3.2 間接連結（a 關節的主要結構）","p":37,"v":"關節囊分內外兩層。內層為滑膜層，可分泌滑膜液，起潤滑作用，可減少關節面軟骨之間的摩擦"},{"i":"m17b51g5","u":"u2","t":"o","q":"關節腔內有少量的：","c":"滑膜液","w":["血液","淋巴液","骨髓"],"a":3,"e":"關節腔是由關節囊滑膜層與關節軟骨圍成的密閉腔隙，內有少量滑膜液；關節腔內為負壓，對保持關節穩固性起重要作用。","s":"2.4.2.3.2 間接連結（a 關節的主要結構）","p":37,"v":"關節腔：是由關節囊滑膜層與關節軟骨圍成的密閉腔隙，內有少量的滑膜液"},{"i":"m1thaa00","u":"u2","t":"n","q":"關於椎間盤，下列何者正確？","c":"腰部椎間盤最厚；纖維環後份最薄，髓核多向後或後外側突出","w":["腰部椎間盤最薄；纖維環後份最厚，髓核多向前方突出","頸部椎間盤最厚，腰部次之，中胸部椎間盤最薄","中胸部椎間盤最厚，頸部次之，腰部椎間盤最薄"],"a":2,"e":"椎間盤厚度：腰部最厚，頸部次之，中胸部最薄；纖維環後份最薄，故髓核多向後／後外側脫出，壓迫脊髓或脊神經；腰椎間盤脫出較常見。","s":"2.4.2.4.1 椎間盤","p":39,"v":"腰部的椎間盤最厚，頸部次之，中胸部最薄"},{"i":"mrew9f6","u":"u2","t":"g","q":"「接受刺激並發生反應」是肌肉組織的哪一種特性？","c":"興奮性","w":["收縮性","延伸性","伸彈性"],"a":3,"e":"肌肉組織四特性：興奮性（接受刺激並發生反應）、收縮性（有收縮能力）、延伸性（外力下能伸展、延長）、伸彈性（拉力移除後回復原來長度）。","s":"2.4.3.1 肌肉組織的特性","p":42,"v":"興奮性（excitability）：指接受刺激並發生反應的特性"},{"i":"mwudfwp","u":"u2","t":"g","q":"「當外在拉力移除後，可以回復原來的長度」是肌肉組織的哪一種特性？","c":"伸彈性","w":["興奮性","收縮性","延伸性"],"a":2,"e":"伸彈性（elasticity）：拉力移除後回復原來長度；延伸性（extensibility）：在外力作用下有伸展、延長的能力。兩者容易混淆。","s":"2.4.3.1 肌肉組織的特性","p":42,"v":"當外在拉力移除後，可以回復原來的長度"},{"i":"mly7c68","u":"u2","t":"g","q":"關於三種肌肉的敍述，下列何者正確？","c":"平滑肌位於內臟，不能隨意運動，不易疲勞","w":["心臟肌可以隨意運動，在顯微鏡下沒有橫紋","骨骼肌不易疲勞，在顯微鏡下沒有橫紋","平滑肌附著於骨骼上，在顯微鏡下有橫紋"],"a":0,"e":"骨骼肌：附著骨骼、隨意、有橫紋、易疲勞；平滑肌：位於內臟、不隨意、無橫紋、不易疲勞；心臟肌：構成心臟壁、不隨意、有橫紋、不易疲勞。","s":"2.4.3.3 肌肉的類型","p":42,"v":"骨骼肌（附著骨骼、隨意、有橫紋、易疲勞）；平滑肌（內臟、不隨意、無橫紋、不易疲勞）；心臟肌（心臟壁、不隨意、有橫紋、不易疲勞）"},{"i":"m1t6u5cf","u":"u2","t":"g","q":"三種不同的肌肉當中，與體育運動最有直接關係的是：","c":"骨骼肌","w":["平滑肌","心臟肌","以上三種關係相同"],"a":1,"e":"骨骼肌（下稱「肌肉」）與體育運動最有直接關係；人體共有 600 多條骨骼肌，約佔全身重量的 40%。","s":"2.4.3.4 骨骼肌的結構","p":42,"v":"三種不同的肌肉當中，與體育運動最有直接關係的就是骨骼肌","k":"工作紙一 第 11 題"},{"i":"m1tqlodc","u":"u2","t":"g","q":"人體共有多少條骨骼肌，約佔全身重量的百分之幾？","c":"600 多條；40%","w":["300 多條；40%","600 多條；15%","600 多條；60-70%"],"a":2,"e":"人體共有 600 多條骨骼肌，約佔全身重量的 40%。15% 是骨骼系統佔成人體重的比例；60-70% 是運動系統（骨、關節、骨骼肌）佔人體總重的比例。","s":"2.4.3.4 骨骼肌的結構","p":42,"v":"人體共有600多條骨骼肌，約佔全身重量的40%","k":"工作紙一 第 12 題"},{"i":"m15rgrgp","u":"u2","t":"g","q":"「肌肉收縮時，張力不變而長度改變」的收縮型態稱為：","c":"等張收縮","w":["等長收縮","等速收縮","靜態收縮"],"a":0,"e":"等張收縮（Isotonic）包括向心收縮（長度減少）及離心收縮（長度增加）。等長收縮：長度不變、關節不動，亦稱靜態收縮；等速收縮：肢體運動速度一定。","s":"2.4.3.6.2 等張收縮","p":44,"v":"當肌肉收縮時，張力不變而長度改變的收縮"},{"i":"mjqevj6","u":"u2","t":"g","q":"肌肉在收縮時「長度增加」（即肌肉在產生張力時被拉長）的收縮型態是：","c":"離心收縮","w":["等長收縮","向心收縮","等速收縮"],"a":3,"e":"向心收縮：長度減少；離心收縮：長度增加（肌肉在產生張力時拉長）；兩者同屬等張收縮。","s":"2.4.3.6.2 等張收縮（b 離心收縮）","p":44,"v":"指肌肉在收縮時，長度增加，亦即肌肉在產生張力時拉長"},{"i":"myu0fx","u":"u2","t":"g","q":"肌肉在收縮時「長度減少」的收縮型態稱為：","c":"向心收縮","w":["離心收縮","等長收縮","等速收縮"],"a":1,"e":"向心收縮（Concentric）：肌肉收縮時長度減少，例如屈曲手肘時肱二頭肌的收縮。","s":"2.4.3.6.2 等張收縮（a 向心收縮）","p":44,"v":"指肌肉在收縮時，長度減少"},{"i":"mf02pff","u":"u2","t":"n","q":"身體直立時，某些肌群需要收縮才能保持直立姿勢，這屬於哪種收縮型態？","c":"等長收縮","w":["向心收縮","離心收縮","等速收縮"],"a":0,"e":"等長收縮：肌肉兩端固定，關節沒有活動，肌肉長度沒有改變（靜態收縮）；實際上內部也會消耗能量，容易疲勞。","s":"2.4.3.6.1 等長收縮","p":44,"v":"是指肌肉兩端固定，與其相關的關節沒有發生關節的活動"},{"i":"m9wjnpd","u":"u2","t":"o","q":"肱二頭肌（Biceps brachii）的作用是：","c":"屈曲肘部","w":["伸直肘部","外展肩部","伸直膝關節"],"a":3,"e":"肱二頭肌：屈曲肘部；肱三頭肌：伸直肘部（兩者互為主動肌／對抗肌）。","s":"2.4.3.7 肌肉分佈圖（工作中較常處理的大肌肉）","p":45,"v":"肱二頭肌(Biceps brachil)：屈曲肘部"},{"i":"mc4oojk","u":"u2","t":"o","q":"肱三頭肌（Triceps brachii）的作用是：","c":"伸直肘部","w":["屈曲肘部","外展肩部","屈曲膝關節"],"a":1,"e":"肱三頭肌：伸直肘部；肱二頭肌：屈曲肘部。","s":"2.4.3.7 肌肉分佈圖（工作中較常處理的大肌肉）","p":45,"v":"肱三頭肌(Triceps brachil)：伸直肘部"},{"i":"m19iryt7","u":"u2","t":"o","q":"三角肌（Deltoid）的作用是：","c":"外展肩部","w":["內收肩部","屈曲肘部","伸直肘部"],"a":2,"e":"三角肌：外展肩部；胸大肌：內收及內旋肱骨；斜方肌：肩胛上舉、內收及下壓。","s":"2.4.3.7 肌肉分佈圖（工作中較常處理的大肌肉）","p":45,"v":"三角肌(Deltoid)：外展肩部"},{"i":"m1sp3kgi","u":"u2","t":"o","q":"股四頭肌（Quadriceps femoris）的作用是：","c":"伸直膝關節","w":["屈曲膝關節","屈曲肘部","外展肩部"],"a":0,"e":"股四頭肌：伸直膝關節；膕繩肌：屈曲膝關節。","s":"2.4.3.7 肌肉分佈圖（工作中較常處理的大肌肉）","p":45,"v":"股四頭肌(Quadriceps femoris)：伸直膝關節"},{"i":"m1bc30ej","u":"u2","t":"o","q":"膕繩肌（Hamstrings）的作用是：","c":"屈曲膝關節","w":["伸直膝關節","伸直肘部","外展肩部"],"a":2,"e":"膕繩肌：屈曲膝關節；腓腸肌：屈曲膝關節及足踝關節（足底屈曲）；股四頭肌則是伸直膝關節。","s":"2.4.3.7 肌肉分佈圖（工作中較常處理的大肌肉）","p":45,"v":"膕繩肌(Hamstrings)：屈曲膝關節"},{"i":"md2bdls","u":"u2","t":"o","q":"腓腸肌（Gastrocnemius）的作用是：","c":"屈曲膝關節及足踝關節（足底屈曲）","w":["伸直膝關節及足踝關節（足背屈曲）","伸直大腿及伸直腰部","外展肩部及伸直肘部"],"a":3,"e":"腓腸肌：屈曲膝關節及足踝關節（足底屈曲）。臀大肌主要伸直大腿，也協助外旋股骨及伸直腰部。","s":"2.4.3.7 肌肉分佈圖（工作中較常處理的大肌肉）","p":45,"v":"腓腸肌(Gastrocnemius)：屈曲膝關節及足踝關節（足底屈曲）"},{"i":"m8phn6v","u":"u2","t":"r","q":"肌肉內的能源儲備（如肌醣元、磷酸肌酸、三磷酸腺苷）分解時，除釋放能量供肌肉活動外，亦會：","c":"產生熱能，維持正常體溫","w":["產生血球","儲存脂肪","分泌滑膜液"],"a":1,"e":"肌肉的三大功能：產生活動、維持身體姿勢、儲能和產熱。","s":"2.4.3.2 肌肉的功能","p":42,"v":"分解時就會釋放出能量作肌肉活動之用"},{"i":"m2u0crw","u":"u2","t":"g","q":"縮寫「TENS」的中文名稱是：","c":"透皮神經電療機","w":["神經肌肉電刺激機","干擾波治療機","短波治療儀"],"a":1,"e":"儀器術語：TENS＝透皮神經電療機；US＝超音波／超聲波；IFT＝干擾波；SWD＝短波；WAX＝蠟療。","s":"2.5.2 儀器（Machines）","p":47,"v":"透皮神經電療機"},{"i":"m1ie193v","u":"u2","t":"n","q":"下列哪項「不屬於」課本所列的復康治療專業範疇？","c":"藥劑學","w":["義肢矯形（P&O）","醫務社工（MSW）","臨床心理學家（CP）"],"a":3,"e":"復康治療的專業範疇：物理治療(PT)、職業治療(OT)、言語治療(ST)、義肢矯形(P&O)、醫務社工(MSW)、臨床心理學家(CP)。","s":"2.1.1.3 復康治療的專業範疇","p":12,"v":"義肢矯形"},{"i":"moouz8h","u":"u2","t":"n","q":"根據現行法律框架，求診物理治療一般需要：","c":"醫生的轉介信","w":["警方批准","社工推薦信","保險公司同意書"],"a":2,"e":"求診物理治療需要有醫生的轉介信（一般運動班則作別論）；病人可自行選擇向任何註冊物理治療師求診。","s":"2.1.6 求診物理治療的程序","p":15,"v":"求診物理治療需要有醫生的轉介信"},{"i":"m8en8u8","u":"u2","t":"n","q":"「解剖姿勢」（Anatomical Position）的描述，下列何者正確？","c":"直立面向前方，上肢垂於兩側，掌心向前、拇指在外側，雙足並立","w":["身體仰臥，雙手放於胸前，掌心向下，雙足分開約一肩闊","直立面向側方，雙手高舉過頭，掌心向後，雙足並立","直立面向前方，上肢垂於兩側，掌心向後、拇指在內側"],"a":0,"e":"解剖姿勢是描述人體結構的標準姿勢：直立、面向前、上肢垂下、掌心向前、拇指在外側、雙足並立且足尖向前。","s":"2.2.1 解剖學姿勢","p":17,"v":"掌心向前，拇指在外側"},{"i":"m1h7yby0","u":"u2","t":"n","q":"解剖方位術語中，「近側端（proximal）」是指：","c":"靠近軀幹的地方","w":["遠離軀幹的地方","靠近身體的中線","遠離身體的中線"],"a":3,"e":"近側端＝靠近軀幹；遠側端（distal）＝遠離軀幹；內側面（medial）＝靠近身體中線；外側面（lateral）＝遠離身體中線。","s":"2.2.3 常用解剖方位術語","p":18,"v":"近側端（proximal）靠近軀幹的地方"},{"i":"m6e6yyv","u":"u2","t":"n","q":"大腦的哪一個腦葉與視覺有關？","c":"枕葉","w":["額葉","頂葉","顳葉"],"a":0,"e":"額葉：推理、計劃、語言、運動、情緒；枕葉：視覺；頂葉：觸覺、壓力、溫度及疼痛；顳葉：知覺、聽覺刺激辨識、記憶、性格。","s":"2.3.3.2.1 神經系統 組成（a 大腦）","p":20,"v":"枕葉(Occipital Lobe)：與視覺有關"},{"i":"m1e51j04","u":"u2","t":"n","q":"槓桿運動原理中，「第二槓桿」的特點是：","c":"阻力點在中央，省力費時（移動幅度）","w":["支點在中央","施力點在中央，省時費力","支點在兩端，既省力又省時"],"a":2,"e":"第一槓桿：支點在中央；第二槓桿：阻力點在中央，省力費「時」（移動幅度）；第三槓桿：施力點在中央，省「時」費力。","s":"2.4.4.2 槓桿運動的原理","p":46,"v":"第二槓桿阻力點在中央省力費時"},{"i":"m18n4ft7","u":"u2","t":"n","q":"有規律的鍛煉對肌肉系統的影響包括：","c":"肌肉體積增大、肌肉內脂肪減少、肌肉中毛細血管增多","w":["肌肉體積縮小、肌肉內脂肪增加、毛細血管減少","肌纖維內線粒體減少、結締組織減少","肌肉體積不變，只增加肌腱長度"],"a":1,"e":"鍛煉的影響：肌肉體積增大、肌纖維內線粒體增多增大、肌肉內脂肪減少、結締組織增加、肌肉中毛細血管增多、肌肉內化學成分改變、參與活動的肌纖維數量增加。","s":"2.4.3.5 鍛煉對肌肉系統的影響","p":43,"v":"肌肉體積增大"},{"i":"m1qwspxn","u":"u3","t":"g","q":"「有創骨折（開放性骨折）」是指：","c":"傷口由皮膚表面深達骨折處，或斷骨尖端穿出皮膚表面而接觸細菌","w":["骨折處的皮膚表面或黏膜完整，沒有與體外部分接觸","骨骼受打擊、扭擰或受力過度，部分斷裂但外形沒有變形","因累積性壓力或內科疾病而造成的骨折，皮膚保持完整"],"a":2,"e":"開放性骨折會接觸到皮膚上或環境中的細菌，感染風險高；閉合性（無創）骨折則皮膚完整、感染度低。","s":"3.1.1.1.1 骨折的分類（b 有創骨折）","p":53,"v":"傷口由皮膚表面深達骨折處，或者斷骨的尖端穿出了皮膚表面，接觸到皮膚上或環境中的細菌"},{"i":"m7zqnk2","u":"u3","t":"n","q":"骨折處的皮膚表面或黏膜完整，而且沒有與體外部分接觸，感染度低。這種骨折稱為：","c":"無創骨折（閉合性骨折）","w":["有創骨折（開放性骨折）","壓迫性骨折","青枝骨折"],"a":0,"e":"無創骨折又稱閉合性骨折；有創骨折又稱開放性骨折。","s":"3.1.1.1.1 骨折的分類（a 無創骨折）","p":53,"v":"骨折處的皮膚表面或黏膜完整而且沒有與體外部分接觸，感染度低"},{"i":"m18gqps9","u":"u3","t":"g","q":"「青枝骨折」常見於哪類人士，原因是其骨骼比成人柔軟且有彈性？","c":"兒童","w":["老年人","運動員","孕婦"],"a":3,"e":"嬰幼兒童的骨骼因未完全成熟，比成人的骨骼柔軟且有彈性，不易折斷，所以青枝骨折常見於兒童；老年人骨骼脆弱，受力不大也可造成骨折。","s":"3.1.1.1 骨折（及骨折類型圖）","p":53,"v":"所以青枝骨折常見於兒童"},{"i":"mwawuuz","u":"u3","t":"g","q":"醫護人員一般利用哪種儀器測量患者脊椎和髖骨的骨質密度？","c":"雙能量 X 光吸收測定儀（DEXA）","w":["超聲波治療儀（Ultrasound Therapy）","心電圖及心跳測量器（Cardiac monitor）","血含氧量測量機（Oximeter）"],"a":1,"e":"骨質密度檢查攝影儀即雙能量 X 光吸收測定儀（DEXA），並與同齡人士的骨質密度比較；骨質密度降低，較輕微稱骨質流失，較嚴重稱骨質疏鬆。","s":"3.1.1.2 骨質疏鬆症","p":54,"v":"雙能量X光吸收測定儀(DEXA)測量患者脊椎和髖骨骨質的密度"},{"i":"m1d3dm3m","u":"u3","t":"g","q":"「原發性骨質疏鬆」的成因是：","c":"破骨細胞比造骨細胞活躍，以致骨質密度下降","w":["造骨細胞比破骨細胞活躍，以致骨質密度上升","甲狀腺功能亢進症或其他疾病引致骨質流失","因病長期臥床，骨骼缺乏負重刺激而流失"],"a":3,"e":"原發性：破骨細胞比造骨細胞活躍，較常見於老年人和停經後的女性；繼發性：與某些因素有關，如甲狀腺功能亢進症或因病長期臥床。","s":"3.1.1.2.1 成因（a 原發性骨質疏鬆）","p":54,"v":"由於身體內的破骨細胞比造骨細胞活躍，以致骨質密度下降"},{"i":"m1kocw41","u":"u3","t":"g","q":"下列何者屬「繼發性骨質疏鬆」的成因？","c":"甲狀腺功能亢進症或因病長期臥床","w":["年老","停經後的女性","破骨細胞比造骨細胞活躍"],"a":1,"e":"繼發性骨質疏鬆與某些因素有關，例如甲狀腺功能亢進症患者或因病長期臥床；年老、停經後及破骨細胞活躍屬原發性。","s":"3.1.1.2.1 成因（b 繼發性骨質疏鬆）","p":54,"v":"則與某些因素有關，例如甲狀腺功能亢進症患者或因病長期臥床"},{"i":"m1j30ugj","u":"u3","t":"g","q":"下列哪一項是骨質疏鬆症的高危因素？","c":"更年期後及 45 歲或以上女性","w":["年輕男性","經常接觸陽光","體重過重"],"a":2,"e":"高危因素：更年期後及 45 歲或以上女性、缺乏運動、缺鈣及維他命 D、少接觸陽光、經常吸煙飲酒、長期服用類固醇、家族史、過瘦、高齡、過多咖啡因。","s":"3.1.1.2.2 骨質疏鬆症的高危因素","p":54,"v":"更年期後及45歲或以上女性"},{"i":"m1f65a4a","u":"u3","t":"g","q":"下列何者「不是」骨質疏鬆症的高危因素？","c":"經常接觸陽光","w":["過瘦","缺乏運動（如經常臥床）","長期服用類固醇"],"a":0,"e":"高危因素是「少接觸陽光」、「過瘦」而不是過重；陽光有助身體合成維他命 D，促進鈣的吸收。","s":"3.1.1.2.2 骨質疏鬆症的高危因素","p":54,"v":"少接觸陽光"},{"i":"m1r3aeeb","u":"u3","t":"g","q":"按課本，咖啡、茶、可樂一日飲用超過多少杯，屬骨質疏鬆症的高危因素之一？","c":"三杯","w":["一杯","兩杯","五杯"],"a":2,"e":"過多咖啡因（咖啡、茶、可樂一日超過三杯）是高危因素；治療護理上亦建議減少攝取咖啡因，因為咖啡因會減少鈣的吸收。","s":"3.1.1.2.2 骨質疏鬆症的高危因素","p":54,"v":"過多咖啡因（啡、茶、可樂一日超過三杯）"},{"i":"mhfzjpj","u":"u3","t":"n","q":"骨質疏鬆症患者較易出現壓迫性骨折（Compression Fracture）的部位是：","c":"脊椎、橈骨（手腕）、髖關節","w":["肋骨、鎖骨、頭顱","指骨、趾骨、髕骨","肩胛骨、尺骨、腕骨"],"a":0,"e":"骨質流失通常沒有徵狀；流失至一定程度可引發壓迫性骨折，當中以脊椎、橈骨（手腕）和髖關節較易出現。","s":"3.1.1.2.3 徵狀","p":55,"v":"當中以脊椎、橈骨（手腕）和髖關節較易出現有關骨折"},{"i":"mmn8yfd","u":"u3","t":"o","q":"骨關節炎（退化性關節炎）的主要病變是：","c":"關節軟骨被磨損，關節腔變得狹窄","w":["尿酸結晶沉積於關節軟組織","免疫系統異常，造成關節慢性發炎","關節囊攣縮，失去彈性"],"a":3,"e":"骨關節炎：軟骨被磨損，關節腔變窄，硬骨暴露於關節面，活動便會引起發炎和疼痛。「免疫系統異常，造成關節慢性…」是類風濕性關節炎；「尿酸結晶沉積於關節軟組織」是痛風；「關節囊攣縮，失去彈性」是肩周炎。","s":"3.1.2.1 骨關節炎／退化性關節炎","p":55,"v":"主要是因關節處的軟骨被磨損，關節腔會變得狹窄"},{"i":"m1232k4c","u":"u3","t":"g","q":"只影響關節、不損害內臟器官，主要影響負重關節（下肢關節如膝、足踝、髖）的是：","c":"骨關節炎","w":["類風濕性關節炎","痛風症","腕管綜合症"],"a":1,"e":"和其他類型的關節炎不同，骨性關節炎不損害內臟器官，主要影響負重的關節。類風濕性關節炎屬系統性疾病，可影響眼睛視力、心肺機能等。","s":"3.1.2.1 骨關節炎／退化性關節炎","p":55,"v":"骨性關節炎不損害內臟器官","k":"工作紙二 第 6 題"},{"i":"m6dzg6l","u":"u3","t":"o","q":"關於類風濕性關節炎，下列何者正確？","c":"屬免疫系統異常，造成關節慢性發炎，受影響的關節多為對稱性","w":["主要影響負重的下肢關節，且不損害內臟器官的退化疾病","由尿酸結晶沉積於關節軟組織所引致的炎症疾病","純因關節軟骨長期磨損而退化，並以單側關節為主"],"a":3,"e":"RA＝免疫系統異常、系統性疾病、關節對稱性受影響、有晨僵。「主要影響負重的下肢關節，且…」描述骨關節炎；「由尿酸結晶沉積於關節軟組織…」是痛風；「純因關節軟骨長期磨損而退化…」是骨關節炎的成因。","s":"3.1.2.2 類風濕性關節炎","p":56,"v":"屬於本港常見的風濕科病症，是一種免疫系統異常而出現的疾病，會造成關節的慢性發炎"},{"i":"m13xxhe4","u":"u3","t":"o","q":"「對稱性」的關節炎，即患者身體左右兩邊的同一關節同時出現病徵和感到痛楚，是：","c":"類風濕性關節炎","w":["骨關節炎","痛風症","腕管綜合症"],"a":2,"e":"類風濕性關節炎受影響的關節通常為「對稱性」；常見受影響部位：手腕、手指聯接關節和膝蓋。","s":"3.1.2.2 類風濕性關節炎","p":56,"v":"受影響的關節通常為對稱性，即患者身體左右兩邊的關節會同時出現病徵和感到痛楚","k":"工作紙二 第 5 題"},{"i":"mh3bbrs","u":"u3","t":"o","q":"痛風症是因血液內哪種物質的濃度升高而引起的疾病？","c":"尿酸","w":["膽固醇","乳酸","葡萄糖"],"a":1,"e":"進食高普林（嘌呤）食物，普林在體內新陳代謝後變成尿酸；有些人受遺傳影響，體內傾向產生過量尿酸而引致疾病。","s":"3.1.2.3 痛風症","p":56,"v":"體內會傾向於產生過量的尿酸，因而引致疾病","k":"工作紙二 第 4 題"},{"i":"m1qy5jxe","u":"u3","t":"g","q":"下列哪種成份含量高的食物（如酒、動物內臟、海產及貝殼類）會誘發痛風？","c":"普林／嘌呤（Purine）","w":["維他命 C","鈣質","纖維素"],"a":0,"e":"進食含高「普林／嘌呤」成份的食物，普林在體內經過新陳代謝後就會變成尿酸。","s":"3.1.2.3 痛風症","p":56,"v":"進食一些含高「普林/嘌呤（Purine）」成份的食物"},{"i":"m1kyrgjm","u":"u3","t":"g","q":"痛風長遠可在關節形成什麼，令關節腫脹變形，亦增加出現腎衰竭的風險？","c":"痛風石","w":["骨刺","鈣化硬塊","壓迫性骨折"],"a":3,"e":"尿酸形成結晶結石沉積於關節的軟組織中，導致免疫系統過敏反應及持續的炎症；長遠甚至可在關節形成痛風石。","s":"3.1.2.3 痛風症","p":57,"v":"長遠甚至可在關節形成痛風石"},{"i":"mc6ijxi","u":"u3","t":"n","q":"52 歲肥胖男士，晚上進食大量海鮮及啤酒，翌晨右大拇趾關節突然紅腫劇痛，皮膚溫熱。最可能的病症是：","c":"痛風","w":["骨關節炎","類風濕性關節炎","腕管綜合症"],"a":0,"e":"高嘌呤飲食（酒、海產、貝殼類、動物內臟）＋中年肥胖男性＋大拇趾關節突然紅腫劇痛、皮膚溫熱，是痛風的典型表現。","s":"3.1.2.3.2 痛風徵狀","p":57,"v":"通常大拇趾（即腳趾公）關節突然變得紅腫及劇痛","sc":1},{"i":"miih8de","u":"u3","t":"g","q":"「沿著某個特定的末梢神經路線所引發的疼痛」稱為：","c":"神經痛","w":["肌肉痛","關節痛","骨痛"],"a":1,"e":"神經痛一般依照疼痛發生的部位及造成病因的神經來命名，如坐骨神經痛及三叉神經痛。","s":"3.1.3.1 神經損傷","p":58,"v":"沿著某個特定的末梢神經路線所引發的疼痛，稱為神經痛"},{"i":"m1b30d90","u":"u3","t":"g","q":"下列哪項是神經痛的特性？","c":"突然產生劇烈疼痛，時間雖短但會反覆發生","w":["疼痛持續整天，程度穩定而不會間斷","疼痛位置廣泛，與特定的神經路線無關","疼痛只在劇烈運動之後才會出現"],"a":2,"e":"神經痛特性：疼痛的部份與特定的神經路一致；突然產生劇烈疼痛，時間雖短但會反覆發生；嚴重時輕微的壓力或刺激到皮膚亦會感覺疼痛。","s":"3.1.3.1.1 神經痛的特性","p":58,"v":"突然產生劇烈疼痛，疼痛的時間雖短，但是會反覆發生"},{"i":"mi9lbc1","u":"u3","t":"n","q":"一位病人疼痛位於單邊臀部、大腿後側、小腿至腳踝，並有下肢麻痺。最可能的病因是：","c":"坐骨神經痛（椎間盤突出或坐骨神經受壓）","w":["三叉神經痛（面部劇烈疼痛）","腕管綜合症（正中神經受壓）","網球肘（肘關節外側發炎）"],"a":2,"e":"坐骨神經痛：疼痛位置為單邊臀部、大腿後側、小腿、腳跟、腳踝，可伴下肢麻痺、知覺遲鈍、行走困難。三叉神經痛則發生在面部。","s":"3.1.3.1.2 神經痛的種類（b 坐骨神經痛）","p":58,"v":"疼痛部位為單邊的臀部和大腿後側、小腿、腳跟、腳踝等","sc":1},{"i":"m1fqd00","u":"u3","t":"o","q":"腕管綜合症是哪一條神經受壓所致？","c":"正中神經","w":["尺神經","橈神經","坐骨神經"],"a":3,"e":"腕管的大小由骨骼結構及形狀決定，不能改變，因此任何腫脹都有機會造成正中神經的壓迫。","s":"3.1.4.1 腕骨隧道候群／腕管綜合症","p":59,"v":"因此任何腫脹都有機會造成正中神經的壓迫"},{"i":"m1r0l2gp","u":"u3","t":"g","q":"腕管綜合症晚期會引致：","c":"拇指大魚際肌肉萎縮，影響拇指功能","w":["小指肌肉萎縮","肩關節硬化","手指關節紅腫變形"],"a":1,"e":"徵狀：重複手部或腕部運動後手部麻痺；拇指、食指和中指感覺障礙；敲打腕部正中神經時有觸電感；晚期拇指大魚際肌肉萎縮。","s":"3.1.4.1.2 徵狀","p":59,"v":"晚期會引致拇指大魚際肌肉萎縮，影響拇指功能"},{"i":"m1akwqag","u":"u3","t":"n","q":"文員長時間打字後，出現拇指、食指、中指麻痺，敲打腕部時有觸電感。最可能是：","c":"腕管綜合症","w":["高爾夫球肘","肩周炎","痛風"],"a":0,"e":"腕管綜合症：正中神經受壓。預防：適時放鬆雙手，每 15-20 分鐘稍歇並伸展手腕，避免過份屈曲手腕及把手腕壓在堅硬的表面。","s":"3.1.4.1.2 徵狀","p":59,"v":"拇指、食指和中指出現感覺障礙","sc":1},{"i":"m9j84qc","u":"u3","t":"g","q":"肩周炎（五十肩／凝肩）主要的病變是：","c":"關節囊攣縮，失去彈性","w":["肌腱發炎","軟骨磨損","肩胛骨骨折"],"a":0,"e":"肩周炎主要病變為關節囊攣縮、失去彈性；成因可能因創傷或勞損引致，但主因不詳。","s":"3.1.4.2 肩周炎（五十肩／凝肩）","p":59,"v":"主要的病變為關節囊攣縮，失去彈性"},{"i":"m1nbznzl","u":"u3","t":"g","q":"下列何者是肩周炎的徵狀？","c":"肩關節疼痛及活動受阻，影響穿衣、梳頭、洗澡","w":["拇指、食指及中指感覺障礙，敲打腕部有觸電感","肘關節外側痛楚，緊握或扭毛巾時酸痛無力","大拇趾關節突然紅腫劇痛，皮膚溫熱"],"a":1,"e":"肩周炎：肩關節出現疼痛、活動受阻礙，影響日常生活。「拇指、食指及中指感覺障礙，…」是腕管綜合症；「肘關節外側痛楚，緊握或扭毛…」是網球肘；「大拇趾關節突然紅腫劇痛，皮…」是痛風。","s":"3.1.4.2.2 徵狀","p":59,"v":"由於疼痛及活動受阻，影響日常生活，如穿衣、梳頭、洗澡、提重物等"},{"i":"mzh1uae","u":"u3","t":"r","q":"肩周炎的四個階段中，「自發性肩關節疼痛減少，而肩關節硬化卻變得嚴重」屬於：","c":"第三階段","w":["第一階段","第二階段","第四階段"],"a":3,"e":"第一階段：疼痛是主要徵狀，活動機能開始受阻；第二階段：疼痛加劇甚至影響睡眠，肩關節逐漸硬化；第三階段：疼痛減少但硬化嚴重；第四階段：硬化逐漸改善，可恢復活動機能。各階段長短因人而異。","s":"3.1.4.2.3 肩周炎的四階段","p":60,"v":"自發性肩關節疼痛減少，而肩關節硬化卻變得嚴重"},{"i":"mxfswmc","u":"u3","t":"r","q":"網球肘（肱骨外上髁炎）的典型徵狀是：","c":"肘關節外側痛楚，緊握或提重物時酸痛無力，外髁有壓痛點","w":["手肘內側疼痛，按壓前臂肌肉時特別痛楚","拇指、食指及中指麻痺，敲打腕部有觸電感","肩關節疼痛及活動受阻，穿衣梳頭困難"],"a":2,"e":"網球肘＝外上髁（伸腕肌腱）；內側（內上髁）則是高爾夫球肘。拇指／食指／中指麻痺是腕管綜合症；肩活動受阻是肩周炎。","s":"3.1.4.4.2 徵狀","p":60,"v":"在肘關節外側感到痛楚"},{"i":"mwtjx5l","u":"u3","t":"r","q":"提舉重物時，哪些腰椎所承受的壓力最大，受傷機會亦最高？","c":"腰椎第 3 至 5 節","w":["腰椎第 1 至 2 節","胸椎第 10 至 12 節","頸椎第 5 至 7 節"],"a":2,"e":"最常見的腰背痛位置是下背部，因它承受了大部分身體的重量和壓力；提舉重物時，腰椎第 3 至 5 節受傷機會最高（約 95%）。","s":"3.1.4.6 腰背痛","p":61,"v":"提舉重物時，腰椎第3至5節所承受的壓力最大"},{"i":"manbquf","u":"u3","t":"r","q":"下列何者是腰背痛的成因之一？","c":"長期不良姿勢，或提舉過重物件","w":["經常曬太陽，令維他命 D 過多","進食過多含嘌呤食物，令尿酸過高","肌肉長期過度放鬆，缺乏任何壓力"],"a":0,"e":"腰背痛成因：長期不良姿勢；提舉過重物件或不正確抬舉動作；背部勞損或創傷；退化性病患如骨質疏鬆症、脊椎關節或椎間盤受到刺激、先天性脊椎異常。","s":"3.1.4.6.1 成因","p":61,"v":"提舉過重物件或不正確抬舉動作"},{"i":"myncsmf","u":"u3","t":"o","q":"關於缺血性中風，下列何者正確？","c":"較常見，佔中風病例超過 70%，多因腦血管狹窄或栓塞","w":["不常見，佔中風病例不足 30%，多因腦血管爆裂","因腦內血管爆裂，血液流入腦組織內，俗稱「爆血管」","多與先天性腦血管病變導致血管破裂有關"],"a":1,"e":"缺血性中風佔 70% 以上；出血性中風（爆血管）多與長期高血壓有關。小中風（TIA）症狀雖不超過 5 分鐘，通常 24 小時內完全緩解，但往往是中風前的跡象，不容忽視。","s":"3.2.1.1 成因（a 缺血性中風）","p":62,"v":"缺血性中風較常見，佔中風病例超過70%"},{"i":"m139yu9m","u":"u3","t":"o","q":"出血性中風的成因是：","c":"腦內血管爆裂，血液流入腦組織內，俗稱「爆血管」","w":["腦血管硬化導致血管變窄或栓塞","心臟或頸動脈的栓子游離到腦血管","小血塊短暫堵塞血管，症狀 24 小時內緩解"],"a":3,"e":"出血性中風多與長期性高血壓有關，部分與先天性腦血管病變（如腦血管腫瘤導致血管破裂）有關。","s":"3.2.1.1 成因（b 出血性中風）","p":62,"v":"由於腦內血管爆裂，血液流入腦組織內，俗稱「爆血管」","k":"工作紙二 第 7 題"},{"i":"mf24vyu","u":"u3","t":"r","q":"下列哪項是常見的中風病徵？","c":"半身不遂（肢體癱瘓）","w":["手腳震顫","大拇趾關節紅腫","近視及夜盲"],"a":3,"e":"中風病徵：半身不遂、言語不清、嘴歪眼斜、流口水、吞嚥困難、大小便失禁、感覺麻木，嚴重者昏迷或死亡。手腳震顫是柏金遜症的徵狀。","s":"3.2.1.2 徵狀","p":62,"v":"半身不遂（肢體癱瘓）"},{"i":"m14nxn9v","u":"u3","t":"g","q":"下列哪項是中風後常見的問題及併發症？","c":"壓瘡","w":["痛風石","網球肘","三叉神經痛"],"a":2,"e":"中風後常見：情緒問題（沮喪、抑鬱、易怒）、呼吸道／泌尿道感染、壓瘡、吞嚥困難、便秘。","s":"3.2.1.4 中風後常見之問題及併發症","p":63,"v":"中風後常見之問題及併發症"},{"i":"m18gifai","u":"u3","t":"o","q":"柏金遜症主要是因腦幹內「黑質」退化，未能產生足夠的哪種神經傳導物質？","c":"多巴胺","w":["血清素","乙醯膽鹼","腎上腺素"],"a":0,"e":"柏金遜症因腦幹內稱作「黑質」的部位退化，未能產生足夠的神經傳導物質「多巴胺」，令腦部指揮肌肉活動的功能受損，大大阻礙患者的活動能力。","s":"3.2.2 柏金遜症","p":63,"v":"未能產生足夠的神經傳導物質「多巴胺」","k":"工作紙二 第 8 題"},{"i":"mz5ei6m","u":"u3","t":"o","q":"長者行路時身軀前傾、以急促碎步向前衝，起步及轉彎特別困難，並有手腳震顫。最可能是：","c":"柏金遜症","w":["阿茲海默氏症","血管性認知障礙症","骨關節炎"],"a":1,"e":"柏金遜症徵狀：肌肉僵硬、手腳震顫、面部表情呆滯、失去平衡、身軀前傾、急促碎步前衝、起步及轉彎困難。","s":"3.2.2.2 徵狀","p":64,"v":"失去平衡力，容易跌倒，身軀前傾，因此，患者慣於在步後，即以急促碎步向前衝，起步及轉彎時尤其困難","sc":1},{"i":"m2a0uba","u":"u3","t":"o","q":"關於柏金遜症患者，下列何者正確？","c":"大部分患者思維清晰，認知能力正常，主要影響活動能力","w":["大部分患者一開始便完全喪失認知及記憶能力","主要影響患者的視力及聽力，活動能力正常","主要徵狀是大小便失禁及神志不清，常有昏迷"],"a":0,"e":"柏金遜症主要影響身體的活動能力；部分患者於後期同時出現認知能力減退，但與認知障礙症是兩種不同的疾病。","s":"3.2.2.2 徵狀","p":63,"v":"大部分患者的思想及認知能力均正常，思維清晰"},{"i":"m7x665d","u":"u3","t":"o","q":"認知障礙症患者受影響的認知能力包括：","c":"記憶、理解、語言、學習、計算和判斷能力","w":["視力、聽力、嗅覺、味覺和觸覺等感官功能","肌肉力量、關節活動、平衡和協調能力","呼吸、心跳、血壓和體溫調節的功能"],"a":2,"e":"認知障礙症是因大腦神經細胞病變而引致大腦功能缺損或不正常衰退，患者的認知能力會受影響，部分亦有情緒、行為及感覺等方面的變化。","s":"3.2.3 認知障礙症","p":64,"v":"認知能力（記憶、理解、語言、學習、計算和判斷能力）會受影響"},{"i":"mx9sf9u","u":"u3","t":"g","q":"關於阿茲海默氏症與血管性認知障礙症，下列何者正確？","c":"阿茲海默氏症最常見（約 50-70%），衰退漸進；血管性衰退多呈梯級式","w":["阿茲海默氏症的衰退呈梯級式；血管性的衰退則是漸進式","血管性認知障礙症佔 50-70%，是本港最常見的類型","兩者目前都已有根治方法，只需及早服藥便可痊癒"],"a":1,"e":"血管性（多發梗塞性）因多次輕微中風，每中風一次腦功能便再退化一級；兩者暫未有根治方法，藥物只可改善早期患者記憶及減輕病徵。","s":"3.2.3.1 成因","p":64,"v":"血管性認知障礙症（多發梗塞性痴呆症）：是第二常見的認知障礙症"},{"i":"m6634qq","u":"u3","t":"r","q":"認知障礙症「中期」的徵狀是：","c":"情緒不穩，容易動怒，日夜顛倒，四處走動，需家人協助","w":["近期記憶力衰退，思考能力減低，但仍可自理","無法認出家人，大小便失禁，說話遲鈍","說話和理解力遲鈍，完全喪失自我照顧能力"],"a":3,"e":"早期：近期記憶力衰退，思考能力減低；中期：情緒不穩、容易動怒、日夜顛倒、四處走動；晚期：無法認出家人、大小便失禁、說話和理解力遲鈍、完全喪失自我照顧能力。","s":"3.2.3.2 徵狀","p":65,"v":"中期：情緒不穩，容易動怒，日夜顛倒，四處走動"},{"i":"m10z5gnk","u":"u3","t":"g","q":"關於柏金遜症和認知障礙症，下列何者正確？","c":"兩者是不同的疾病，但部分柏金遜症患者後期會出現認知能力減退","w":["兩者是同一種疾病的不同名稱，症狀及成因完全相同","柏金遜症患者最終必然會患上認知障礙症","認知障礙症患者必然有手腳震顫及肌肉僵硬"],"a":1,"e":"課本特別提醒：同學必須將兩者清楚分開。年紀愈大的柏金遜症患者，出現認知能力障礙的機會愈大。","s":"3.2.3 認知障礙症","p":64,"v":"柏金遜症和認知障礙症是兩種不同的疾病"},{"i":"m1qyh9jz","u":"u4","t":"g","q":"下列何者屬於電療（如 TENS）的禁忌？","c":"植有心臟起搏器或腦部深層刺激器","w":["肌肉痠痛","慢性關節痛","輕微肌肉緊張"],"a":2,"e":"電療禁忌：植有心臟起搏器／腦部深層刺激器、患有皮膚病的部位、孕婦盤腔部位、不能配合指示的病人。（工作紙三 TENS 第 6 項為★重點：向病人確認沒有電療禁忌症。）","s":"4.1.1.1 電療的禁忌","p":66,"v":"植有心臟起搏器／腦部深層刺激器"},{"i":"m1ypvhhw","u":"u4","t":"g","q":"下列哪一項「不是」電療的禁忌？","c":"慢性肌肉緊張","w":["孕婦盤腔部位","患有皮膚病的部位","不能配合指示的病人"],"a":3,"e":"電療禁忌共 4 項：植有心臟起搏器／腦部深層刺激器、患有皮膚病的部位、孕婦盤腔部位、不能配合指示的病人。肌肉緊張反而是電療可以處理的問題。","s":"4.1.1.1 電療的禁忌","p":66,"v":"孕婦盤腔部位"},{"i":"m1dqtgx8","u":"u4","t":"g","q":"進行電療前，助理應測試病人的：","c":"表皮感覺（如尖銳與鈍的感覺、冷熱感）","w":["血糖水平（如空腹及進食後兩小時的血糖）","關節活動幅度（如屈曲及伸展的角度）","肌肉力量（如握力及抬腿的力量）"],"a":0,"e":"電療前的準備：確定病人沒有禁忌症、測試表皮感覺、檢查及確保電療儀器運作正常、預備所需的配件。","s":"4.1.1.2 電療前的準備","p":66,"v":"測試表皮感覺（如：尖銳及鈍的感覺、冷熱感）","k":"工作紙三(二) TENS 第 5 項"},{"i":"m1rqgbe8","u":"u4","t":"n","q":"「使用方便，但成本較高，且導電性能隨使用次數下降、需不時更換」的是哪種電極？","c":"自黏電極貼","w":["膠碳電極貼","海綿電極","金屬電極板"],"a":3,"e":"自黏電極貼：使用方便、成本較高、導電性能隨使用次數下降。膠碳電極貼：清潔容易、可重複使用、需要導電啫喱、準備需時。","s":"4.1.1.3 電極貼的種類","p":66,"v":"導電性能隨使用次數下降，需不時更換"},{"i":"m1m7q4u8","u":"u4","t":"n","q":"適合用於毛髮密集位置，導電效能良好，但需留意清潔問題的是哪種電極？","c":"海綿電極","w":["自黏電極貼","膠碳電極貼","金屬電極板"],"a":0,"e":"海綿電極：可用於毛髮密集位置、導電效能良好、需留意清潔問題。膠碳電極貼可重複使用，但需要導電啫喱及準備需時。","s":"4.1.1.3 電極貼的種類","p":66,"v":"可用於毛髮密集位置"},{"i":"mdva2t7","u":"u4","t":"o","q":"TENS 在合適的強度、頻率及時間刺激下，能刺激身體釋放什麼，產生類似麻醉劑的鎮痛作用？","c":"內啡呔（Endorphins）","w":["胰島素","腎上腺素","多巴胺"],"a":2,"e":"TENS 經常使用，能刺激身體釋放內啡呔，減少或阻止疼痛信號傳遞到大腦。","s":"4.1.1.4.1 透皮神經治療機（TENS）a 特性","p":67,"v":"能刺激身體釋放內啡呔（Endorphins）"},{"i":"mv9xd52","u":"u4","t":"g","q":"使用 TENS 時，患者在局部通常會感到：","c":"針刺感及輕微震動","w":["強烈灼熱感","完全沒有感覺","肌肉被拉扯至全幅度收縮"],"a":1,"e":"TENS 啟動時，患者在局部可以感到針刺感及輕微震動。完全沒有特別感覺是超聲波；肌肉看得見的收縮是 NMES。","s":"4.1.1.4.1 透皮神經治療機（TENS）a 特性","p":67,"v":"患者在局部可以感到針刺感及輕微震動"},{"i":"msvu5my","u":"u4","t":"r","q":"下列哪項是 TENS 的功能？","c":"舒緩長期疼痛及鬆弛肌肉緊張","w":["刺激新血管生長及瓦解鈣化性沉澱物","有針對性地誘發肌肉收縮，以重建肌肉","防止產生軟組織之黏連"],"a":2,"e":"TENS 功能：舒緩長期疼痛、鬆弛肌肉緊張，部分模式或使用較大輸出時可引起輕微肌肉收縮，帶來輕度促進血液循環的作用。「刺激新血管生長及瓦解鈣化性…」屬衝擊波；「有針對性地誘發肌肉收縮，以…」屬 NMES；「防止產生軟組織之黏連」屬超聲波。","s":"4.1.1.4.1 透皮神經治療機（TENS）b 功能","p":67,"v":"舒緩長期疼痛"},{"i":"m1ejkuh9","u":"u4","t":"n","q":"TENS 的治療時間應由治療師決定，一般約為：","c":"20 分鐘","w":["5 分鐘","45 分鐘","60 分鐘"],"a":0,"e":"TENS 操作：在電極貼上加導電啫喱並貼於患處 → 通知患者通電之感覺 → 按處方調較輸出電量並開啟輸出按鈕 → 治療時間一般約 20 分鐘 → 完成後關掉電源。","s":"4.1.1.4.1 透皮神經治療機（TENS）d 操作程序","p":67,"v":"治療時間應由治療師決定，一般約20分鐘"},{"i":"m14to1d1","u":"u4","t":"n","q":"TENS 治療完成後，下列哪項步驟次序正確？","c":"先關機，再拆去電極，替病人清潔皮膚及電極貼表面","w":["先拆去電極，再關機，然後替病人清潔皮膚","先替病人清潔皮膚，再關機及拆去電極","拆去電極後無需清潔，直接收起並關機"],"a":3,"e":"善後工作：替患者拆去電極及幫助患者清潔皮膚、妥善整理患者（衣服、姿勢）、清洗電極表面的導電膏、準備下一次治療。","s":"工作紙三(二) 電療機(TENS)的認識及操作技巧（第 18 項）","p":67,"v":"完成治療後，先關機，再拆去電極及替病人清潔皮膚及清潔電極貼表面（工作紙三）","k":"工作紙三(二) TENS 第 18 項"},{"i":"mt732uz","u":"u4","t":"n","q":"TENS 治療期間，若電流達至某強度，肌肉不隨意地抽動並令病人不適，助理應：","c":"知會治療師是否需要調整","w":["自行調高輸出以克服抽動","自行關機並離開","繼續治療，毋須理會"],"a":1,"e":"助理不可自行調整處方；亦要提醒病人不能自行調整電量強度，如感到刺激強度減弱或任何不適，應立即通知工作人員。","s":"4.1.1.4.1 透皮神經治療機（TENS）f 注意事項","p":68,"v":"當電流達至某強度時，肌肉可能會不隨意地抽動，可能會導致不適，應知會治療師是否需要調整","sc":1},{"i":"m12rvele","u":"u4","t":"g","q":"「經由完整的周邊神經系統傳導電流，以引起肌肉收縮」的電刺激方式是：","c":"神經肌肉電刺激（NMES）","w":["透皮神經電刺激（TENS）","干擾波治療（IFT）","超聲波治療（US）"],"a":3,"e":"NMES 特性：經由完整的周邊神經系統傳導電流，以引起肌肉收縮。","s":"4.1.1.4.2 神經肌肉電刺激（NMES）a 特性","p":68,"v":"是經由完整的周邊神經系統傳導電流，以引起肌肉收縮的一種電刺激方式"},{"i":"mj8rea3","u":"u4","t":"g","q":"NMES 的操作要點是：","c":"電極貼在肌肉的 motor point 上，必須看見肌肉收縮","w":["電極貼可隨意放在任何位置，毋須考慮肌肉位置","治療時毋須配合主動運動，只需靜止不動","只用於止痛，治療時不應看見任何肌肉收縮"],"a":0,"e":"NMES 必須配合主動運動訓練；若病人未能配合可作被動式關節活動；每組肌肉有特定的電極位置，向治療師查詢；必須看見肌肉收縮，甚或全幅度活動。","s":"4.1.1.4.2 神經肌肉電刺激（NMES）d 操作方法及注意事項","p":68,"v":"必須看見肌肉收縮，甚或是全幅度活動"},{"i":"m1ia22gt","u":"u4","t":"g","q":"NMES 的臨床應用，必須配合：","c":"主動運動訓練","w":["冷敷","牽引","超聲波"],"a":2,"e":"NMES 臨床應用：必須配合主動運動訓練應用；若病人未能配合可作被動式關節活動；肌肉再教育及誘發。","s":"4.1.1.4.2 神經肌肉電刺激（NMES）b 臨床應用","p":68,"v":"必須配合主動運動訓練應用"},{"i":"m1dkuqbk","u":"u4","t":"o","q":"干擾波電療（IFT）是由什麼聚合產生的？","c":"兩個中頻交變電流","w":["兩個低頻直流電","一個高頻聲波","兩個高頻電磁波"],"a":1,"e":"干擾波電療是由兩個中頻交變電流聚合產生的。TENS 屬低頻電療；短波屬高頻電療。","s":"4.1.1.4.3 干擾波電療儀（IFT）a 特性","p":69,"v":"干擾波電療是由兩個中頻交變電流聚合產生的"},{"i":"mh3g0f6","u":"u4","t":"g","q":"進行干擾波治療時，患者通常會感到：","c":"「過電」的感覺（針刺感），肌肉會不隨意抽動","w":["完全沒有特別感覺，亦不會有任何肌肉抽動","患處有一定程度的酸及疼痛，聚焦處最明顯","強烈的熱燙感，皮膚須時刻留意是否燙傷"],"a":2,"e":"IFT：患者治療時會感到一種「過電」的感覺（針刺感），肌肉會不隨意地抽動。超聲波則沒有特別感覺；衝擊波患處會酸痛。","s":"4.1.1.4.3 干擾波電療儀（IFT）a 特性","p":69,"v":"患者在治療時會感到一種「過電」的感覺（針刺感）"},{"i":"mvjuhr0","u":"u4","t":"o","q":"干擾波治療機的「吸盤」有什麼作用？","c":"按摩作用","w":["加熱作用","冷卻作用","固定電極位置"],"a":1,"e":"IFT 功能：深層止痛、鬆弛肌肉緊張、促進血液循環並減輕關節或肌肉的炎症，吸盤有按摩作用。","s":"4.1.1.4.3 干擾波電療儀（IFT）b 功能","p":69,"v":"吸盤有按摩作用"},{"i":"m1n4odh7","u":"u4","t":"r","q":"下列哪項是干擾波電療（IFT）的功能？","c":"深層止痛、鬆弛肌肉緊張，促進血液循環並減輕炎症","w":["只作表淺止痛，不能放鬆肌肉或促進血液循環","刺激新血管生長及瓦解鈣化性沉澱物","使肌肉全幅度收縮，以重建肌肉的力量"],"a":3,"e":"IFT 功能共 4 項：深層止痛、鬆弛肌肉緊張、促進血液循環減輕炎症、吸盤有按摩作用。「刺激新血管生長及瓦解鈣化性…」屬衝擊波；「使肌肉全幅度收縮，以重建肌…」屬 NMES。","s":"4.1.1.4.3 干擾波電療儀（IFT）b 功能","p":69,"v":"促進血液循環，減輕關節或肌肉的炎症"},{"i":"myrqrvz","u":"u4","t":"r","q":"進行干擾波治療前，助理的預備工作包括：","c":"準備圓形海綿及水、毛巾及防水膠墊，並清潔皮膚的油脂及藥膏","w":["準備導電啫喱及紙巾，並在輸出頭加上治療啫喱","預備冰袋、濕毛巾及彈性繃帶，並將患處抬高","預備護目眼罩及警告告示，並於門外貼出警告"],"a":0,"e":"IFT 預備：圓形海綿及水、毛巾、防水膠墊、清潔患者皮膚上的油脂及藥膏。導電啫喱及紙巾是超聲波／衝擊波的預備；護目眼罩及警告告示是激光的注意事項。","s":"4.1.1.4.3 干擾波電療儀（IFT）c 預備工作","p":69,"v":"準備足夠數量的防水膠墊"},{"i":"m81c3hc","u":"u4","t":"n","q":"干擾波治療時，兩組電極需要以什麼方式擺放？","c":"對角交叉","w":["互相平行","重疊放在同一位置","圍繞關節一圈"],"a":1,"e":"IFT 由兩個中頻交變電流聚合而成，兩組電極需以對角交叉方式擺放；圓形海綿濕水扭乾後放入吸盤，待吸盤吸緊在皮膚上。","s":"4.1.1.4.3 干擾波電療儀（IFT）d 操作程序","p":69,"v":"兩組電極需要以對角交叉方式擺放"},{"i":"m1x8cmnb","u":"u4","t":"o","q":"超聲波治療儀（US）是由電流通過晶體而產生的：","c":"高頻率聲波","w":["中頻交變電流","低頻脈衝電流","紅外線"],"a":3,"e":"當超聲波遇到纖維組織時會引起震動而產生熱量，主要用於治療軟組織損傷，例如肌肉、韌帶、肌腱或關節膜的損傷。","s":"4.1.2.1 超聲波治療儀（US）a 特性","p":70,"v":"由電流通過晶體而產生的高頻率聲波"},{"i":"m10kl0pk","u":"u4","t":"o","q":"一般情況下，進行超聲波治療時，病人會：","c":"沒有特別感覺","w":["感到明顯針刺感及肌肉抽動","感到患處酸痛","感到強烈的熱燙感"],"a":2,"e":"正常情況下，超聲波治療時應沒有特別感覺。針刺感及肌肉抽動屬 IFT；酸痛屬衝擊波。","s":"4.1.2.1 超聲波治療儀（US）e 操作程序","p":71,"v":"正常情況下，治療時應沒有特別感覺"},{"i":"mwr9yuu","u":"u4","t":"r","q":"下列哪項是超聲波治療的功能？","c":"消炎、消腫、止痛，並防止產生軟組織黏連","w":["刺激新血管生長，並瓦解鈣化性沉澱物","鬆弛肌肉緊張，並以吸盤產生按摩作用","誘發針對性的肌肉收縮，以重建肌肉力量"],"a":0,"e":"超聲波功能：消炎、消腫、止痛；改善血液循環，加速復原；防止產生軟組織之黏連。","s":"4.1.2.1 超聲波治療儀（US）b 功能","p":70,"v":"防止產生軟組織之黏連"},{"i":"m1t9m4cy","u":"u4","t":"n","q":"下列哪一項「不是」超聲波治療的禁忌症？","c":"肌腱、韌帶等軟組織損傷的部位","w":["腫瘤的部位","孕婦盤腔部位","植有心臟起搏器的範圍"],"a":3,"e":"超聲波主要用於治療軟組織損傷（肌肉、韌帶、肌腱、關節膜），屬適應症。禁忌：起搏器／腦部深層刺激器範圍、皮膚病部位、孕婦盤腔、腫瘤部位、不能配合指示的病人。","s":"4.1.2.1 超聲波治療儀（US）c 禁忌症","p":70,"v":"腫瘤的部位"},{"i":"mvsxvzi","u":"u4","t":"n","q":"使用超聲波治療時，下列哪項做法正確？","c":"治療時用輸出頭在患處不斷打圈","w":["輸出頭固定在同一點以加強效果","沒有導電啫喱也可開機","輸出頭碰撞後只要看似完好便可繼續使用"],"a":0,"e":"超聲波輸出太高時，組織急劇升溫會燒傷，故要不斷打圈；切勿在沒有導電啫喱／水的情況下開機；輸出頭容易因碰撞而損壞，如不慎跌撞必須通知治療師檢查。","s":"4.1.2.1 超聲波治療儀（US）e、g","p":71,"v":"治療時用輸出頭在患處打圈"},{"i":"m1seafee","u":"u4","t":"n","q":"助理清潔儀器時不慎令超聲波輸出頭碰撞跌地，外觀看似完好。助理應：","c":"通知治療師，由其檢查後才再使用","w":["繼續使用，只要輸出頭看似完好","加多導電啫喱以補償","調高輸出強度以補償"],"a":2,"e":"超聲波輸出頭容易因碰撞而損壞，影響輸出，甚至報廢；如不慎有任何跌撞，必須通知治療師作檢查。","s":"4.1.2.1 超聲波治療儀（US）g 注意事項","p":71,"v":"超聲波輸出頭容易因踫撞而損壞","sc":1},{"i":"m1a197hb","u":"u4","t":"n","q":"衝擊波治療與超聲波治療的關係是：","c":"衝擊波屬高能量聲波類治療，但與超聲波在波形、頻率及能量差別很大","w":["兩者完全相同，只是名稱不同，在波形及頻率上沒有分別","衝擊波是中頻電流治療，超聲波是高頻電流治療","衝擊波的能量比超聲波低，故不適用於骨骼及筋腱疾病"],"a":1,"e":"體外衝擊波治療骨骼及筋腱疾病，源於震波碎腎石的概念；廣泛應用於鈣化性肌腱炎、足底筋膜炎、網球肘等；亦用作治療骨折癒合不良和骨壞死。","s":"4.1.2.2 衝擊波治療儀 a 特性","p":71,"v":"衝擊波是一種高能量的聲波類治療"},{"i":"mwpeq76","u":"u4","t":"n","q":"下列哪一項「不是」衝擊波治療的禁忌症？","c":"足底筋膜炎","w":["孕婦","服用影響血凝固的藥物","金屬植入物／傷口位置"],"a":0,"e":"足底筋膜炎、鈣化性肌腱炎、網球肘等屬衝擊波的適應症。禁忌：孕婦、起搏器、影響血凝固藥物、胸部／肺部附近、痛症部位附近有腫瘤、金屬植入物／傷口位置。","s":"4.1.2.2 衝擊波治療儀 c 禁忌症","p":71,"v":"服用影響血凝固的藥物"},{"i":"myppv5b","u":"u4","t":"n","q":"體外衝擊波治療過程中，患處通常會有：","c":"一定程度的酸及疼痛","w":["沒有特別感覺","針刺及輕微震動","「過電」感及肌肉不隨意抽動"],"a":2,"e":"衝擊波應由治療師操作；治療過程中患處會有一定程度的酸、疼痛，而當衝擊波聚焦於非患處時患者通常不會感到不適。","s":"4.1.2.2 衝擊波治療儀 e 操作時的注意事項","p":72,"v":"體外衝擊波治療過程中，患處會有一定程度的酸、疼痛","k":"工作紙三(一) 衝擊波"},{"i":"mxmao7h","u":"u4","t":"r","q":"下列哪項是熱療的功能？","c":"增加血液循環及肌肉伸展性，減低關節痛楚及僵硬度","w":["使血管收縮，減輕患處腫脹及減慢血液流入","消減急性炎症，並減輕急性疼痛及腫脹","減慢血液循環，以減少受傷部位的出血"],"a":3,"e":"熱療功能：鬆弛肌肉緊張、增加血液循環、減低關節痛楚及僵硬度、增加肌肉伸展性。使血管收縮、減輕腫脹、消減急性炎症是冷療的作用。","s":"4.1.3.1 熱療的功能","p":73,"v":"增加肌肉伸展性"},{"i":"mbalqw7","u":"u4","t":"n","q":"下列何者是熱療的禁忌？","c":"急性發炎","w":["慢性關節僵硬","肌肉緊張","慢性關節痛"],"a":1,"e":"熱療禁忌：癌症的腫瘤部位、傷口位置、皮膚病的部位、冷熱感知缺陷、急性發炎、不能配合指示的病人。","s":"4.1.3.2 熱療的禁忌","p":73,"v":"急性發炎"},{"i":"m11tp4a","u":"u4","t":"n","q":"進行熱療時，應時刻（如每隔多少分鐘）觀察患者皮膚狀況，以免燙傷？","c":"5 分鐘","w":["15 分鐘","30 分鐘","60 分鐘"],"a":1,"e":"熱療注意：把開關掣或求助鐘交給患者，囑咐只需保持熱但舒適；提醒患者切勿睡著；完成後呈微紅為正常；如不幸燙傷，應立即用冷水降溫並通知治療師。","s":"4.1.3.3 進行熱療時的注意事項","p":73,"v":"應時刻（如每隔5分鐘）觀察患者皮膚狀況，以免燙傷"},{"i":"m27tjp0","u":"u4","t":"n","q":"助理為病人進行熱敷，完成後發現病人皮膚被燙傷。最適當的做法是：","c":"立即用冷水降溫，並通知治療師","w":["以冰塊直接敷在傷處，待其自癒","塗上藥膏後繼續熱敷","以乾毛巾蓋好，讓病人休息"],"a":3,"e":"熱療後如患者不幸燙傷，應立即用冷水降溫並通知治療師。","s":"4.1.3.3 進行熱療時的注意事項","p":73,"v":"如患者不幸燙傷，應立即用冷水降溫，並通知治療師","sc":1},{"i":"mx7s8dc","u":"u4","t":"r","q":"下列哪種熱敷用具「熱力較低、適合冷熱感較弱的長者、可調較溫度及時間」？","c":"電熱氈","w":["熱水袋","微波爐加熱式熱敷","Hydrocollator"],"a":0,"e":"電熱氈缺點：收藏不便（用完須平放，避免摺疊）、羊毛氈套不可用水清洗。熱水袋有灌熱水燙傷危險；Hydrocollator 熱力平均持久，但需預先加熱、耗電量大。","s":"4.1.3.4.1 熱敷（a 熱敷用具）","p":73,"v":"電熱氈：熱力較低，適合冷熱感較弱人士（如長者）；可調較溫度及時間"},{"i":"m7fya5v","u":"u4","t":"r","q":"熱水袋作為熱敷用具的缺點是：","c":"灌注熱水有燙傷危險，物料硬身而影響接觸面積","w":["熱力太低，不適合冷熱感較弱的長者使用","收藏不便，用完須平放，不可摺疊收藏","需要預先加熱，耗電量大，備用時間較長"],"a":2,"e":"熱水袋優點：平價、使用方便；缺點：灌注熱水有燙傷危險、物料硬身影響接觸面積。","s":"4.1.3.4.1 熱敷（a 熱敷用具）","p":73,"v":"熱水袋：平價、使用方便；灌注熱水會有燙傷的危險；物料硬身，影響接觸面積"},{"i":"mwtleoa","u":"u4","t":"n","q":"蠟療的正確操作參數是：","c":"52-55℃；浸 5-8 層；敷 15-20 分鐘","w":["40-45℃；浸 5-8 層；敷 15-20 分鐘","52-55℃；浸 1-2 層；敷 5 分鐘","60-65℃；浸 5-8 層；敷 30-40 分鐘"],"a":1,"e":"蠟療：使用前 1 小時開機待蠟溶化；測試溫度 52-55℃；接受治療部位浸 5-8 層，每層待前一層變白稍乾才加；套上膠袋及棉套保溫，敷 15-20 分鐘。","s":"4.1.3.4.4 蠟療機（b 操作程序）","p":76,"v":"測試溫度在52-55℃之間"},{"i":"m1wco0t4","u":"u4","t":"n","q":"進行短波治療時，下列何者最為重要？","c":"病人體內外及治療範圍內不可有任何金屬物品（包括電話）","w":["在治療部位塗上足夠的導電啫喱，以助能量傳導","先以冰袋預冷皮膚，以免被短波加熱後燙傷","使用附金屬部件的座椅，以增加病人坐姿穩定"],"a":3,"e":"短波屬高頻電磁波，任何金屬（帶上或在體內）都容易燒傷患者；電子產品亦會受損；不可使用有金屬部件的座椅。","s":"4.1.3.4.3 短波治療儀 b 禁忌症","p":75,"v":"進行此項治療時必須特別小心，病人體內外不可有任何金屬"},{"i":"m183rho3","u":"u4","t":"n","q":"冷敷治療的正確做法是：","c":"以濕毛巾包裹冷敷，固定約 15-20 分鐘並記錄時間","w":["將冰袋直接貼在皮膚上，固定約 15-20 分鐘","以濕毛巾包裹冷敷，固定約 60 分鐘以加強效果","以乾毛巾包裹冷敷，每 5 分鐘更換一次位置"],"a":2,"e":"冷敷：預備合適冷敷用具 → 以濕毛巾包裹 → 放於患處固定約 15-20 分鐘並記錄時間 → 提醒勿睡著、定時觀察皮膚及詢問不適 → 完成後檢視部位並通知治療師。","s":"4.1.4.5 冷療 操作程序","p":77,"v":"將冷敷放於患者需要接受治療的部位，固定冷敷位置約15-20分鐘，並記錄時間"},{"i":"mg29cmq","u":"u4","t":"n","q":"一位病人兩小時前剛扭傷腳踝，局部明顯紅腫熱痛。下列哪項物理因子最適合（在治療師指示下）使用？","c":"以濕毛巾包裹的冰袋","w":["蠟療","短波","熱水袋"],"a":0,"e":"剛受傷、紅腫熱痛屬急性炎症：冷療可減輕疼痛及腫脹、消減急性炎症；而熱療的禁忌包括「急性發炎」。","s":"4.1.4.2 冷療的功能","p":76,"v":"減輕疼痛和腫脹","sc":1},{"i":"m1oh2yml","u":"u4","t":"g","q":"牽引治療常用來治療：","c":"因脊椎神經根受壓迫所致的疼痛、麻痺或肌肉萎縮","w":["急性扭傷後出現的紅腫熱痛及局部腫脹","因皮膚感染或皮膚病而引致的紅疹及脫皮","肌肉拉傷後出現的出血及皮下瘀血"],"a":3,"e":"牽引利用牽引的拉力及時間達到治療效果，可作頸部或腰部的牽拉；功能：減輕椎間盤內部的壓力、舒整關節、改善血液循環、放鬆肌肉、減輕痛楚。","s":"4.1.5.1 牽引治療 特性","p":77,"v":"牽引常常用來治療一些因脊椎神經根受壓迫所致的疼痛、麻痺或肌肉萎縮"},{"i":"m1v1cjtg","u":"u4","t":"n","q":"牽引治療的操作注意事項，下列何者正確？","c":"只有治療期間才可鬆開滑動裝置；須給病人急停掣及求助鐘","w":["治療前後都應全程鬆開治療床上的滑動裝置","牽引帶只需輕輕放在身上，毋須穩固繫緊","病人獨自接受牽引時，毋須給予求助鐘"],"a":0,"e":"牽引：只有在治療期間才可鬆開治療床上的滑動裝置；必須給予病人急停掣及求助鐘；牽引帶必須舒適而穩固地繫於病人身上。","s":"4.1.5.3 牽引治療 操作時的注意事項","p":78,"v":"只有在治療期間才可鬆開治療床上的滑動裝置"},{"i":"m11qwzx","u":"u4","t":"g","q":"使用激光治療時，下列做法正確的是：","c":"戴護目眼罩，切勿直照眼睛及反射面，並在分隔區域內進行","w":["只有治療師須戴眼罩，病人在治療時毋須佩戴","可對著鏡子或反射面進行，以加強治療的效果","在開放式大廳進行，以方便其他同事觀察病人"],"a":2,"e":"激光注意事項：戴上護目眼罩；切勿直接照射眼睛；切勿直接對著鏡子或反射面；須於分隔區域內進行，並於門外貼出警告告示。","s":"4.1.6.1 激光治療 c 操作時的注意事項","p":79,"v":"切勿直接對著鏡子或反射面"},{"i":"miu1wxs","u":"u4","t":"n","q":"紫外線治療主要以哪種波長應用於皮膚科疾病的治療？","c":"UVB","w":["UVA-1","UVC","紅外線"],"a":1,"e":"紫外線治療主要以 UVB 應用於皮膚科疾病；病人及治療師需配戴護目鏡保護眼睛。UVC 大部分被大氣層中的臭氧層隔離；UVA 穿透力強，可達真皮層。","s":"4.1.6.3 紫外線","p":79,"v":"功能：主要以UVB應用於皮膚科疾病的治療"},{"i":"mosxr9k","u":"u4","t":"g","q":"運動橡筋帶（Theraband，又稱「拉力帶」）的功能是：","c":"阻力訓練","w":["平衡力訓練","上肢的關節活動","步行訓練"],"a":1,"e":"運動橡筋帶用於阻力訓練。上肢關節活動是滑輪拉繩；平衡力訓練是平衡板；步行訓練是平衡杆。","s":"4.2 運動器具的簡介及操作（運動橡筋帶）","p":82,"v":"功能：阻力訓練"},{"i":"m1tledvm","u":"u4","t":"n","q":"運動橡筋帶（Theraband）按筆記，顏色代表的阻力由大至小為：","c":"黑 ＞ 藍 ＞ 綠 ＞ 紅 ＞ 黃","w":["黃 ＞ 紅 ＞ 綠 ＞ 藍 ＞ 黑","紅 ＞ 黃 ＞ 黑 ＞ 藍 ＞ 綠","綠 ＞ 藍 ＞ 黑 ＞ 黃 ＞ 紅"],"a":2,"e":"Theraband 阻力：黑＞藍＞綠＞紅＞黃（不同牌子顏色分類可能不同）。別與泥膠混淆：泥膠阻力黃＜橙＜綠＜藍＜紫（紫最強）。","s":"4.2 運動器具的簡介及操作（運動橡筋帶）","p":82,"v":"不同顏色代表不同阻力程度（黑＞籃＞綠＞紅＞黃）"},{"i":"m15m2d70","u":"u4","t":"o","q":"使用運動橡筋帶時，活動幅度最理想為：","c":"全幅度訓練","w":["半幅度訓練","只需小幅度活動","盡量避免大幅度活動"],"a":3,"e":"橡筋帶使用要點：開始姿勢已被拉緊；除指定的肌肉及關節活動外，其他關節應保持固定；活動幅度最理想為全幅度訓練；若患者運動時太辛苦／輕鬆，轉告治療師轉換顏色。","s":"4.2 運動器具的簡介及操作（運動橡筋帶）","p":82,"v":"活動幅度最理想為全幅度訓練"},{"i":"m1m3qcf0","u":"u4","t":"g","q":"使用「滑輪拉繩」（Reciprocal Pulley）時，繩的長度應調較至：","c":"可作牽涉之關節的全幅度活動","w":["只作半幅度活動","令關節處於完全伸直","令關節固定不動"],"a":0,"e":"滑輪拉繩用作上肢的關節活動；座位要穩固；器材應作恆常檢查，確保安全。","s":"4.2 運動器具的簡介及操作（滑輪拉繩）","p":82,"v":"繩的長度應調較至可作牽涉之關節的全幅度活動"},{"i":"mk3ga6s","u":"u4","t":"n","q":"泥膠（Therapeutic Putty）的顏色與阻力的關係是：","c":"黃 ＜ 橙 ＜ 綠 ＜ 藍 ＜ 紫（紫最強）","w":["紫 ＜ 藍 ＜ 綠 ＜ 橙 ＜ 黃","黑 ＞ 藍 ＞ 綠 ＞ 紅 ＞ 黃","橙 ＜ 黃 ＜ 紫 ＜ 藍 ＜ 綠"],"a":3,"e":"泥膠用於手部及手腕訓練：改善手腕穩定性、手指抓握力，可助減壓及加強手握力，亦可冷熱敷用。顏色阻力：黃＜橙＜綠＜藍＜紫（強）。","s":"4.2 運動器具的簡介及操作（泥膠）","p":83,"v":"不同顏色代表不同阻力程度黃<橙<綠<藍<紫(強）"},{"i":"m1rkh0a6","u":"u4","t":"n","q":"平衡杆（Parallel Bar）主要用作：","c":"步行訓練","w":["上肢關節活動","手部及手腕訓練","平衡板訓練"],"a":0,"e":"平衡杆兩邊扶手提供穩定的扶手，而且扶手高度可以調教，主要用作步行訓練，或可根據物理治療師指示進行其他特別訓練。","s":"4.2 運動器具的簡介及操作（平衡杆）","p":83,"v":"主要用作步行訓練"},{"i":"mlpq20o","u":"u4","t":"n","q":"平衡板（Balance／Wobble Board）訓練，筆記強調：","c":"留意跌倒風險，通常一對一訓練，形式請諮詢物理治療師","w":["適合多人同時自行練習，毋須特別留意跌倒風險","主要用於上肢的關節活動及肌肉拉伸訓練","只適用於兒童的協調訓練，長者不宜使用"],"a":2,"e":"平衡板用作平衡力訓練；留意跌倒風險通常為一對一訓練；進行形式請諮詢物理治療師。","s":"4.2 運動器具的簡介及操作（平衡板）","p":83,"v":"留意跌倒風險通常為一對一訓練"},{"i":"m19v7lfg","u":"u4","t":"n","q":"按課本，下列何者是最好的「天然腰封」？","c":"鍛煉好的軀幹肌肉","w":["加了金屬支撐條的腰封","長期卧床休息","穿著更緊的束腰帶"],"a":1,"e":"腰封可有限度地限制腰部屈伸幅度，並以腹腔壓力提醒使用者注意發力方式；有些腰封附有金屬條和膠條聲稱作支撐用途，其實支撐效能上作用不大。鍛煉好軀幹肌肉就是最好的「天然腰封」。","s":"4.3.1 常用的健康用品－腰封","p":85,"v":"鍛煉好軀幹肌肉就是最好的天然腰封"},{"i":"m1dxqbpp","u":"u4","t":"n","q":"治療完成後，助理離開病人前，下列做法正確的是：","c":"確保病人在安全的休息位置，並有求助方法，避免獨處","w":["讓病人獨處休息，以節省時間及人手","先清潔儀器，之後才處理病人的衣服及姿勢","只需通知病人自行整理衣服便可離開"],"a":0,"e":"善後工作：關機、收拾儀器、幫病人清潔皮膚、詢問不適、整理衣服姿勢；確保病人在安全休息位置，避免令病人獨處，離開前確保有求助方法；通知治療師；清潔儀器；洗手。","s":"4.3.2.4 治療完成後的善後工作","p":86,"v":"應確保患者在安全的休息位置，避免令患者獨處"},{"i":"m1n4lsv","u":"u4","t":"n","q":"關於治療助理在治療時的職責，下列何者正確？","c":"必須嚴格遵守治療師為患者處方治療的安排","w":["可視乎病人情況自行更改治療參數","可替治療師決定是否繼續治療","可略過預備工作，以節省時間"],"a":2,"e":"助理須根據治療師處方執行預備工作、監察治療時的情況（保持溝通、提醒切勿睡著）及善後工作，並通知治療師。","s":"4.3.2 治療助理在進行治療時之職責","p":86,"v":"治療助理必須嚴格遵守治療師為患者處方治療的安排"},{"i":"m3qqvhu","u":"u51","t":"g","q":"運動治療已廣泛應用於促進患者的哪些方面，是復康過程中不可或缺的一環？","c":"關節柔軟度、肌肉力量、心肺耐力","w":["視力、聽力、嗅覺","血型、遺傳基因、骨骼長度","皮膚彈性、毛髮生長、牙齒健康"],"a":3,"e":"運動治療廣泛應用於促進患者的關節柔軟度、肌肉力量、心肺耐力等方面；種類包括伸展運動、抗阻力訓練、耐力運動、平衡運動、協調運動等。","s":"5.1.1 何謂運動治療","p":87,"v":"運動治療已廣泛應用於促進患者的關節柔軟度、肌肉力量、心肺耐力等方面"},{"i":"mjyjnuq","u":"u51","t":"g","q":"下列哪項屬運動在「生理方面」的功能？","c":"增加腸臟活動，減低便秘及患上結腸癌的機會","w":["擴闊社交圈子，與社會保持接觸","減少抑鬱和精神緊張的情緒","提高自我形象，增添自信心"],"a":1,"e":"生理方面還包括：促進血液循環、防止身體過胖、減低患糖尿病／高血壓／心臟病機會、有助控制血糖／高膽固醇／高血壓、強健骨骼肌肉預防骨質疏鬆、強化肌力減慢衰老、促進柔韌性及減低跌倒機會、改善關節僵硬及痛楚、改善胃口及睡眠。其餘三個選項屬心理或社交方面。","s":"5.1.2.1 運動的功能（生理方面）","p":87,"v":"增加腸臟活動，減低便秘及患上結腸癌的機會"},{"i":"mhwkew9","u":"u51","t":"g","q":"課本所列的「生命表徵」包括：","c":"體溫、脈搏、呼吸、血壓","w":["體溫、脈搏、血壓、血糖","體重、脈搏、呼吸、血壓","體溫、心電圖、呼吸、血氧"],"a":1,"e":"量度生命表徵的方法包括體溫、脈搏、呼吸、血壓（工作紙四另要求列出血氧）；運動前後及進行時，均要進行監察及記錄。","s":"5.1.4 量度生命表徵的方法","p":88,"v":"包括：體溫、脈搏、呼吸、血壓"},{"i":"mucraib","u":"u51","t":"r","q":"下列哪一項「不是」課本所列的體溫量度方法？","c":"腳探","w":["耳探","腋探","額探"],"a":3,"e":"課本列出的體溫量度方法：耳探、肛探、腋探、口探、額探。","s":"5.1.4.1.1 體溫 量度方法","p":89,"v":"量度方法：耳探、肛探、腋探、口探、額探"},{"i":"m5fjsnu","u":"u51","t":"r","q":"成人的正常體溫一般為（攝氏）：","c":"36.1-37.5℃","w":["35.0-36.0℃","36.5-38.5℃","37.5-38.5℃"],"a":0,"e":"成人正常體溫一般為 36.1-37.5℃，並沒有一個絕對度數；會隨每日不同時段、活動狀況和量度部位而稍有差異。","s":"5.1.4.1.2 體溫 正常值","p":89,"v":"成人正常體溫一般為36.1-37.5℃","k":"工作紙四 體溫"},{"i":"mm45qe3","u":"u51","t":"n","q":"關於體溫量度，下列何者正確？","c":"肛探原則上最準確，但較遲反映中心體溫的轉變","w":["額探最能準確反映中心體溫","口探不會受飲食、咳嗽或張口呼吸影響","耳探時毋須對準耳膜"],"a":2,"e":"額探只反映皮膚溫度，不能準確反映中心體溫；口探會受飲食、咳嗽、張口呼吸影響；耳探量度耳膜溫度，必須對準耳膜；腋探較難固定溫度計於腋下。","s":"5.1.4.1.3 體溫測量的準確性","p":89,"v":"肛探較遲反映中心體溫的轉變，但原則上最準確"},{"i":"m1dpfnco","u":"u51","t":"n","q":"使用耳溫計時，為令外耳道較直，最好：","c":"將耳廓稍微往後上方拉","w":["將耳廓向前下方拉","將耳廓用力向下拉","毋須拉動耳廓"],"a":2,"e":"由於外耳道不是直線，測量時最好將耳廓稍微往後上方拉，並對準耳膜；耳垢太多或耳套髒了可能影響準確性。","s":"5.1.4.1.3 體溫測量的準確性（耳探）","p":89,"v":"由於外耳道不是直線，測量時最好將耳廓稍微往後上方拉"},{"i":"mczjo3q","u":"u51","t":"r","q":"量度脈搏的方法包括：","c":"觸摸橈動脈／頸動脈，或聽診（心尖跳）","w":["觀察胸部的起伏，留意呼吸的頻率及深度","用袖帶充氣後，聽診肱動脈的聲音","把耳溫計放入耳道，量度耳膜的溫度"],"a":0,"e":"脈搏是心臟將血液泵出主動脈後，在彈性動脈系統中產生的搏動；正常狀態下脈搏速率等於心跳速率，應整齊、有節奏及連貫。觀察胸部起伏是量度呼吸。","s":"5.1.4.2.1 脈搏 量度方法","p":91,"v":"觸摸橈動脈／頸動脈"},{"i":"mtmf25n","u":"u51","t":"r","q":"成年人的正常脈搏率及呼吸率，分別約為每分鐘：","c":"60-100 次；16-20 次","w":["50-90 次；12-16 次","60-100 次；30-40 次","80-120 次；16-20 次"],"a":1,"e":"成人脈搏 60-100 次／分；呼吸（次／分鐘）：成人 16-20、嬰兒 30-40、小孩 20-25。","s":"5.1.4.2.2 脈搏 正常值／5.1.4.3.2 呼吸 正常值","p":91,"v":"成年人的正常脈搏為每分鐘60-100次","k":"工作紙四 脈搏、呼吸"},{"i":"mhqcx8v","u":"u51","t":"r","q":"按課本，嬰兒的正常呼吸次數約為每分鐘：","c":"30-40 次","w":["16-20 次","20-25 次","12-16 次"],"a":3,"e":"呼吸正常值（次／分鐘）：成人 16-20；嬰兒 30-40；小孩 20-25；量度方法是觀察，並留意呼吸的頻率、深度與節律。","s":"5.1.4.3.2 呼吸 正常值","p":91,"v":"嬰兒30-40"},{"i":"mddvbnj","u":"u51","t":"o","q":"使用電子血壓計時，如有任何懷疑，應以哪種血壓計為準？","c":"水銀血壓計","w":["手腕式電子血壓計","手臂式電子血壓計","智能手錶的血壓功能"],"a":3,"e":"電子血壓計可用於手臂或手腕，手臂式比較準確（手腕式必須置於與心臟同一水平，可靠性較低）；如有任何懷疑，應以水銀血壓計為準。","s":"5.1.4.4.1 血壓 量度方法","p":91,"v":"如有任何懷疑，應以水銀血壓計為準"},{"i":"m1xthyn6","u":"u51","t":"n","q":"「當心室放鬆時，血液在血管壁所造成的壓力」稱為：","c":"舒張壓（下壓）","w":["收縮壓（上壓）","脈搏壓","平均動脈壓"],"a":0,"e":"心臟收縮時血液在血管壁造成的壓力稱收縮壓（上壓）；心室放鬆時造成的壓力稱舒張壓（下壓）。","s":"5.1.4.4 血壓（Blood Pressure）","p":91,"v":"當心室放鬆時，血液在血管壁所造成壓力稱為舒張壓（下壓）"},{"i":"m142i8iv","u":"u51","t":"n","q":"以下哪個血壓讀數（收縮壓／舒張壓，mmHg）屬於「第一階段高血壓」？","c":"148/94","w":["118/78","128/84","168/104"],"a":1,"e":"理想血壓 <120／<80；高血壓前期 120-139／80-89；第一階段高血壓 140-159／90-99；第二階段高血壓 >160／>100。","s":"5.1.4.4.2 成年人的血壓水平分類標準","p":93,"v":"第一階段高血壓"},{"i":"mxpx07d","u":"u51","t":"n","q":"使用血壓計時，袖帶（Cuff）在未充氣前的鬆緊程度應：","c":"只緊貼上臂（Tight-Fit）","w":["愈緊愈好","鬆鬆地圍著手臂，預留一個拳頭的空隙","可隔著厚衣物綁上"],"a":2,"e":"袖帶要直接置於上臂，中間沒有任何阻隔；寬度覆蓋手臂長度的三分之二，長度足夠完全圍繞手臂；喉管靠近肱動脈；手臂承托高度與心臟同一水平。","s":"5.1.4.4.3 使用血壓計時的要點","p":93,"v":"袖帶的鬆緊程度，未充氣前應只緊貼上臂"},{"i":"mrznzhj","u":"u51","t":"n","q":"量度血壓時，兩次讀數相差超過多少毫米水銀柱（mmHg），便要再量度？","c":"5","w":["1","10","20"],"a":0,"e":"如果兩者相差超過 5 毫米水銀柱，就要再量度；每次量度後須記錄日期、時間和血壓度數，以供醫護人員參考。","s":"5.1.4.4.3 使用血壓計時的要點","p":93,"v":"如果兩者相差超過5毫米水銀柱，就要再量度"},{"i":"m1w7p6kc","u":"u51","t":"n","q":"按課本採用的亞洲標準，BMI 為 25.0-29.9 屬於：","c":"肥胖","w":["過重","正常","非常肥胖"],"a":2,"e":"亞洲標準：<18.5 過輕；18.5-22.9 正常；23.0-24.9 過重；25.0-29.9 肥胖；≥30 非常肥胖。BMI＝體重（公斤）÷身高（米）的平方。","s":"5.1.5 體重指標（BMI）","p":94,"v":"肥胖25.0–29.9"},{"i":"m17m2pwl","u":"u51","t":"g","q":"運動處方原則「F.I.T.T.V.P.」的六個元素是：","c":"頻率、強度、性質、時間、總和、進度","w":["頻率、強度、姿勢、時間、總和、進度","頻率、速度、性質、時間、總和、進度","頻率、強度、性質、時間、目標、進度"],"a":1,"e":"F＝Frequency 頻率；I＝Intensity 強度；T＝Type 性質；T＝Time 時間；V＝Volume 總和；P＝Progression 進度。","s":"5.1.6 運動處方","p":94,"v":"F.I.T.T.V.P."},{"i":"muo589q","u":"u51","t":"g","q":"帶氧運動的建議頻率為：","c":"每週 3-5 次（隔天進行）","w":["每週 1 次","每週 2 次","每天 3 次"],"a":3,"e":"帶氧運動例子：頻率每週 3-5 次（隔天進行）；強度約最高心率的 60-85%；性質為大肌肉有氧運動；時間每次連續 15-60 分鐘。","s":"5.1.6.1 運動處方（帶氧運動例子）","p":94,"v":"每週3-5次（隔天進行）"},{"i":"m8uyoqx","u":"u51","t":"g","q":"一位 60 歲長者進行帶氧運動，按筆記公式，其最高心率及 60-85% 目標心率約為：","c":"最高心率 160；目標約 96-136 次/分","w":["最高心率 160；目標 60-85 次/分","最高心率 140；目標約 84-119 次/分","最高心率 220；目標約 132-187 次/分"],"a":1,"e":"最高心率＝220－年齡＝220－60＝160；60% ＝96；85% ＝136。","s":"5.1.6.1 運動處方（強度）","p":94,"v":"最高心率的計算220–年齡","sc":1},{"i":"mxuhv3t","u":"u51","t":"g","q":"運動停止後立刻量度脈搏 6 秒，應把結果乘以多少，才得出每分鐘心跳率？","c":"10","w":["6","12","60"],"a":0,"e":"量度方法：運動停止後立刻量度脈搏（可按在腕動脈或頸動脈上）6 秒再乘以 10；或量度 10 秒再乘以 6。","s":"5.1.6.1 運動處方（強度）","p":94,"v":"運動停止後立刻量度脈搏"},{"i":"mdfh9s6","u":"u51","t":"g","q":"利用「辛苦感覺程度（RPE）」監察運動強度，缺點是：","c":"資料較主觀","w":["價錢昂貴","需要專門儀器","不能將資料數據化"],"a":3,"e":"RPE 優點：經濟方便、將資料數據化；缺點：資料較主觀。","s":"5.1.7.1 辛苦感覺程度（RPE）","p":95,"v":"但資料較主觀"},{"i":"m1yw1uwr","u":"u51","t":"g","q":"筆記文字中，「自覺竭力程度（RPE）」建議的運動強度一般應控制在：","c":"5-7 之間，並按個人體能調節","w":["1-3 之間","8-10 之間","17-20 之間"],"a":2,"e":"筆記文字：運動強度一般應控制在 5-7 之間，並須按個人體能相應調節。注意筆記附圖是 6-20 級量表（12-13 級＝中強度、14-16＝中高強度、17-20＝高強度）；如題目明確指 6-20 級量表，則按圖表判斷。","s":"5.1.7.1 辛苦感覺程度（RPE）","p":95,"v":"運動強度一般應控制在5-7之間"},{"i":"m1aeuamw","u":"u51","t":"n","q":"健康正常的人體，血含氧量應在：","c":"97-99% 之間","w":["85-90% 之間","90-93% 之間","100% 以上"],"a":2,"e":"血含氧量低於 90% 表示低血氧症，患者可能出現口唇／皮膚發紫。","s":"5.1.7.3.3 血氧正常值","p":97,"v":"一個健康正常的人體其血含氧量應在97-99%之間","k":"工作紙四 血氧"},{"i":"m1wgpoc8","u":"u51","t":"n","q":"關於血含氧量測量機（Oximeter），下列何者正確？","c":"貧血患者的血氧飽和度可能仍是 100%，但輸氧量較少","w":["貧血患者的血氧飽和度必然偏低，必定低於 90%","可在正量血壓的同一側手指監測，不受影響","可準確反映肺部空氣流通量及心臟的狀態"],"a":3,"e":"血氧機只量度血紅蛋白的氧氣飽和度；不可在使用止血帶、正量血壓的一邊或打點滴的同側手指監測；亦不能量度肺部空氣流通量或反映心臟狀態。","s":"5.1.7.3.4 血氧機的使用限制","p":98,"v":"貧血患者的血氧飽和度可能為100%"},{"i":"mmk4f04","u":"u51","t":"n","q":"長者運動前量度血氧，讀數為 88%，口唇略帶發紫。最適當的處理是：","c":"低於 90% 屬低血氧，應停止運動並向上級報告","w":["屬正常範圍，可照常運動，毋須處理","只需請長者多飲水，之後便可繼續運動","等十分鐘後再量度，期間可繼續運動"],"a":0,"e":"血氧正常 97-99%；低於 90% 屬低血氧症，患者可能口唇／皮膚發紫。量度到異常數值應即向上級報告，不宜繼續運動。","s":"5.1.7.3.3 血氧正常值","p":97,"v":"如血含氧量低於90%，表示低血氧症","sc":1},{"i":"m1rcb6tv","u":"u51","t":"g","q":"下列哪項是伸展運動的目的？","c":"改善關節的活動幅度及關節周邊軟組織的柔韌性","w":["增加肌肉體積及爆發力","增加骨密度，減少骨折的機會","增強背肌的力量，改善身體的姿勢"],"a":1,"e":"伸展運動（拉筋）目的：鬆弛肌肉增加血液循環；改善關節活動幅度及軟組織柔韌性；減低運動受傷風險及運動後肌肉緊張；減低因肌肉繃緊或抽筋引致的疼痛；預防及治療肌腱勞損。後兩個錯誤選項屬阻力訓練的目的。","s":"5.2.1.1.1 伸展運動 目的","p":100,"v":"改善關節的活動幅度及關節周邊軟組織的柔韌性"},{"i":"m7t8fx7","u":"u51","t":"g","q":"適合為長期卧床患者進行的伸展方式是：","c":"被動式伸展","w":["主動式伸展","輔助性伸展（協助性加力）","動態彈震式伸展"],"a":1,"e":"伸展訓練方法：主動式（無需器材輔助，可站立或坐下）、輔助性（如協助性加力）、被動式（適合為長期卧床患者進行）。","s":"5.2.1.1.2 伸展運動 訓練方法","p":100,"v":"被動式伸展（適合為長期卧床患者進行）"},{"i":"m1osvgeo","u":"u51","t":"g","q":"下列何者屬阻力訓練（強化運動）的訓練方法？","c":"對抗重力的主動運動（如利用重物或自身重量）","w":["由治療師完全代替病人活動其肢體（被動）","病人完全放鬆，不作任何肌肉收縮的運動","只在水中進行，以浮力完全消除重力的影響"],"a":0,"e":"阻力訓練方法：對抗重力的主動運動；對抗治療師阻力的肌肉收縮動作；對抗橡筋帶。例子：舉啞鈴／水樽、踢沙包、仰臥起坐、掌上壓。","s":"5.2.1.2.2 阻力訓練 訓練方法","p":100,"v":"對抗重力的主動運動（如利用重物、地心吸力、自身重量）"},{"i":"mtxlgtv","u":"u51","t":"g","q":"呼吸運動的訓練方法包括：","c":"腹式呼吸及協調噘唇呼吸","w":["快速淺呼吸及屏息","用力屏息後急速呼氣","以口急速吸氣及以鼻呼氣"],"a":3,"e":"呼吸運動目的：改善呼吸的效率、減少呼吸時的負荷；一般方法：合嘴，以鼻孔慢慢吸氣，使肺部擴張，然後用口呼氣。","s":"5.2.1.5.2 呼吸運動 訓練方法","p":103,"v":"協調噘唇呼吸"},{"i":"m1wwsnxa","u":"u51","t":"g","q":"協調運動的訓練方法包括：","c":"兒童的手腦及手眼協調訓練，以及瑜伽、太極","w":["舉啞鈴、踢沙包及使用橡筋帶的阻力運動","腹式呼吸及協調噘唇呼吸的呼吸運動","被動式伸展及被動式關節活動的運動"],"a":2,"e":"協調運動目的：改善身體的協調能力、提升身體的靈敏度（Agility）。","s":"5.2.1.7 協調運動","p":104,"v":"兒童的手腦及手眼協調訓練"},{"i":"mxgvafu","u":"u51","t":"n","q":"「透過刺激本體感覺來增進神經與肌肉間的控制，利用反射原理放鬆肌肉」的伸展技術是：","c":"本體覺神經肌肉促進法（PNF）","w":["被動式伸展","輔助主動運動","懸掛式運動"],"a":3,"e":"PNF（Proprioceptive Neuromuscular Facilitation）：先作被動伸展 20-30 秒，指示接受伸展者作對抗肌肉主動收縮及與協助者對抗，再作被動伸展 20-30 秒。","s":"5.2.2.2 主動輔助性運動（c PNF）","p":105,"v":"透過刺激本體感覺來達到增進神經與肌肉間的控制"},{"i":"ma3l5nx","u":"u51","t":"n","q":"一位糖尿病患者問如何安排運動才能有效控制血糖。最適當的建議是：","c":"最少隔天運動一次，理想為每週五次","w":["每週一次已足夠","只需在血糖偏高時才運動","每月三次，每次運動時間愈長愈好"],"a":1,"e":"增加胰島素的敏感度會於運動後 48-72 小時逐漸減弱，所以想控制血糖應最少隔天運動；最理想是每週五次。耐力運動較易執行，危險性也較抗阻訓練低，是糖尿病運動計劃的首選。","s":"5.2.1.3.4 心肺功能訓練 對糖尿病患者的影響","p":102,"v":"若期望達致控制血糖效果，應最少隔天進行運動","sc":1},{"i":"mn3d9lv","u":"u51","t":"n","q":"一般運動小組（約 45-60 分鐘）中，「熱身運動」及「主題運動」的建議時間分別約為：","c":"10-15 分鐘；20-30 分鐘","w":["5 分鐘；30 分鐘","20-30 分鐘；10-15 分鐘","15 分鐘；45 分鐘"],"a":2,"e":"運動小組流程：熱身 10-15 → 主題運動 20-30 → 緩和運動 5 → 伸展及總結 5（分鐘）。","s":"5.3.3.2 運動小組流程","p":107,"v":"熱身運動（約10-15分鐘）"},{"i":"m6rods4","u":"u51","t":"n","q":"「運動三步曲」是指：","c":"熱身及伸展 → 正式運動 → 緩和及重複伸展","w":["熱身及伸展 → 正式運動 → 完全休息","伸展 → 正式運動 → 熱身及緩和","正式運動 → 熱身及伸展 → 緩和運動"],"a":0,"e":"每次運動時的正確模式應包括運動前的熱身運動及伸展運動，然後才開始正式運動，運動後也應作緩和及重複伸展運動。","s":"5.3.3.4 運動須知（a）","p":108,"v":"緊記「運動三步曲」"},{"i":"m1lhofyt","u":"u51","t":"n","q":"下列哪種情況「不適宜」進行運動？","c":"胸口絞痛","w":["輕微出汗","運動前已作熱身","血壓穩定"],"a":0,"e":"不適宜運動：發燒、胸口絞痛、身體劇痛、暈眩、噁心、嘔吐、血壓不穩定、糖尿病控制不佳等。","s":"5.3.3.4 運動須知（e）","p":109,"v":"發燒、胸口絞痛、身體劇痛、暈眩、噁心、嘔吐、血壓不穩定及糖尿病控制不佳等"},{"i":"m11jd2if","u":"u51","t":"n","q":"在長者運動班中，助理見一位長者做練力運動時用力閉氣。最適當的做法是：","c":"提醒他保持正常呼吸，因閉氣會令血壓急升","w":["鼓勵他閉氣用力，以發揮更大的肌肉力量","立即增加阻力，使運動更具挑戰性","不用理會，因為閉氣屬於正常的用力方式"],"a":1,"e":"運動須知：保持正常呼吸，進行練力運動時切忌用力時閉氣，否則會令血壓急升；正確節奏是用力時呼氣、放鬆時吸氣。","s":"5.3.3.4 運動須知（c）","p":108,"v":"進行練力運動時切忌用力時閉氣，否則會令血壓急升","sc":1},{"i":"mq6cagm","u":"u51","t":"n","q":"協助病人伸展時，下列何者正確？","c":"詢問可接受的力度及幅度，並面向病人留意其面部表情","w":["毋須詢問病人，按自己的判斷決定用力的大小","背向病人，並以專注的神情保障病人的私隱","盡量接觸傷口，以便隨時檢查傷口的情況"],"a":3,"e":"接觸病人時：保持溝通或詢問感覺；協助伸展時詢問力度及可接受幅度；應專業及肯定地接觸；盡量避免接觸傷口；盡量面向病人留意面部表情。接觸後：確保在安全休息位置，避免令病人獨處。","s":"5.3.4.3 協助個別運動 注意事項（b 接觸病人時）","p":110,"v":"如協助伸展時，應詢問病人伸展的力度及可接受的幅度"},{"i":"m1m5p6at","u":"u54","t":"g","q":"關於輪椅使用者的坐姿，下列何者「不」正確？","c":"雙手放在扶手外側垂下","w":["身體挺直，背部貼近輪椅背","雙腳放在腳踏上","扣上安全帶，鬆緊適中"],"a":2,"e":"輪椅上的坐姿：身體挺直、背部貼近輪椅背；雙腳放在腳踏上；雙手放在兩邊扶手之內；扣上安全帶，鬆緊適中；留意受助者是否坐得平穩及舒適；檢查衣物或其他物件有否絆著後輪。","s":"5.4.3.3.1 輪椅上的坐姿","p":116,"v":"身體挺直，背部貼近輪椅背"},{"i":"m1tf8fni","u":"u54","t":"r","q":"採用「之」或「Z」字路線上落坡度大的斜坡，主要好處是：","c":"減低行走路段的斜度，減低輪椅倒溜失控的風險","w":["縮短行走距離，節省推輪椅所需的時間","令輪椅速度加快，減少照顧者的體力消耗","毋須鎖上
